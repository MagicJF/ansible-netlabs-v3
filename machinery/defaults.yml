---
# ===========================================================================
# EL ANDAMIAJE DEL MARCO — lo que TODOS los laboratorios comparten.
#
# Un laboratorio escribe SÓLO lo suyo: sus sedes, sus cableados, sus equipos. Lo
# que no escriba, lo pone este fichero. La fusión es PROFUNDA (shadowing): un lab
# que declare `pve_defaults: {memory: 4096}` cambia la memoria y CONSERVA el resto
# de `pve_defaults` — no tiene que repetir el bloque entero, y no pierde nada sin
# que nadie se lo diga.
#
# Las listas y los escalares SÍ se sustituyen enteros: una lista no se puede
# entremezclar sin inventar un orden que nadie declaró.
#
# Se resuelve en UN solo sitio —`declaracion.fusionar()`— y lo consumen los dos
# caminos: las herramientas Python y el envoltorio `./lab`, que pasa a Ansible la
# declaración YA FUNDIDA. Una sola implementación, o habría dos que se desincronizan.
#
# Aquí NO va nada de una topología: ni sedes, ni direcciones, ni equipos, ni vmids.
# ===========================================================================
lab_clases: {}
lab_control_network: 10.99.99.0/24
lab_control_via: 10.10.10.1
lab_familias:
- letra: C
  nombre: central
- letra: S
  nombre: sedes
- letra: I
  nombre: infraestructura
- letra: G
  nombre: gestión
- letra: B
  nombre: borde
lab_internet_dns: 1.1.1.1
lab_internet_gateway: 10.10.10.1
lab_mgmt_bridge: vmbr1
lab_mgmt_gateway: 10.10.10.1
lab_mgmt_network: 10.10.10.0/24
lab_mgmt_otros: {}
lab_sede: '{{ dict(lab_sites | map(attribute=''id'') | zip(lab_sites)) }}'
lab_sedes_extra:
  Ga: gestión
  Ba: borde
pve_chr_defaults:
  onboot: true
  startup:
  - order=2
  cores: 1
  memory: 256
  status: started
  manage: true
  cloudinit: false
  machine: pc
  boot: order=scsi0
  scsi:
    scsi0: local-zfs:1
  disk_import:
  - key: scsi0
    source: local:import/chr-7.25.1.raw
  serial:
    serial0: socket
  vga: serial0
  description: 'MikroTik RouterOS: una funcion de red, un equipo. Gestionado por REST.'
  tags:
  - netlab
  - routeros
  - red
  - ansible
pve_defaults:
  swap: 512
  searchdomain: null
  template_storage: local
  pubkey: '{{ lookup(''file'', pve_ssh_key_path ~ ''.pub'', errors=''ignore'') | default('''', true) | trim }}'
  features: []
  mount_devices: []
  tags:
  - netlab
  - ansible
  ostype: debian
  cmode: shell
  template: local:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst
  rootfs_size: 8
  cpuunits: 1024
  hookscript: null
  netif: {}
  timezone: host
  unprivileged: true
  onboot: false
  nameserver: null
  mounts: {}
  cores: 2
  storage: local-zfs
  startup: []
  status: started
  memory: 2048
pve_log_retention:
  live_max_mb: 8
  keep_days: 14
  keep_count: 10
pve_node: Proxmox
pve_power_gap_after:
  1: 10
pve_power_ready_timeout: 180
pve_power_start_timeout: 240
pve_public_bridge: vmbr0
pve_tag_style:
  shape: full
pve_tunnel:
  name: wg-lab
  address: 10.99.99.2/24
pve_vm_defaults:
  bios: seabios
  machine: q35
  scsihw: virtio-scsi-single
  ostype: l26
  status: stopped
  sockets: 1
  cpu: host
  vga: std
  onboot: false
  boot: order=ide2;scsi0
  description: Nested Proxmox VE managed by ansible-netlabs-v3.
  tags:
  - netlab
  - ansible
  net: {}
  scsi: {}
  sata: {}
  ide: {}
  virtio: {}
  cloudinit: true
  cloudinit_storage: local-zfs
  ciuser: root
  sshkeys: '{{ pve_defaults.pubkey }}'
