---
# PROPÓSITO: converger por API REST el estado declarado de un invitado RouterOS.
# INVARIANTES: solo REST (nunca SSH ni la API binaria 8728); el servicio `www` no se
#   cierra; la dirección declarada es estática, no un residuo dinámico; toda ruta
#   declarada debe estar INSTALADA, no solo presente.
# LÍMITES: RouterOS no borra una ruta ni una address dinámica huérfana («created by a
#   different owner»): la ruta por defecto que deja el DHCP de fábrica se purga con un
#   reinicio controlado (ADR 0003).
# VER: docs/decisiones/0001-solo-api.md, 0002-bootstrap-existe.md, 0003-reinicio-purga-ruta-dhcp.md;
#   comprobación: los asserts de este rol y framework_check.py.
# ===========================================================================
# routeros — converge the declared state of a MikroTik RouterOS guest over its
# REST API. See the role's defaults for why REST and not the binary API.
#
# Every task below is ansible.builtin.uri. The router is addressed at
# `ansible_host` (built from the `addresses` entry on ether1 in the manifest),
# because the play that includes this role runs on the control node.
# ===========================================================================
- name: Refuse a RouterOS declaration without an identity or addresses
  ansible.builtin.assert:
    that:
      - l2_config.routeros.identity is defined
      - (l2_config.routeros.addresses | default([])) | length > 0
      # `www` is the road this role itself travels (REST over HTTP): a
      # declaration that closed it would lock the framework out of the device it
      # is converging, with no way back in over the network.
      - "'www' not in (l2_config.routeros.services | default(routeros_disabled_services, true))"
    fail_msg: >-
      config.routeros needs an `identity` and at least one `addresses` entry
      ({address, interface}). The addresses are what make the router reachable
      at a known place instead of on whatever a DHCP server hands out.
    success_msg: >-
      RouterOS declaration is well formed: identity {{ l2_config.routeros.identity }},
      {{ l2_config.routeros.addresses | length }} address(es).

# --- which password does this router answer to? ----------------------------
# A CHR image ships with the factory-empty password. The probe is also the
# handshake: if the declared password is refused but the factory one is not,
# this is a router that has not been given its password yet, and this run both
# logs in with the factory one and sets the declared one at the end.
- name: Ask the router its identity, with the password the declaration carries
  ansible.builtin.uri:
    url: "{{ routeros_base }}/system/identity"
    method: GET
    url_username: "{{ routeros_user }}"
    url_password: "{{ routeros_password }}"
    force_basic_auth: true
    status_code: [200, 401]
    return_content: true
    timeout: "{{ routeros_timeout }}"
  register: routeros_auth
  failed_when: false
  # The answer says whether the password is already set. It is not a change.
  changed_when: false

- name: Decide which password this run logs in with
  ansible.builtin.set_fact:
    routeros_login_password: >-
      {{ '' if (routeros_auth.status | default(0) | int) == 401 else routeros_password }}
    # Only worth setting when the router still answers the factory password and
    # the declaration actually carries one.
    routeros_password_to_set: >-
      {{ routeros_password if ((routeros_auth.status | default(0) | int) == 401
                               and routeros_password | length > 0) else '' }}

- name: Report how this run authenticated
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} ({{ ansible_host }}): the declared password was
      {{ 'refused, so this run logs in with the factory-empty one and will set the declared one'
         if routeros_password_to_set | length > 0 else 'accepted (or no password is declared)' }}.

# --- read -----------------------------------------------------------------
- name: Read the router's state
  ansible.builtin.include_tasks: read.yml

- name: Keep the reading this run decides from
  ansible.builtin.set_fact:
    ros: "{{ routeros_read_index }}"

- name: Reduce the identity to a plain name
  # RouterOS answers a single-record menu either as an object or as a
  # one-element list; both are normalised to a string here.
  ansible.builtin.set_fact:
    ros_identity_name: >-
      {{ (ros.identity.name if ros.identity is mapping
          else (ros.identity | first).name) | default('') }}

- name: Say what the router had
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: identity "{{ ros_identity_name }}",
      {{ ros.bridges | default([]) | length }} bridge(s),
      {{ ros.bridge_ports | default([]) | length }} bridge port(s),
      {{ ros.addresses | default([]) | length }} address(es),
      {{ ros.dhcp_clients | default([]) | length }} DHCP client(s),
      {{ ros.dhcp_servers | default([]) | length }} DHCP server(s),
      {{ ros.dhcp_leases | default([]) | length }} lease(s).

# --- decide ---------------------------------------------------------------
- name: Compute the REST calls this router needs
  ansible.builtin.set_fact:
    routeros_plan: >-
      {{ lookup('template', role_path ~ '/templates/plan.j2') | from_json }}

- name: Report the plan, call by call, before sending anything
  ansible.builtin.debug:
    msg: >-
      {{ routeros_plan | length }} REST call(s) needed
      {{ '(the router is already in the declared state)' if routeros_plan | length == 0 else '' }}
  changed_when: false

- name: Show every call
  ansible.builtin.debug:
    msg: "{{ item.method }} /rest/{{ item.path }} {{ (item.body | default({})) | to_json }}"
  loop: "{{ routeros_plan }}"
  loop_control:
    label: "{{ item.method }} {{ item.path }}"
  changed_when: false

# --- write ----------------------------------------------------------------
# One REST call per change, each one attributable in the output. A call that
# fails does NOT abort the run here on purpose: the re-read below is what proves
# the router's state, and a single failure reported in one place beats a run
# that dies halfway with the router in an unknown state.
- name: Converge the router over its REST API
  ansible.builtin.uri:
    url: "{{ routeros_base }}/{{ item.path }}"
    method: "{{ item.method }}"
    body_format: "{{ 'json' if item.body is defined else 'raw' }}"
    body: "{{ item.body | default(omit) }}"
    url_username: "{{ routeros_user }}"
    url_password: "{{ routeros_login_password }}"
    force_basic_auth: true
    status_code: [200, 201, 204]
    return_content: true
    timeout: "{{ routeros_timeout }}"
  loop: "{{ routeros_plan }}"
  loop_control:
    label: "{{ item.method }} {{ item.path }}"
  register: routeros_calls
  changed_when: true
  failed_when: false

- name: Report every call that did not come back clean
  ansible.builtin.debug:
    msg: >-
      {{ item.item.method }} /rest/{{ item.item.path }} -> HTTP
      {{ item.status | default('no answer') }}: {{ item.msg | default('') }}
      {{ '(tolerated: the swap takes the router own address away for an instant, so a lost answer here is expected)'
         if item.item.tolerant | default(false) else '' }}
  loop: "{{ routeros_calls.results | default([]) }}"
  loop_control:
    label: "{{ item.item.method }} {{ item.item.path }}"
  changed_when: false
  when: item.status | default(0) | int not in [200, 201, 204]

# --- verify ---------------------------------------------------------------
- name: Read the router's state again
  ansible.builtin.include_tasks: read.yml

- name: Keep the reading this run verifies against
  ansible.builtin.set_fact:
    ros_after: "{{ routeros_read_index }}"

- name: Reduce the identity to a plain name
  ansible.builtin.set_fact:
    ros_after_identity_name: >-
      {{ (ros_after.identity.name if ros_after.identity is mapping
          else (ros_after.identity | first).name) | default('') }}

- name: The router must carry the declared identity
  ansible.builtin.assert:
    that:
      - ros_after_identity_name == l2_config.routeros.identity
    fail_msg: >-
      The router reports identity "{{ ros_after_identity_name }}" but the
      declaration says "{{ l2_config.routeros.identity }}".
    success_msg: "Identity is {{ ros_after_identity_name }}, as declared."

- name: Every declared address must be on the router
  ansible.builtin.assert:
    that:
      - found | length > 0
    fail_msg: >-
      {{ item.address }} is not on {{ item.interface }}. The router reports:
      {{ ros_after.addresses | default([]) | map(attribute='address') | join(', ') }}.
    success_msg: "{{ item.address }} is on {{ item.interface }}, as declared."
  vars:
    found: >-
      {{ ros_after.addresses | default([]) | selectattr('address', 'equalto', item.address)
         | selectattr('interface', 'equalto', item.interface) | list }}
  loop: "{{ l2_config.routeros.addresses }}"
  loop_control:
    label: "{{ item.address }} {{ item.interface }}"

- name: Every declared address must be static, not a leftover of a retired client
  ansible.builtin.assert:
    that:
      - (found | first).dynamic | default('false') | string | lower != 'true'
    fail_msg: >-
      {{ item.address }} on {{ item.interface }} exists only as a DYNAMIC entry that
      a retired DHCP client left behind. RouterOS refuses to promote such an entry
      and (measured) refuses to delete it when its owner is gone, so this cannot be
      converged by the API: recreate the device. It matters because a dynamic
      address is not saved, so the device would not come back with it after a
      reboot, and it would be left with no address at all.
    success_msg: "{{ item.address }} is a static address on {{ item.interface }}, as declared."
  vars:
    found: >-
      {{ ros_after.addresses | default([]) | selectattr('address', 'equalto', item.address)
         | selectattr('interface', 'equalto', item.interface) | list }}
  loop: "{{ l2_config.routeros.addresses }}"
  loop_control:
    label: "{{ item.address }} {{ item.interface }}"

- name: Every declared route must be on the router AND installed
  ansible.builtin.assert:
    that:
      - activas | length > 0
      - estaticas | length <= 1
    fail_msg: >-
      {{ item.dst_address }} via {{ item.gateway }} is not an ACTIVE route on the
      router, or it is stored twice as a static one. A route can be stored and
      still inactive — that is exactly what happens when its gateway is not
      reachable — so this asserts the route is INSTALLED, not merely present. A
      dynamic twin is tolerated ON PURPOSE: RouterOS refuses to delete a dynamic
      route whose owner (a retired DHCP client) is gone — measured — so the count
      can be 2 while only one of them is ours. The router reports:
      {{ ros_after.routes | default([]) | map(attribute='dst-address') | join(', ') }}.
    success_msg: "{{ item.dst_address }} via {{ item.gateway }} is installed, as declared."
  vars:
    activas: >-
      {{ ros_after.routes | default([]) | selectattr('dst-address', 'equalto', item.dst_address)
         | selectattr('gateway', 'equalto', item.gateway)
         | selectattr('active', 'defined') | selectattr('active', 'equalto', 'true') | list }}
    estaticas: >-
      {{ ros_after.routes | default([]) | selectattr('dst-address', 'equalto', item.dst_address)
         | selectattr('gateway', 'equalto', item.gateway)
         | selectattr('static', 'defined') | selectattr('static', 'equalto', 'true') | list }}
  loop: "{{ l2_config.routeros.routes | default([]) }}"
  loop_control:
    label: "{{ item.dst_address }} via {{ item.gateway }}"

- name: Every declared bridge must exist with exactly its declared ports
  ansible.builtin.assert:
    that:
      - live_ports | length == (item.ports | default([]) | length)
    fail_msg: >-
      Bridge {{ item.name }} should carry {{ item.ports | default([]) | join(', ') }}
      but the router reports {{ live_ports | join(', ') }}.
    success_msg: "Bridge {{ item.name }} carries {{ live_ports | join(', ') }}, as declared."
  vars:
    live_ports: >-
      {{ ros_after.bridge_ports | default([]) | selectattr('bridge', 'equalto', item.name)
         | map(attribute='interface') | list | sort }}
  loop: "{{ l2_config.routeros.bridges | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Every declared DHCP reservation must be on the router, with its address
  ansible.builtin.assert:
    that:
      - live | length == 1
      - (live | first).address == item.address
    fail_msg: >-
      The reservation for {{ item.mac_address }} should be {{ item.address }} but
      the router reports {{ live | map(attribute='address') | join(', ') | default('nothing') }}.
    success_msg: "{{ item.mac_address }} is reserved {{ item.address }}, as declared."
  vars:
    live: >-
      {{ ros_after.dhcp_leases | default([])
         | selectattr('mac-address', 'equalto', item.mac_address) | list }}
  loop: "{{ l2_config.routeros.dhcp_servers | default([]) | map(attribute='leases') | flatten }}"
  loop_control:
    label: "{{ item.mac_address }}"

- name: The factory DHCP client must be gone when the declaration says so
  ansible.builtin.assert:
    that:
      - ros_after.dhcp_clients | default([]) | length == 0
    fail_msg: >-
      config.routeros declares dhcp_client false but the router still runs one on
      {{ ros_after.dhcp_clients | default([]) | map(attribute='interface') | join(', ') }}.
      A DHCP client would add a second, unpredictable address.
    success_msg: "No DHCP client on the router, as declared."
  when: l2_config.routeros.dhcp_client | default(true) is false

- name: Set the declared password when the router was still on the factory one
  ansible.builtin.uri:
    url: "{{ routeros_base }}/user/set"
    method: POST
    body_format: json
    body:
      numbers: "{{ routeros_user }}"
      password: "{{ routeros_password_to_set }}"
    url_username: "{{ routeros_user }}"
    url_password: "{{ routeros_login_password }}"
    force_basic_auth: true
    status_code: [200, 201, 204]
    timeout: "{{ routeros_timeout }}"
  when: routeros_password_to_set | length > 0
  changed_when: true

- name: Confirm the declared password is the one the router now answers to
  ansible.builtin.uri:
    url: "{{ routeros_base }}/system/identity"
    method: GET
    url_username: "{{ routeros_user }}"
    url_password: "{{ routeros_password }}"
    force_basic_auth: true
    status_code: 200
    timeout: "{{ routeros_timeout }}"
  register: routeros_password_check
  changed_when: false
  when: routeros_password_to_set | length > 0

# --- verify: el filtrado y el NAT, releyendo el equipo---
# Se compara lo declarado con lo que el equipo responde DESPUÉS de escribir, en
# dos formas: como conjunto (¿están todas y no sobra ninguna?) y como secuencia
# (¿en el mismo orden?). El orden no es un detalle de estilo: en un firewall la
# primera regla que casa decide, así que dos equipos con las mismas reglas en
# distinto orden filtran distinto. Se comprueba; no se reordena a ciegas.
- name: Reduce the declared firewall and the router's to comparable rows
  ansible.builtin.set_fact:
    fw_declared_rows: >-
      {%- set out = [] -%}
      {%- for menu, rules in [('filter', (l2_config.routeros.firewall | default({})).filter | default([])),
                              ('nat', (l2_config.routeros.firewall | default({})).nat | default([]))] -%}
      {%-   for r in rules -%}
      {%-     set _ = out.append(menu ~ '|' ~ (r.chain | default('')) ~ '|' ~ (r.action | default(''))
                     ~ '|' ~ (r.connection_state | default('')) ~ '|' ~ (r.in_interface | default(''))
                     ~ '|' ~ (r.out_interface | default('')) ~ '|' ~ (r.src_address | default(''))
                     ~ '|' ~ (r.dst_address | default('')) ~ '|' ~ (r.comment | default(''))) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ out }}
    fw_live_rows: >-
      {%- set out = [] -%}
      {%- for menu, key in [('filter', 'firewall_filter'), ('nat', 'firewall_nat')] -%}
      {%-   for l in (ros_after[key] | default([]))
                 if ((l.dynamic | default('false')) | string | lower) != 'true' -%}
      {%-     set _ = out.append(menu ~ '|' ~ (l.chain | default('')) ~ '|' ~ (l.action | default(''))
                     ~ '|' ~ (l['connection-state'] | default('')) ~ '|' ~ (l['in-interface'] | default(''))
                     ~ '|' ~ (l['out-interface'] | default('')) ~ '|' ~ (l['src-address'] | default(''))
                     ~ '|' ~ (l['dst-address'] | default('')) ~ '|' ~ (l['comment'] | default(''))) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ out }}
  when: l2_config.routeros.firewall is defined
  changed_when: false

- name: The router must carry exactly the declared firewall rules
  ansible.builtin.assert:
    that:
      - fw_declared_rows | sort == fw_live_rows | sort
    fail_msg: >-
      Las reglas del firewall no coinciden con lo declarado.
      declarado ({{ fw_declared_rows | length }}): {{ fw_declared_rows | join(' ; ') }}
      el equipo ({{ fw_live_rows | length }}): {{ fw_live_rows | join(' ; ') }}
    success_msg: >-
      Las {{ fw_declared_rows | length }} regla(s) declaradas estan en el equipo,
      y no hay ninguna que la declaracion no pida.
  when: l2_config.routeros.firewall is defined
  changed_when: false

- name: The declared firewall order must be the router's order
  ansible.builtin.assert:
    that:
      - fw_declared_rows == fw_live_rows
    fail_msg: >-
      El equipo tiene las reglas declaradas, pero en OTRO ORDEN. En un firewall
      la primera regla que casa decide, asi que esto filtra distinto.
      declarado: {{ fw_declared_rows | join(' ; ') }}
      el equipo: {{ fw_live_rows | join(' ; ') }}
    success_msg: "El orden del firewall es el declarado (importa: es posicional)."
  when: l2_config.routeros.firewall is defined
  changed_when: false

# --- purga de la ruta por defecto que deja el DHCP de fabrica ---------------
# Un CHR nace con un cliente DHCP en ether1 (configuracion de fabrica de la
# imagen). La convergencia lo desactiva, pero RouterOS NO borra la ruta por
# defecto que ese cliente instalo: queda como dinamica, con el mismo distance
# que la estatica declarada, y el balanceo ECMP manda la mitad del trafico de
# vuelta por la puerta de gestion. Tampoco se puede borrar por API ("cannot
# modify dynamic route created by a different owner", medido). El unico camino
# es un reinicio: con el cliente ya desactivado, la ruta no vuelve. Se reinicia
# solo cuando de verdad hay una ruta asi, asi que un `site` posterior es idempotente.
- name: Detect the DHCP default route that only a reboot can purge
  ansible.builtin.set_fact:
    ros_stale_dhcp_route: >-
      {%- set out = [] -%}
      {%- for r in (ros_after.routes | default([])) -%}
      {%- if (r.get('dst-address') | default('')) == '0.0.0.0/0' and (r.get('dhcp') | default('')) | string | lower == 'true' -%}
      {%- set _ = out.append(r) -%}
      {%- endif -%}
      {%- endfor -%}
      {{- out -}}
  changed_when: false

- name: Announce the reboot that purges the stale DHCP route
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: el DHCP de fabrica dejo {{ ros_stale_dhcp_route | length }}
      ruta(s) por defecto dinamica(s) que la API no puede borrar. Se reinicia una vez
      con el cliente ya desactivado; la ruta no vuelve.
  when: ros_stale_dhcp_route | length > 0

- name: Purge the stale DHCP route with a controlled reboot
  ansible.builtin.uri:
    url: "{{ routeros_base }}/system/reboot"
    method: POST
    url_username: "{{ routeros_user }}"
    url_password: "{{ routeros_login_password }}"
    force_basic_auth: true
    status_code: [200, 204]
    timeout: "{{ routeros_timeout }}"
  when: ros_stale_dhcp_route | length > 0
  changed_when: true
  failed_when: false

- name: Wait for the router to answer again after the reboot
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ routeros_port }}"
    delay: 20
    timeout: "{{ routeros_reboot_timeout | default(180) }}"
    state: started
  when: ros_stale_dhcp_route | length > 0

- name: Read the router's state after the reboot
  ansible.builtin.include_tasks: read.yml
  when: ros_stale_dhcp_route | length > 0

- name: Keep the reading after the reboot
  ansible.builtin.set_fact:
    ros_after_reboot: "{{ routeros_read_index }}"
  when: ros_stale_dhcp_route | length > 0

- name: The stale DHCP route must be gone after the reboot
  ansible.builtin.assert:
    that:
      - stale | length == 0
    fail_msg: >-
      {{ inventory_hostname }} sigue con {{ stale | length }} ruta(s) por defecto
      dinamica(s) tras el reinicio. El DHCP de fabrica volvio a instalarla: hay que
      crear el CHR sin ese cliente, no basta con desactivarlo despues.
    success_msg: "La ruta por defecto dinamica desaparecio con el reinicio; queda solo la declarada."
  vars:
    stale: >-
      {%- set out = [] -%}
      {%- for r in (ros_after_reboot.routes | default([])) -%}
      {%- if (r.get('dst-address') | default('')) == '0.0.0.0/0' and (r.get('dhcp') | default('')) | string | lower == 'true' -%}
      {%- set _ = out.append(r) -%}
      {%- endif -%}
      {%- endfor -%}
      {{- out -}}
  when: ros_stale_dhcp_route | length > 0

- name: Report the outcome
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} converged over REST: {{ routeros_plan | length }}
      call(s) sent, {{ routeros_calls.results | default([]) | length }} answered,
      every declared setting verified by re-reading the router.
