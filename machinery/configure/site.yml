---
# ===========================================================================
# Layer 2 — CONVERGE the inside of every guest that declares `manage: true`.
#
# Layer 1 owns the guest's shape through the Proxmox API; this owns what runs
# inside it, over SSH. Both read the same declared state
# (labs/netlab-v2.yml), which stays the single source of truth.
#
# Run from the repository root:
#     ansible-playbook machinery/configure/site.yml
# ===========================================================================
- name: Layer 2 - build the target inventory from the declared state
  hosts: localhost
  gather_facts: false
    # El acceso SSH (usuario y clave) NO se declara aquí: es de la máquina que
    # ejecuta, y viene del entorno (`secrets.yaml`), que carga
    # tasks/build_targets.yml al principio del play.
    # Where the control node's path into the guests behind a router is written.
    # Ansible's own ssh reads this file per connection, so the block written by
    # tasks/ssh_path.yml applies to the guest play later in the same run.
  tasks:
    - name: Keep machinery/logs/ bounded (the policy in the declared state)
      ansible.builtin.include_tasks: ../machinery/playbooks/tasks/prune_logs.yml

    - name: Build the configuration targets
      ansible.builtin.include_tasks: tasks/build_targets.yml

    # ---- the PATH layer 2 runs on (continued) ------------------------------
    # Guests behind their site's router are not reachable from here directly, so
    # the path goes through the one guest that already sits on the management
    # network with routes into every site. Written from the declaration.
    - name: Write the control node's SSH path to those guests
      ansible.builtin.include_tasks: tasks/ssh_path.yml

    # ---- the PATH layer 2 runs on -----------------------------------------
    # Layer 2 is SSH. If this node is not on the guest LAN, every guest looks
    # unreachable for a reason no key can fix, and the run would die with a
    # message about SSH access. The tunnel is declared, so detect the situation
    # and converge it here instead of reporting it.
    - name: Probe the SSH port of every configuration target
      ansible.builtin.wait_for:
        host: "{{ item.address }}"
        port: 22
        timeout: 4
      loop: "{{ l2_targets }}"
      loop_control:
        label: "{{ item.hostname }} ({{ item.address }})"
      register: l2_path_probe
      # Not `failed_when: false`: that hides the failure and `wait_for` still
      # reports `elapsed` on timeout, so the result cannot tell success from
      # expiry. `ignore_errors` keeps `failed=True` in the per-item result,
      # which is the discriminator the two tasks below rely on.
      ignore_errors: true

    - name: Note whether the guest LAN answers at all
      ansible.builtin.set_fact:
        l2_path_up: >-
          {{ l2_path_probe.results | rejectattr('failed') | list | length > 0 }}

    - name: Note whether the declared tunnel interface is already up
      # El túnel es el camino, no un destino: si su interfaz YA está arriba, no hay
      # nada que converger aunque ningún invitado responda todavía (recién creados,
      # arrancando). Sin esta comprobación, una recreación completa hacía que el
      # bloque del túnel se lanzara contra el host con sudo y tumbara la capa 2
      # entera por un problema que no existía.
      ansible.builtin.command: "ip link show {{ pve_tunnel.name | default('') }}"
      register: l2_tunnel_link
      changed_when: false
      failed_when: false
      when: pve_tunnel.name | default('') | length > 0

    - name: Record the tunnel's state
      ansible.builtin.set_fact:
        l2_tunnel_up: "{{ (l2_tunnel_link.rc | default(1)) == 0 }}"

    - name: Converge the declared tunnel when nothing answers
      # `apply:` rather than a task-level keyword: this ansible-core refuses
      # `become` as a direct attribute of a TaskInclude.
      ansible.builtin.include_tasks:
        file: tasks/tunnel.yml
        apply:
          become: true
      # "NOTHING answers", not "any target is out of reach": with guests in their
      # own networks the routers answer while the workstations behind them do
      # not, and being eager here means the tunnel's own verification probes a
      # network the endpoint cannot route yet — so it fails the whole run. Reaching
      # those networks needs routes ON THE ENDPOINT (the one manual half), which
      # is documented in machinery/playbooks/tools/wg_endpoint_setup.sh.
      when:
        - not (l2_path_up | bool)
        - not (l2_tunnel_up | bool)

    - name: An unreachable guest LAN with no declared tunnel is a hard stop
      ansible.builtin.fail:
        msg: >-
          No configuration target answers on :22 and pve_tunnel is not declared with
          manage true, so layer 2 has no path to the guests. Declare pve_tunnel in
          labs/netlab-v2.yml (endpoint, endpoint_public_key, address,
          guest_network, private_key_path) and run this verb again, or run it from a
          node that is already on the guest LAN. Nothing was changed on the guests.
      when:
        - not (l2_path_up | bool)
        - not (l2_tunnel_up | bool)
        - not (pve_tunnel.manage | default(false) | bool)

    - name: Report the layer 2 path
      ansible.builtin.debug:
        msg: >-
          Layer 2 path: as found, {{ l2_answered | length }}/{{ l2_targets | length }} target(s)
          answered on :22
          {{ '-> this run converged the declared tunnel ' ~ (pve_tunnel.name | default(''))
             if not (l2_path_up | bool) else '(guest LAN reachable directly)' }}
      vars:
        l2_answered: >-
          {{ l2_path_probe.results | rejectattr('failed') | map(attribute='item') | list }}

# ---------------------------------------------------------------------------
# ORDEN DE LOS PLAYS: los equipos de red PRIMERO.
#
# Es una dependencia declarada, no una preferencia. El DHCP de la LAN de cada
# sede lo sirve su ROUTER, que es su puerta y por eso esta en el mismo segmento de
# capa 2 que sus clientes: el DHCP es broadcast y no cruza un router (un relay sí
# lo cruzaría, pero aquí puerta y servidor son el mismo equipo). Eso hace que las
# estaciones DEPENDAN de los equipos de red: si se converge primero el
# contenedor, la estación todavía no tiene dirección, el verbo se para en la
# primera y los routers no llegan a configurarse nunca.
# ---------------------------------------------------------------------------
- name: Layer 2 - converge the guests that speak their own API
  hosts: pve_api_targets
  gather_facts: false
  serial: 1
  vars:
    pve_log_dir: "{{ playbook_dir }}/../logs"
  # El diario de la API es UNO para las dos APIs. Hasta ahora este play no armaba
  # el trazador, así que las llamadas del rol RouterOS no llegaban al diario y el
  # framework registraba medio laboratorio. sitecustomize.py engancha `requests`
  # (PVE) y urllib (lo que usa `ansible.builtin.uri`), así que armar aquí cubre
  # RouterOS: cada llamada queda con su `api: routeros` y se puede filtrar.
  environment:
    PYTHONPATH: "{{ playbook_dir }}/../machinery/playbooks/tracing"
    API_HTTP_TRACE: "{{ pve_log_dir }}/pve-api.jsonl"
  tasks:
    - name: Converge the declared RouterOS state
      ansible.builtin.include_role:
        name: routeros
      when: l2_config.routeros is defined

    - name: "Nothing to converge: the declaration is read-only for this guest"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} is declared with manage false, so layer 2 only
          audits it. Set manage true in the declaration when you are ready for it
          to be converged.
      when: not (l2_manage | bool)

# ---------------------------------------------------------------------------
# Verification from INSIDE the guests: the network lab exists so that a packet
# can leave one segment, cross the router VM and come back from the other. That
# proof needs EVERY guest converged, so it is a pass of its own — the play above
# converges one guest at a time, and the first guest's peer is not configured
# until the last one has run.
# ---------------------------------------------------------------------------
- name: Layer 2 - converge the inside of every managed guest
  hosts: pve_config_targets
  # No fact gathering: it runs before the reachability check, so an unreachable
  # guest would abort the play instead of being handled by the policy in
  # tasks/reachability.yml. The role does not depend on gathered facts.
  gather_facts: false
  serial: 1
  tasks:
    - name: Reachability and access policy for this guest
      ansible.builtin.include_tasks: tasks/reachability.yml

    # Each role is opt-in through ITS declared key: a guest that declares no
    # `netlab` block must not get the network-lab configuration just because it is
    # managed. An application is added as another role plus another `config:` block
    # in a lab — never by installing on a guest something it did not declare.

    # The network lab: a guest on an isolated segment can only reach the other
    # segment through the router VM, which needs a route its own network
    # configuration does not provide. The role installs the declared routes and
    # then proves the connectivity from inside the guest.
    - name: Converge the declared routes of the network lab
      ansible.builtin.include_role:
        name: netlab
      vars:
        netlab_routes: "{{ (l2_config.netlab | default({})).routes | default([]) }}"
        netlab_peers: "{{ (l2_config.netlab | default({})).peers | default([]) }}"
        netlab_dhcp: "{{ (l2_config.netlab | default({})).dhcp | default({}) }}"
      when:
        - l2_manage | bool
        - l2_config.netlab is defined

    # The router's first address. A RouterOS guest cannot be configured until it
    # has one, and it cannot take one from the host's DHCP server (its kernel
    # drops offers whose UDP checksum a veth left unfinished). This guest is the
    # machine that hands that one address over — and then never intervenes again.
    - name: Converge the declared router bootstrap
      ansible.builtin.include_role:
        name: bootstrap
      vars:
        bootstrap_interface: "{{ (l2_config.bootstrap | default({})).interface | default('eth0') }}"
        bootstrap_hosts: "{{ (l2_config.bootstrap | default({})).hosts | default([]) }}"
        # La forma de VARIOS segmentos. Si no se declara, el rol usa el bloque de
        # un solo segmento de arriba: los dos declaran lo mismo, sólo que uno
        # admite más de una interfaz (ver roles/bootstrap/defaults/main.yml).
        bootstrap_segments: "{{ (l2_config.bootstrap | default({})).segments | default([]) }}"
        bootstrap_routes: "{{ (l2_config.bootstrap | default({})).routes | default([]) }}"
        bootstrap_route_gateway: "{{ (l2_config.bootstrap | default({})).route_gateway | default('') }}"
      when:
        - l2_manage | bool
        - l2_config.bootstrap is defined

    - name: "Nothing to converge: the declaration is read-only for this guest"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} is declared with manage false, so layer 2 only
          audits it (machinery/configure/audit.yml). Set manage true in the declaration when
          you are ready for it to be converged.
      when: not (l2_manage | bool)

# ---------------------------------------------------------------------------
# Guests that speak their own API instead of a POSIX shell (RouterOS). The role
# runs on the control node and drives the guest's API; there is no SSH path.
# ---------------------------------------------------------------------------
- name: Layer 2 - verify the network lab from inside every guest
  hosts: pve_config_targets
  gather_facts: false
  tasks:
    - name: Probe every declared peer from inside this guest
      ansible.builtin.command:
        cmd: "ping -c 2 -W 2 {{ item }}"
      register: l2_netlab_ping
      changed_when: false
      failed_when: false
      loop: "{{ (l2_config.netlab | default({})).peers | default([]) }}"
      loop_control:
        label: "{{ item }}"

    - name: Assert every declared peer answers through the router
      ansible.builtin.assert:
        that:
          - item.rc | int == 0
        fail_msg: >-
          {{ item.item }} did not answer from inside {{ inventory_hostname }}:
          {{ item.stdout | default('') | trim }}. The route is installed, so the
          break is further along: the router's leg on this segment, its route to
          the peer's network, or the peer's own route back.
        success_msg: "{{ item.item }} answered from {{ inventory_hostname }} through the router."
      loop: "{{ l2_netlab_ping.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: l2_netlab_ping.results | length > 0

# ---------------------------------------------------------------------------
# Verification from OUTSIDE the guest: the declaration says what should answer,
# so the proof is an HTTP request from here, not a task exit status.
# ---------------------------------------------------------------------------
- name: Layer 2 - verify from outside every guest
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Probe every declared site over HTTP
      ansible.builtin.uri:
        url: "http://{{ item._target }}:{{ item.address | regex_replace('^.*:', '') }}/"
        return_content: true
        status_code: 200
      register: l2_probe
      loop: "{{ l2_probes | default([]) }}"
      loop_control:
        label: "{{ item._target }} {{ item.address }}"
      # -1 means "could not even connect". After a converged run that is usually a
      # service still coming up, so retry before calling it a failure.
      retries: 6
      delay: 5
      until: (l2_probe.status | default(0) | int) == (item.expect_status | default(200) | int)
      failed_when: false

    - name: Reduce what came back before anything loops over it
      # ONE expression, not a per-item loop, and that is the whole point. A task
      # that loops echoes its loop value into its own result, and the loop value
      # here is a registered `uri` result — whose `content` is the ENTIRE response
      # body. Probe a wiki page and a handful of log lines become megabytes of
      # HTML: measured at 6.15 MB per run, which filled machinery/logs/ansible.log faster
      # than every other task combined and which the retention policy was quietly
      # bounding (two 13 MB archives are the evidence). Reducing it here means no
      # later loop can ever see the body again.
      ansible.builtin.set_fact:
        l2_probe_report: >-
          {%- set out = [] -%}
          {%- for r in l2_probe.results -%}
          {%-   set _ = out.append({
                'target': r.item._target,
                'address': r.item.address,
                'status': r.status | default(0) | int,
                'expect_status': r.item.expect_status | default(200) | int,
                'expect_body': r.item.expect_body | default(''),
                'body_head': r.content | default('') | trim | truncate(60),
                'body_has': r.item.expect_body | default('') in (r.content | default('')) }) -%}
          {%- endfor -%}
          {{ out }}
      when: l2_probe.results | length > 0

    - name: Report what came back
      ansible.builtin.debug:
        msg: >-
          {{ item.target }} {{ item.address }} -> HTTP {{ item.status | default('no answer') }}
          {{ ('| body ' ~ item.body_head) if item.body_head | length > 0 else '' }}
      loop: "{{ l2_probe_report | default([]) }}"
      loop_control:
        label: "{{ item.target }}"
      changed_when: false

    - name: Every declared site must answer with the status its declaration expects
      # The expectation is declared per check (`expect_status`, default 200): a
      # service can legitimately answer 404 and the declaration should say so
      # rather than the framework assuming.
      ansible.builtin.assert:
        that:
          - item.status | int == item.expect_status | int
        fail_msg: >-
          {{ item.target }} {{ item.address }} answered {{ item.status | default('nothing') }}
          but the declaration expects {{ item.expect_status }}. The service may be
          deployed but not serving, or the guest may be unreachable from here.
        success_msg: "{{ item.target }} {{ item.address }} answered {{ item.status }} as declared."
      loop: "{{ l2_probe_report | default([]) }}"
      loop_control:
        label: "{{ item.target }}"

    - name: A declared body must be the body the guest actually serves
      # Decided against the FULL body, not against the truncated head the report
      # shows: `body_has` is computed where the body is still whole, so a declared
      # string that appears past the first 60 characters is still found.
      ansible.builtin.assert:
        that:
          - item.body_has
        fail_msg: >-
          {{ item.target }} {{ item.address }} served "{{ item.body_head }}" but the
          declaration says it must contain "{{ item.expect_body }}".
        success_msg: "{{ item.target }} served the declared body: {{ item.expect_body }}"
      loop: "{{ l2_probe_report | default([]) | selectattr('expect_body', 'ne', '') | list }}"
      loop_control:
        label: "{{ item.target }}"
