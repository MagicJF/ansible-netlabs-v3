---
# PROPÓSITO: el ÚNICO verbo que destruye. La convergencia nunca borra.
# INVARIANTES: se niega mientras el invitado siga declarado (salvo `destroy_declared=true`);
#   exige `-e confirm=<hostname|vmid>`; pasa hostname Y vmid al módulo (cada uno solo falla
#   de una forma); se niega a borrar uno encendido sin `force=true`; prueba el resultado
#   re-leyendo la plataforma.
# VER: la verificación de este playbook y `framework_check.py`.
# ===========================================================================
# remove.yml — the ONLY verb that destroys. Convergence never deletes: a guest
# that disappears from the declaration keeps running, untouched, and that is
# deliberate. Destruction is therefore explicit, guarded and verified:
#
#   1. it REFUSES while the guest is still declared in the manifest, because the
#      next apply would recreate it — "I deleted it and it came back" is exactly
#      that loop;
#   2. it needs -e confirm=<hostname or vmid> so a typo cannot delete a guest;
#   3. it passes the guest's hostname AND its vmid to the destroy module, because
#      the module needs both and each one alone is wrong in a different way. It
#      resolves the guest BY NAME, so a vmid alone never matches and the module
#      answers "already absent" while touching nothing (learned the hard way) —
#      but a hostname alone stops being unique as soon as two guests share one,
#      which is what replacing a lab without renaming produces. The pair is what
#      disambiguates;
#   4. it refuses to delete a RUNNING guest unless -e force=true is given;
#   4b. it also refuses to delete a guest the declaration still owns --
#      because the next apply would resurrect it -- unless the recreate
#      intent is declared with -e destroy_declared=true;
#   5. it proves the result by re-reading the platform: the guest must be gone and
#      — unless -e keep_disks=true — no volume of it may remain in any storage.
#
# Usage:
#   ansible-playbook machinery/playbooks/remove.yml -e hostname=old-guest -e confirm=old-guest
#   ansible-playbook machinery/playbooks/remove.yml -e vmid=130 -e confirm=130 -e force=true
#   ansible-playbook machinery/playbooks/remove.yml -e hostname=old-guest -e confirm=old-guest -e keep_disks=true
#   # ciclo destruir y recrear: el invitado sigue declarado y el siguiente apply lo levanta
#   ansible-playbook machinery/playbooks/remove.yml -e hostname=lab-guest -e confirm=lab-guest -e destroy_declared=true
#
# To only STOP a guest, do not use this verb: declare `status: stopped` and run
# apply.yml. That is a state change, not a removal.
# ===========================================================================
- name: Destroy one guest, deliberately
  hosts: localhost
  gather_facts: false
  vars:
    # Credenciales: de `secrets.yaml`, el entorno de ESTA máquina, cargado en
    # pre_tasks como en el resto de verbos. Nada de variables de entorno.
    pve_api: "https://{{ pve_api_host }}:{{ pve_api_port }}/api2/json"
    pve_token_header: "PVEAPIToken={{ pve_api_token_id }}={{ pve_api_token_secret }}"
    pve_auth: &pve_auth
      api_host: "{{ pve_api_host }}"
      api_port: "{{ pve_api_port }}"
      api_user: root@pam
      api_token_id: "{{ pve_api_token_id }}"
      api_token_secret: "{{ pve_api_token_secret }}"
      ca_path: "{{ pve_api_ca_path }}"
      validate_certs: true
      api_timeout: 300
    pve_journal: "{{ playbook_dir }}/../logs/pve-api.jsonl"
    target_hostname: "{{ hostname | default('') }}"
    target_vmid: "{{ vmid | default('') }}"
    do_force: "{{ force | default(false) | bool }}"
    # Renamed on purpose: a var defined as `keep_disks: "{{ keep_disks | ... }}"`
    # refers to ITSELF when the option is not passed on the command line, and
    # Ansible dies with "Recursive loop detected in template" before doing
    # anything. The `-e` name and the internal name must differ.
    rd_keep_disks: "{{ keep_disks | default(false) | bool }}"
    # Destruir un invitado que la declaracion TODAVIA posee es legitimo cuando
    # lo que se busca es justamente recrearlo: se borra aqui y el siguiente
    # `apply` lo vuelve a levantar identico. Sigue siendo opt-in para que un
    # despiste en el objetivo no borre nunca algo vivo por accidente.
    rd_destroy_declared: "{{ destroy_declared | default(false) | bool }}"
  environment:
    PYTHONPATH: "{{ playbook_dir }}/tracing"
    API_HTTP_TRACE: "{{ playbook_dir }}/../logs/pve-api.jsonl"
  pre_tasks:
    - name: Refuse an unconfirmed or ambiguous destruction
      ansible.builtin.assert:
        that:
          - (target_hostname | length > 0) or (target_vmid | length > 0)
          - (confirm | default('')) == (target_hostname if target_hostname | length > 0 else target_vmid)
        fail_msg: >-
          Destruction needs an explicit target and a confirmation:
          `-e hostname=<name> -e confirm=<name>` (or `-e vmid=<id> -e confirm=<id>`).
          Given: hostname='{{ target_hostname }}' vmid='{{ target_vmid }}' confirm='{{ confirm | default('') }}'.
          Nothing was changed.
        success_msg: "Target {{ target_hostname or target_vmid }} confirmed."

    # A guest that is still declared would be recreated by the next apply, so
    # deleting it now would only produce a confusing resurrection later.
    - name: Refuse to destroy a guest the declaration still owns
      when: not rd_destroy_declared
      ansible.builtin.assert:
        that:
          - declared_matches | from_json | length == 0
        fail_msg: >-
          {{ target_hostname or target_vmid }} is still declared in
          {{ pve_lab | default('labs/active') }}
          ({{ declared_matches | from_json | join(', ') }}).
          Remove its entry from pve_containers / pve_vms / pve_config_targets first — otherwise
          the next `apply` recreates it. Nothing was changed.
        success_msg: "The declaration no longer owns this guest."
      vars:
        declared_all: >-
          {{ (pve_containers | default([])) + (pve_vms | default([])) + (pve_config_targets | default([])) }}
        declared_matches: >-
          {%- set out = [] -%}
          {%- for g in declared_all -%}
          {%- if ((target_vmid | length > 0) and ((g.vmid | string) == (target_vmid | string)))
                 or ((target_hostname | length > 0) and ((g.hostname | default(g.name | default(''))) == target_hostname)) -%}
          {%- set _ = out.append((g.vmid | string) ~ ' ' ~ (g.hostname | default(g.name | default('')))) -%}
          {%- endif -%}
          {%- endfor -%}
          {{- out | to_json -}}

    # Con la intencion declarada, el guardian de arriba calla: conviene
    # que quede escrito que este borrado era deliberado.
    - name: Announce a deliberate destruction of a declared guest
      when: rd_destroy_declared and ((declared_matches | from_json | length) > 0)
      ansible.builtin.debug:
        msg: >-
          destroy_declared=true: {{ target_hostname or target_vmid }} sigue declarado
          ({{ declared_matches | from_json | join(", ") }}) y se destruye igualmente.
          El siguiente `apply` lo recreara.
      vars:
        declared_all: >-
          {{ (pve_containers | default([])) + (pve_vms | default([])) + (pve_config_targets | default([])) }}
        declared_matches: >-
          {%- set out = [] -%}
          {%- for g in declared_all -%}
          {%- if ((target_vmid | length > 0) and ((g.vmid | string) == (target_vmid | string)))
                 or ((target_hostname | length > 0) and ((g.hostname | default(g.name | default(''))) == target_hostname)) -%}
          {%- set _ = out.append((g.vmid | string) ~ ' ' ~ (g.hostname | default(g.name | default('')))) -%}
          {%- endif -%}
          {%- endfor -%}
          {{- out | to_json -}}

    - name: Look for the machine environment file
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../secrets.yaml"
      register: rem_entorno_file

    - name: Load the machine environment when present (gitignored)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../secrets.yaml"
      when: rem_entorno_file.stat.exists

    - name: Remember the journal size so this run can prove it was traced
      ansible.builtin.stat:
        path: "{{ pve_journal }}"
      register: rem_journal_start

  tasks:
    - name: Keep machinery/logs/ bounded (the policy in the declared state)
      ansible.builtin.include_tasks: tasks/prune_logs.yml

    - name: Read the live platform, so the decision is based on reality
      ansible.builtin.uri:
        url: "{{ pve_api }}/nodes/{{ pve_node }}/{{ item }}"
        method: GET
        headers:
          Authorization: "{{ pve_token_header }}"
        validate_certs: true
        ca_path: "{{ pve_api_ca_path }}"
        status_code: 200
        return_content: true
      loop: [lxc, qemu]
      register: rem_listing
      no_log: true

    # Two tasks, not two keys of one set_fact: keys of a single set_fact are
    # resolved from the same context, so `found` cannot see `all_guests` there.
    - name: Flatten what the platform reports
      ansible.builtin.set_fact:
        all_guests: "{{ (rem_listing.results[0].json.data | default([]) | map('combine', {'kind': 'lxc'}) | list)
                       + (rem_listing.results[1].json.data | default([]) | map('combine', {'kind': 'qemu'}) | list) }}"

    - name: Identify exactly one guest
      vars:
        # La declaracion de ESTE laboratorio es la que manda. El vmid es unico en
        # la plataforma, pero el hostname NO: dos labs que comparten
        # `infra-bootstrap` (uno por sede) hacian que el verbo viera DOS
        # coincidencias y se negara a borrar ninguna. El vmid de la declaracion
        # desambigua; si el hostname no esta declarado aqui, se busca por nombre
        # en toda la plataforma como antes.
        declared_all: >-
          {{ (pve_containers | default([])) + (pve_vms | default([])) + (pve_config_targets | default([])) }}
      ansible.builtin.set_fact:
        found: >-
          {%- set out = [] -%}
          {%- set lab_vmids = [] -%}
          {%- set declared_hosts = [] -%}
          {%- for d in declared_all -%}
          {%- set _ = lab_vmids.append(d.vmid | string) -%}
          {%- set _ = declared_hosts.append(d.hostname | default(d.name | default('')) | string) -%}
          {%- endfor -%}
          {%- for g in all_guests -%}
          {#- El vmid es único en la plataforma; el nombre NO. Cuando se da vmid se
              resuelve por vmid y sólo por vmid. Con hostname, si ese nombre está
              declarado en este laboratorio se exige además que el vmid sea uno de
              los suyos; si no lo está, se cae al nombre en toda la plataforma. -#}
          {%- if (target_vmid | length > 0) -%}
          {%- if (g.vmid | string) == (target_vmid | string) -%}
          {%- set _ = out.append(g) -%}
          {%- endif -%}
          {%- elif (target_hostname | length > 0) -%}
          {%- if (g.name | default('') == target_hostname) -%}
          {%- if (target_hostname not in declared_hosts) or ((g.vmid | string) in lab_vmids) -%}
          {%- set _ = out.append(g) -%}
          {%- endif -%}
          {%- endif -%}
          {%- endif -%}
          {%- endfor -%}
          {{- out | to_json -}}

    - name: The guest must exist, and be exactly one
      ansible.builtin.assert:
        that:
          - (found | from_json) | length == 1
        fail_msg: >-
          Expected exactly one guest matching hostname='{{ target_hostname }}' vmid='{{ target_vmid }}',
          found {{ (found | from_json) | length }}: {{ (found | from_json) | map(attribute='vmid') | list | to_json }}.
          Nothing was changed.
        # El success_msg se plantilla antes de saber si el assert pasa: indexar
        # [0] sobre una lista vacia reventaba el mensaje de fallo cuando el
        # invitado no existe, tapando el "found 0" que sí lo explica.
        success_msg: >-
          {%- if (found | from_json) | length == 1 -%}
          Found VMID {{ (found | from_json)[0].vmid }} ({{ (found | from_json)[0].name }}, {{ (found | from_json)[0].kind }}).
          {%- else -%}
          No unique guest resolved.
          {%- endif -%}

    - name: Show what is about to be destroyed
      ansible.builtin.debug:
        msg: >-
          {{ t.name }} (VMID {{ t.vmid }}, {{ t.kind }}): currently {{ t.status }}.
          {{ 'Disk volumes are KEPT (keep_disks=true).' if rd_keep_disks else 'Its disk volumes will be destroyed too.' }}
          This cannot be undone.
      vars:
        t: "{{ (found | from_json)[0] }}"

    - name: A running guest needs an explicit force
      ansible.builtin.fail:
        msg: >-
          {{ t.name }} (VMID {{ t.vmid }}) is running. Either stop it first — declare `status: stopped`
          and run apply.yml — or pass `-e force=true` to let this verb stop and destroy it. Nothing
          was changed.
      vars:
        t: "{{ (found | from_json)[0] }}"
      when:
        - t.status == 'running'
        - not do_force

    - name: Destroy the container
      community.proxmox.proxmox:
        <<: *pve_auth
        node: "{{ pve_node }}"
        # BOTH the hostname and the vmid, and the pair is the point. The module
        # resolves the guest by NAME, so the vmid alone does not match (it would
        # answer "already absent" while deleting nothing) — but the hostname
        # alone stops being unique the moment two guests share a name, which is
        # exactly what happens when a lab is replaced without renaming: this play
        # then died with "Multiple VMs found with hostname ws1. Please specify
        # VMID.", hidden behind this task's own `no_log`. With both, the module
        # disambiguates and the destroy is unambiguous again.
        hostname: "{{ t.name }}"
        vmid: "{{ t.vmid | int }}"
        state: absent
        force: "{{ do_force }}"
        purge: true
        destroy_unreferenced_disks: "{{ not rd_keep_disks }}"
        timeout: 300
      vars:
        t: "{{ (found | from_json)[0] }}"
      when: t.kind == 'lxc'
      register: rem_ct
      no_log: true

    - name: Destroy the VM
      community.proxmox.proxmox_kvm:
        <<: *pve_auth
        node: "{{ pve_node }}"
        name: "{{ t.name }}"
        # Same pair as the container above, and for the same reason.
        vmid: "{{ t.vmid | int }}"
        state: absent
        force: "{{ do_force }}"
        purge: true
        destroy_unreferenced_disks: "{{ not rd_keep_disks }}"
        timeout: 300
      vars:
        t: "{{ (found | from_json)[0] }}"
      when: t.kind == 'qemu'
      register: rem_vm
      no_log: true

    - name: Report what the platform answered
      ansible.builtin.debug:
        msg: >-
          {{ (rem_ct.msg | default('')) if t.kind == 'lxc' else (rem_vm.msg | default('')) }}
          (changed={{ (rem_ct.changed | default(false)) if t.kind == 'lxc' else (rem_vm.changed | default(false)) }})
      vars:
        t: "{{ (found | from_json)[0] }}"

    # ---- verification: prove it, by reading the platform again ------------
    - name: Re-read the live platform
      ansible.builtin.uri:
        url: "{{ pve_api }}/nodes/{{ pve_node }}/{{ item }}"
        method: GET
        headers:
          Authorization: "{{ pve_token_header }}"
        validate_certs: true
        ca_path: "{{ pve_api_ca_path }}"
        status_code: 200
        return_content: true
      loop: [lxc, qemu]
      register: rem_after
      no_log: true

    - name: The guest must be gone
      ansible.builtin.assert:
        that:
          - remaining | length == 0
        fail_msg: "VMID {{ target_vmid or (found | from_json)[0].vmid }} is still listed by the API: {{ remaining | to_json }}."
        success_msg: "VMID {{ target_vmid or (found | from_json)[0].vmid }} is gone from the platform."
      vars:
        remaining: >-
          {{ ((rem_after.results[0].json.data | default([])) + (rem_after.results[1].json.data | default([])))
             | selectattr('vmid', 'equalto', ((found | from_json)[0].vmid | int)) | list
             | map(attribute='vmid') | list }}

    - name: List the node's storages
      ansible.builtin.uri:
        url: "{{ pve_api }}/nodes/{{ pve_node }}/storage"
        method: GET
        headers:
          Authorization: "{{ pve_token_header }}"
        validate_certs: true
        ca_path: "{{ pve_api_ca_path }}"
        status_code: 200
        return_content: true
      register: rem_storages
      when: not rd_keep_disks
      no_log: true

    - name: Read what each storage still holds
      ansible.builtin.uri:
        url: "{{ pve_api }}/nodes/{{ pve_node }}/storage/{{ item.storage }}/content"
        method: GET
        headers:
          Authorization: "{{ pve_token_header }}"
        validate_certs: true
        ca_path: "{{ pve_api_ca_path }}"
        status_code: [200]
        return_content: true
      loop: "{{ rem_storages.json.data | default([]) }}"
      loop_control:
        label: "{{ item.storage }}"
      register: rem_contents
      when: not rd_keep_disks
      failed_when: false
      no_log: true

    - name: No volume of the guest may remain
      ansible.builtin.assert:
        that:
          - leftovers | length == 0
        fail_msg: >-
          These volumes of VMID {{ (found | from_json)[0].vmid }} still exist: {{ leftovers | join(', ') }}.
          Remove them by hand or re-run with the same flags (the module's
          destroy_unreferenced_disks only removes what is unreferenced).
        success_msg: "No volume of VMID {{ (found | from_json)[0].vmid }} remains (disks: destroyed)."
      vars:
        leftovers: >-
          {{ rem_contents.results | default([])
             | map(attribute='json.data', default=[]) | flatten
             | map(attribute='volid', default='') | select('search', 'vm-' ~ ((found | from_json)[0].vmid | string) ~ '-')
             | list }}
      when: not rd_keep_disks

    - name: Say plainly what was kept
      ansible.builtin.debug:
        msg: >-
          VMID {{ (found | from_json)[0].vmid }} was destroyed but its disk volumes were KEPT
          (keep_disks=true). Review the storage listings before leaving them behind.
      when: rd_keep_disks

    - name: Observability is only real if it is checked
      ansible.builtin.stat:
        path: "{{ pve_journal }}"
      register: rem_journal_end

    - name: Assert this run was traced to the journal
      ansible.builtin.assert:
        that:
          - rem_journal_end.stat.size | int > rem_journal_start.stat.size | int
        fail_msg: >-
          {{ pve_journal }} did not grow during this run, so the deletion was NOT traced.
          Check machinery/playbooks/tracing/sitecustomize.py and the play-level PYTHONPATH.
        success_msg: >-
          API trace OK: the journal grew by
          {{ (rem_journal_end.stat.size | int) - (rem_journal_start.stat.size | int) }} bytes.
