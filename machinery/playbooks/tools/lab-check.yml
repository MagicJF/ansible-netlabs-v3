---
# ===========================================================================
# lab-check — the topology check, run on every workstation at once.
#
# tools/lab-check.sh is the script that lives for the guests: it reads its own
# address, works out which site it sits in, and compares the paths it can see
# against the topology it was given. It used to be pasted into each console by
# hand, one guest at a time, and the results read off the screen.
#
# Run from the repository root:
#     ansible-playbook machinery/playbooks/tools/lab-check.yml
#
# The targets come from the declared state, not from a list kept in here, and the
# path to them comes from the jump (tasks/ssh_path.yml writes the control node's
# SSH config for the guests behind a router). ansible.cfg sets forks = 20, so the
# eight run concurrently: one guest takes about eight seconds, and the whole lab
# is checked in about the time one takes.
#
# The check is READ ONLY — pings and traceroutes, nothing written anywhere.
# ===========================================================================
- name: lab-check - build the workstation inventory from the declared state
  hosts: localhost
  gather_facts: false
  vars:
    # Esta prueba ES sobre las estaciones: saltarse las que todavía no pueden estar
    # en pie convertiría un test en un verde vacío. Se exigen, y si no están el
    # error dirá por qué (su sede aún no sirve DHCP), no que falte una clave.
    l2_exigir_estaciones: true
  tasks:
    - name: Build the configuration targets
      ansible.builtin.include_tasks: ../../configure/tasks/build_targets.yml

    - name: Write the control node's SSH path to the guests behind a router
      ansible.builtin.include_tasks: ../../configure/tasks/ssh_path.yml

    # The check belongs on the workstations and nowhere else: it looks its own
    # address up in the lab's map, and a guest that is not in the lab would only
    # be told so. Layer 2's own list is wider than the lab.
    - name: Put the workstations in their own group
      ansible.builtin.add_host:
        name: "{{ item.hostname }}"
        groups: lab_workstations
      loop: "{{ pve_containers | selectattr('site', 'defined') | list }}"
      loop_control:
        label: "{{ item.hostname }}"
      changed_when: false

    # El mapa del test se deriva de ESTE laboratorio, no se escribe a mano ni se
    # hereda del activo. Se genera UNA vez aquí y se pasa a cada estación como
    # fichero: el script ya no lleva topología dentro, así que sirve para
    # cualquier laboratorio sin regenerarlo a mano.
    - name: Generate the map of this laboratory for the check
      ansible.builtin.command:
        cmd: python3 {{ playbook_dir }}/framework_check.py labmap --emit
      register: lab_map
      changed_when: false

- name: lab-check - the topology check, on every workstation at once
  hosts: lab_workstations
  gather_facts: false
  tasks:
    # Sin esto, un invitado que no contesta cae del play en el PRIMER task (una
    # conexión que falla es `unreachable`, y eso saca al host de la ejecución) y el
    # informe acaba en «sin salida», que no le dice nada a nadie. La guarda ya sabe
    # distinguir por qué: si es una estación que la capa 1 aplazó porque su sede no
    # sirve DHCP, lo dice con esas palabras; si no, manda a conceder la clave.
    - name: Can we reach the guest at all, and if not, why
      ansible.builtin.include_tasks: ../../configure/tasks/reachability.yml

    - name: Place the map of this laboratory where the check will read it
      ansible.builtin.copy:
        content: "{{ hostvars['localhost']['lab_map'].stdout }}"
        dest: /tmp/labcheck-map.env
        mode: "0600"
      changed_when: false

    - name: The check, run where it belongs
      ansible.builtin.script: lab-check.sh /tmp/labcheck-map.env
      register: lab_check
      # Pings and traceroutes: this reports on the lab, it does not touch it.
      changed_when: false
      # The script exits non-zero by design when something it EXPECTS to work does
      # not, so a failure here is information for the report below, not a reason to
      # abandon the other guests.
      ignore_errors: true

    - name: Hand back the block this script was written to produce
      ansible.builtin.debug:
        msg: "{{ (lab_check.stdout | default(lab_check.msg | default('no output'))).split('### PEGA ESTO ###')[-1].split('### FIN ###')[0] | trim }}"

- name: lab-check - the whole lab on one screen
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Summarise every workstation
      ansible.builtin.debug:
        msg: >-
          {{ item }} -> {{ (hostvars[item].lab_check.stdout | default('sin salida'))
             .splitlines() | select('match', '^(alcance|pc|rt|sw|boot|oob_aislado|OOB_FUGA)=') | join('  ') }}
      loop: "{{ groups['lab_workstations'] | default([]) | sort }}"
      loop_control:
        label: "{{ item }}"
      when: groups['lab_workstations'] | default([]) | length > 0

    - name: Say plainly whether the lab is whole
      # Sin cuenta derivada a proposito: el patron exige una RETRORREFERENCIA
      # (`\1`) y Jinja se come la barra invertida como escape octal, asi que el
      # conteo salia 0 sin fallar. Cada linea de arriba ya dice `alcance=X/Y`, que
      # es la cuenta que importa; aqui se explica como leerla.
      ansible.builtin.debug:
        msg: >-
          {{ groups['lab_workstations'] | default([]) | length }} workstation(s) checked.
          Cada linea lee `alcance=X/Y`: X destinos contestan de los Y declarados, y el
          laboratorio esta ENTERO solo si X e Y coinciden en todas. `primer_salto` y
          `camino` se miden aparte, y todo camino distinto al predicho sale como `ANOM`.
          `oob_aislado=1/1` significa que la estacion NO alcanza el segmento de gestion —
          que es lo que debe pasar; un `OOB_FUGA` es un fallo.
      when: groups['lab_workstations'] | default([]) | length > 0

    - name: Ninguna estacion pasa por comprobada sin numeros
      # El fallo de una estacion se tolera ARRIBA a proposito, para que el informe
      # pueda contar lo que le pasa a TODAS; pero tolerarlo y no comprobar nada era
      # un verde falso: `checked` contaba estaciones, no medidas. Una estacion sin
      # linea `alcance=X/Y` es una estacion que no se ha probado, y se dice asi.
      ansible.builtin.assert:
        that:
          - medidas | length == 2
          - medidas[0] == medidas[1]
        fail_msg: >-
          {{ item }} no ha producido ninguna medida. Su linea de resultado esta
          vacia, asi que este laboratorio NO queda comprobado por su parte. La
          causa habitual: el mapa de destinos de `lab-check.sh` no cubre esta
          topologia (lleva dentro los destinos de OTRO laboratorio). Arreglar el
          mapa, no la asercion.
        success_msg: >-
          {{ item }} midio su red: {{ medidas[0] }} de {{ medidas[1] }} destinos.
      vars:
        medidas: >-
          {{ (hostvars[item].lab_check.stdout | default('')
             | regex_findall('alcance=([0-9]+)/([0-9]+)') | first) | default([]) }}
      loop: "{{ groups['lab_workstations'] | default([]) | sort }}"
      loop_control:
        label: "{{ item }}"
      when: groups['lab_workstations'] | default([]) | length > 0

# ===========================================================================
# El OTRO lado de la puerta: el OPERADOR. El segmento de gestion OOB no lo
# prueban las estaciones —de hecho comprueban que NO llegan—: lo prueba quien
# lo opera, que en este laboratorio es el nodo de control a traves del tunel
# WireGuard. La llamada va por `ansible.builtin.uri`, asi que queda anotada en
# el diario (labs/<nombre>/logs/pve-api.jsonl) como cualquier otra del framework.
# ===========================================================================
- name: lab-check - el operador SI llega al segmento de gestion (OOB)
  hosts: localhost
  gather_facts: false
  vars:
    pve_log_dir: "{{ (pve_lab | dirname) }}/logs"
  environment:
    PYTHONPATH: "{{ playbook_dir }}/../tracing"
    API_HTTP_TRACE: "{{ pve_log_dir }}/pve-api.jsonl"
  tasks:
    - name: Los invitados que viven en el segundo segmento de gestion
      ansible.builtin.set_fact:
        oob_guests: >-
          {#- El segundo segmento de gestion es una propiedad DEL LABORATORIO: el
              grande lo declara, un laboratorio minimo puede no tenerlo. Se lee de
              la declaracion en vez de darlo por hecho, para que una topologia que
              no lo declare no muera por una variable ajena. -#}
          {%- set red = (lab_mgmt2 | default({})).red | default('') -%}
          {%- set out = [] -%}
          {%- if red -%}
          {%-   for v in (pve_vms | default([])) -%}
          {%-     set ros = (v.config | default({})).routeros | default({}) -%}
          {%-     for a in (ros.addresses | default([])) -%}
          {%-       set ip = a.address.split('/')[0] -%}
          {%-       if a.interface == 'ether1' and (ip | ansible.utils.ipaddr(red)) -%}
          {%-         set _ = out.append({'name': v.name, 'ip': ip}) -%}
          {%-       endif -%}
          {%-     endfor -%}
          {%-   endfor -%}
          {%- endif -%}
          {{ out }}

    - name: Leer la identidad de cada uno por su API (uri, y queda en el diario)
      ansible.builtin.uri:
        url: "http://{{ item.ip }}/rest/system/identity"
        method: GET
        url_username: admin
        url_password: "{{ pve_routeros_password | default('') }}"
        force_basic_auth: true
        status_code: 200
        return_content: true
      register: oob_check
      loop: "{{ oob_guests }}"
      loop_control:
        label: "{{ item.name }} ({{ item.ip }})"

    - name: Avisar cuando este laboratorio no declara un segundo segmento de gestion
      ansible.builtin.debug:
        msg: >-
          Este laboratorio no declara `lab_mgmt2`: no hay un segundo segmento de
          gestion que comprobar, asi que esta parte de la prueba no aplica. No es
          un aprobado: es que no hay nada que probar aqui.
      when: (lab_mgmt2 | default({})).red | default('') == ''

    - name: El operador llega al segmento de gestion
      when: (lab_mgmt2 | default({})).red | default('') != ''
      ansible.builtin.assert:
        that:
          - oob_guests | length > 0
        fail_msg: >-
          La declaracion no tiene ningun invitado en el segmento de gestion
          ({{ (lab_mgmt2 | default({})).red }}); no hay nada que el operador pueda comprobar.
        success_msg: >-
          El operador alcanza los {{ oob_guests | length }} invitado(s) del segmento
          de gestion {{ (lab_mgmt2 | default({})).red }}: {{ oob_guests | map(attribute='name') | join(', ') }}.
