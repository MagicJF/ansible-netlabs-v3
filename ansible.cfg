[defaults]
# Fewer output lines: skipped tasks are noise on a large run.
display_skipped_hosts = False
# Guests are independent; raise parallelism if the manifest grows.
forks = 20

inventory = machinery/inventory/hosts.yml

# Las colecciones que este marco necesita viven CON el repositorio
# (`.ansible/collections`), para que un clon nuevo funcione sin tocar el home de
# nadie:  ansible-galaxy collection install -r requirements.yml -p .ansible/collections
#
# Eso NO se puede declarar aquí: `collections_paths` con una ruta relativa no
# vale — Ansible la descarta sin avisar (probado: la entrada desaparece de
# COLLECTIONS_PATHS). Lo exporta `lab` como ANSIBLE_COLLECTIONS_PATH, que es
# el único sitio donde la ruta puede ser absoluta y calculada en cada máquina.
retry_files_enabled = False
interpreter_python = auto_silent

# Engine plugins shared by both layers (machinery/playbooks/ and machinery/configure/). Ansible
# otherwise only looks next to the playbook, which would hide the filters
# from whichever layer runs second. Resolved relative to this file.
filter_plugins = machinery/filter_plugins

# Human-readable log of every run, appended (never rotated by Ansible itself).
# Contains the full play output; task results from the API tasks stay censored
# because they carry no_log, so the token never lands here. The machine-readable
# API journal is written separately by machinery/playbooks/tracing/sitecustomize.py.
# Run ansible-playbook from the repository root for this relative path to land
# in ./logs/.
log_path = machinery/logs/ansible.log

[ssh_connection]
# Reuse ONE ssh connection for all the tasks of a guest instead of establishing a
# new one per task, and stream modules over it instead of copying them.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o ControlPath=/tmp/ansible-ssh-%h-%p-%r -o StrictHostKeyChecking=accept-new

