            interface: ether2
            address_pool: "{{ lab_sede[8].pool }}"
            network: "{{ lab_sede[8].red }}"
            gateway: "{{ lab_sede[8].puerta }}"
            dns_server: "{{ lab_internet_dns }}"
            leases: >-
