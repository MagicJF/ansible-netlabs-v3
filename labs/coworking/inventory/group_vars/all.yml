---
# ============================================================================
# ESTADO DECLARADO DEL LABORATORIO — ansible-netlabs-v3
#
# Una sola fuente de verdad. Este fichero declara QUÉ existe y CÓMO está; los
# verbos (playbooks/*.yml) lo llevan a la realidad y lo verifican. Nada se toca
# por SSH al hipervisor: todo va por la API de Proxmox y por la API de RouterOS.
#
# ---------------------------------------------------------------------------
# QUÉ ES ESTE LABORATORIO — un edificio de oficinas compartidas (multi-inquilino)
# ---------------------------------------------------------------------------
# Un operador alquila oficinas en un edificio. Da servicio a DOS INQUILINOS —dos
# empresas distintas— que comparten el edificio, la salida a internet y unos
# SERVICIOS COMUNES, y que **no deben verse entre sí por nada del mundo**. Ese es el
# problema real que este laboratorio pone en pie:
#
#   - el EDIFICIO (sede 6) es la infraestructura común: su borde sale a internet con
#     NAT y en su LAN viven los servicios compartidos (la impresora de red, la sala
#     de reuniones), lo único de la infraestructura que un inquilino puede tocar;
#   - cada INQUILINO (sede 7 = A, sede 8 = B) es una empresa con su propia LAN, su
#     router y su firewall, y enruta hacia el edificio;
#   - el borde del EDIFICIO filtra: cada inquilino sale a internet y llega a los
#     servicios comunes, y **NO alcanza al otro inquilino** ni a la gestión del
#     edificio.
#
# NO es el modelo "empresa con delegaciones" (netlab-v2), donde todas las sedes son
# de la MISMA organización y se ven entre sí: aquí las sedes son organizaciones
# DISTINTAS y **el valor está en la separación**, no en la conectividad.
#
# ---------------------------------------------------------------------------
# QUÉ CAMBIA RESPECTO A LA v1 (proxmox-ansible-lxc-test)
# ---------------------------------------------------------------------------
#   1. Numeración de SIETE dígitos en todos los invitados:  L SS CC II
#         L  = laboratorio         3 (este laboratorio). Sus invitados se agrupan en
#                                 el Resource Pool PROPIO del laboratorio
#                                 (`lab_pool`), no por etiqueta: ver
#                                 docs/decisiones/0008.
#         SS = sede               escrita con dos letras A..I (A=1..I=9): AA=11,
#                                 AG=17 (el edificio), AH=18 (inquilino A), AI=19
#                                 (inquilino B), AE=15 (gestión), AF=16 (borde)
#         CC = clase              11 switch de acceso, 12 de gestión, 21 router de
#                                 núcleo, 81 firewall perimetral, 82 de borde,
#                                 91 estación, 71 bootstrap (ver `lab_clases`)
#         II = índice             dentro de sede y clase, desde 10
#      Ningún campo empieza por cero. Así `3171110` se lee "lab 3, edificio,
#      switch de acceso, el primero"; el número y el nombre dicen lo MISMO, en el
#      mismo orden: `3-Ca-swac-10`. Ver docs/decisiones/0007-codigo-de-sede.md.
#
#   2. DISTINCIÓN DE FUNCIONES POR MÁQUINA. En la v1 cada sede tenía un router
#      que lo hacía todo. Aquí cada función es un equipo:
#        - el SWITCH   conmuta (L2), no enruta ni filtra;
#        - el ROUTER   es la PUERTA DE ENLACE y el servidor DHCP de su LAN, y
#                      enruta dentro de la empresa (entre sedes);
#        - el FIREWALL filtra el PERÍMETRO: está entre el router de su sede y la
#                      WAN, y entre el núcleo y el proveedor.
#
#      El orden de un paquete es:  pc -> sw -> rt -> fw -> WAN
#
#      Y no es una preferencia de estilo, pero tampoco una ley física: el DHCP es
#      un broadcast de CAPA 2 y NO cruza un router, así que quien reparte tiene
#      que estar en el MISMO segmento que sus clientes (o un relay,
#      `ip helper-address`, desde él, si el servidor vive en otro sitio). Aquí se
#      elige que puerta y servidor sean el mismo equipo —modelo de rama pequeña—,
#      y por eso la LAN cuelga del router y el firewall se pone DESPUÉS.
#
#   3. SALIDA A INTERNET. La v1 era una red cerrada a propósito. Aquí el firewall
#      de borde (`3-Ba-fwbo-10`) sale por la red de gestión hacia el host Proxmox
#      (10.10.10.1) — el único gateway real del nodo, y está MEDIDO que da salida
#      — y hace NAT (masquerade) para toda la empresa. NO se pone ningún invitado
#      en vmbr0 (el bridge público): la salida va por la LAN de gestión, nunca
#      exponiendo la máquina a internet directamente. El NAT vive SÓLO en el
#      borde: los firewalls de sede filtran pero no traducen, así que dentro de la
#      empresa las direcciones son las reales y las rutas de vuelta existen.
#
#   4. NOMBRES DESCRIPTIVOS: 3-Ca-swac-10, 3-Sa-rtco-10, 3-Sb-fwpe-10, 3-Ca-pc-10,
#      3-Ba-fwbo-10, 3-Ia-boot-10. El nombre dice el tipo, la sede y la
#      función; no hay que consultar nada para saber qué es cada máquina.
# ============================================================================

pve_node: Proxmox

# ---------------------------------------------------------------------------
# DIRECCIONAMIENTO
#
# Todas las direcciones de GESTIÓN viven en 10.10.10.0/24 (vmbr1), cuya puerta
# es el host Proxmox (10.10.10.1). Ese /24 no se puede ampliar sin reconfigurar
# el host, y el host no se toca (ver .hermes.md), así que la regla de la v1
# ("el último octeto es el vmid") NO cabe con cuatro dígitos: aquí las
# direcciones de gestión se asignan por BLOQUES DE FUNCIÓN.
#
#   10.10.10.1      el host Proxmox (NO es nuestro; es el gateway)
#   10.10.10.2      un invitado preexistente, AJENO a este repositorio
#   10.10.10.71-19  switches      (ST = 13/23/33)
#   10.10.10.81-29  routers       (ST = 12/22/32)
#   10.10.10.91-39  firewalls     (ST = 11/21/31, y el de borde 91)
#   10.10.10.101-49  infraestructura (ST = 09)
#
# La direccion CONCRETA de cada equipo no se escribe en su ficha: se declara en
# el bloque `mgmt:` de su sede (o en `lab_mgmt_otros`, para lo que no es una
# sede) y cada ficha la CITA. Los bloques de arriba son la convencion que esa
# tabla respeta; si un dia cambia una direccion, cambia en UN sitio.
# ---------------------------------------------------------------------------
lab_mgmt_network: "10.10.10.0/24"
lab_mgmt_gateway: "10.10.10.1"
# El bridge del nodo donde vive la red de gestión. Se declara porque los
# documentos y las notas lo citan, y citarlo a mano es como se quedan viejos.
lab_mgmt_bridge: "vmbr1"

# ---------------------------------------------------------------------------
# LAS SEDES. Una sede es UNA ENTRADA: su LAN, su tránsito hacia el firewall y su
# enlace WAN. El direccionamiento se escribe AQUÍ una sola vez, y las
# declaraciones de equipo lo citan por id (lab_sede[N]) en vez de llevarlo
# dentro.
#
#   id        el dígito S de la numeración STNN: lo que ata cada equipo
#             declarado a su sede (1 central, 2 y 3 delegaciones).
#   red/puerta/pool   la LAN de la sede. La puerta es su ROUTER, que es también
#             quien reparte el DHCP: el DHCP es una difusión de capa 2, así que
#             quien reparte tiene que estar en el mismo segmento que sus clientes
#             (o un relay desde él). Aquí puerta y servidor son el mismo equipo.
#   transito  el /30 router<->firewall de la sede: el cable que separa la LAN del
#             equipo que la filtra (el router ve su LAN por dentro, el firewall
#             la empresa por fuera).
#   wan       el /30 con el firewall del HUB. La sede del hub NO tiene `wan`:
#             ella ES el hub.
#
# La forma no es una tabla plana porque la topología no lo es: la central es el
# hub (su firewall tiene cuatro bocas —tránsito, dos WAN y el borde—) y las
# delegaciones son spokes. Eso ES la topología, así que se declara; lo que se
# deja de repetir es el direccionamiento.
# ---------------------------------------------------------------------------
lab_numero: 3          # L del número (ver docs/decisiones/0008)
lab_pool: lab-coworking         # el Resource Pool del laboratorio (ADR 0008)
lab_nombre: "un edificio de oficinas compartidas"
lab_hub: 6

# ---------------------------------------------------------------------------
# FAMILIAS DE SEDE — la primera letra del código. El número que va al vmid es la
# POSICIÓN de la familia (1..5) y la segunda letra (minúscula) es el índice
# dentro de ella. Ver docs/decisiones/0007-codigo-de-sede.md.
# ---------------------------------------------------------------------------
lab_familias:
  - { letra: "C", nombre: "central" }          # 1x
  - { letra: "S", nombre: "sedes" }            # 2x
  - { letra: "I", nombre: "infraestructura" }  # 3x
  - { letra: "G", nombre: "gestión" }          # 4x
  - { letra: "B", nombre: "borde" }            # 5x

# ---------------------------------------------------------------------------
# POLÍTICA DE ALCANCE ENTRE SEDES — lo que el test debe comprobar que NO se cruza
# ---------------------------------------------------------------------------
# El test deriva de la declaración que TODAS las estaciones se alcanzan; esto lo
# NIEGA. Sin esto, un laboratorio cuyo PUNTO es la separación se verificaría al
# revés: el test daría por bueno justo lo que el caso de uso tiene que impedir.
# Las parejas son «desde -> hasta» (ids de sede), y el test las convierte en una
# prueba NEGATIVA: el destino no debe contestar. Es el mismo mecanismo con el que
# ya se vigila el segmento OOB, generalizado a cualquier pareja declarada.
lab_policy:
  deny:
    - from: [7]
      to: [8]
      why: "el inquilino A no ve al inquilino B"
    - from: [8]
      to: [7]
      why: "el inquilino B no ve al inquilino A"

lab_sites:
  - id: 6
    nombre: "edificio"
    codigo: "Ca"          # familia C (central) + a
    etiqueta: "el edificio (infraestructura común)"
    red: "10.41.0.0/24"
    puerta: "10.41.0.1"
    pool: "10.41.0.100-10.41.0.199"
    transito: { red: "10.51.0.0/30", fw: "10.51.0.1", rt: "10.51.0.2" }
    mgmt: { sw: ["10.10.10.71", "10.10.10.72"], rt: "10.10.10.81", fw: "10.10.10.91" }
  - id: 7
    nombre: "inquilino-a"
    codigo: "Sa"          # familia S (sedes) + a
    etiqueta: "el inquilino A"
    red: "10.42.0.0/24"
    puerta: "10.42.0.1"
    pool: "10.42.0.100-10.42.0.199"
    transito: { red: "10.52.0.0/30", fw: "10.52.0.1", rt: "10.52.0.2" }
    wan: { red: "10.98.1.0/30", hub: "10.98.1.1", spoke: "10.98.1.2" }
    mgmt: { sw: ["10.10.10.73"], rt: "10.10.10.82", fw: "10.10.10.92" }
  - id: 8
    nombre: "inquilino-b"
    codigo: "Sb"          # familia S (sedes) + b
    etiqueta: "el inquilino B"
    red: "10.43.0.0/24"
    puerta: "10.43.0.1"
    pool: "10.43.0.100-10.43.0.199"
    transito: { red: "10.53.0.0/30", fw: "10.53.0.1", rt: "10.53.0.2" }
    wan: { red: "10.98.2.0/30", hub: "10.98.2.1", spoke: "10.98.2.2" }
    mgmt: { sw: ["10.10.10.74"], rt: "10.10.10.83", fw: "10.10.10.93" }

# ---------------------------------------------------------------------------
# TABLA DE CLASES (CC del número)
#
# La decena es la FAMILIA y la unidad el PAPEL dentro de ella. La clase describe
# el tipo y el papel juntos: un firewall perimetral no es «firewall» más
# «perimetral», es una clase. El token es como se escribe en el nombre; el número
# es como se escribe en el VMID. Ver docs/decisiones/0005-numero-compuesto.md.
#
#   1x conmutación   2x enrutamiento   7x apoyo   8x seguridad   9x puestos
# ---------------------------------------------------------------------------
# Sedes que no son `lab_sites`: la infraestructura (el bootstrap), la gestión
# (el switch de gestión) y el borde. Se declaran aquí porque también ocupan un
# código de sede en el número, aunque no alojen estaciones.
lab_sedes_extra:
  Ia: "infraestructura"
  Ga: "gestión"
  Ba: "borde"

lab_clases:
  11: { token: "swac", nombre: "switch de acceso" }
  12: { token: "swge", nombre: "switch de gestión" }
  13: { token: "swco", nombre: "switch de núcleo" }
  21: { token: "rtco", nombre: "router de núcleo" }
  22: { token: "rtbo", nombre: "router de borde" }
  71: { token: "boot", nombre: "bootstrap" }
  81: { token: "fwpe", nombre: "firewall perimetral" }
  82: { token: "fwbo", nombre: "firewall de borde" }
  91: { token: "pc",   nombre: "estación de trabajo" }

# Acceso por id: las declaraciones de equipo dicen lab_sede[7].red, no la IP.
lab_sede: "{{ dict(lab_sites | map(attribute='id') | zip(lab_sites)) }}"

# Las direcciones de gestion de lo que NO es una sede: el contenedor de
# infraestructura (da la primera direccion a cada equipo de red) y el firewall
# de borde. Se declaran aqui por el mismo motivo que las de sede: una vez, y
# las fichas las citan.
# ---------------------------------------------------------------------------
# SEGUNDO SEGMENTO DE GESTION (OOB) — su puerta es el HOST, 10.40.40.1/24
#
# Por que existe: el primer segmento de gestion esta justo ENCIMA de la puerta
# del host. Eso hace que, para alcanzarlo desde el tunel, baste con estar en el
# mismo segmento; no hace falta anadirle rutas al host. Este segundo segmento NO
# esta encima de la puerta: para llegar a el desde el tunel hace falta una ruta
# en el host — y por eso su bridge lleva direccion. El host enruta lo que tiene
# conectado, asi que su direccion en el bridge ES la puerta del segmento.
#
# El bootstrap lo sirve igual que el primero: su net1 esta en este bridge y su
# dnsmasq reparte en los dos. Un equipo NUEVO aqui nace con su primera direccion
# sin que nadie la escriba a mano — que es el trabajo real del bootstrap.
# ---------------------------------------------------------------------------
lab_mgmt2:
  bridge: vmbr68
  red: "10.40.40.0/24"
  prefijo: "10.40.40.0/24"
  puerta: "10.40.40.1"
  pool: "10.40.40.100-10.40.40.200"
  bootstrap: "10.40.40.41"
  reserva: "10.40.40.11"

lab_mgmt_otros:
  infra: "10.10.10.101"
  borde: "10.10.10.94"


# El borde de la empresa: el firewall de la central entrega aquí todo lo que
# sale, y el firewall de borde lo NAT-ea hacia la red de gestión.
lab_edge_network: "10.59.0.0/30"
lab_edge_core: "10.59.0.1"
lab_edge_fw: "10.59.0.2"

# El "proveedor de internet" es el propio host Proxmox: es el único que tiene
# salida real, y está medido (TCP a internet desde la LAN de gestión funciona).
lab_internet_gateway: "10.10.10.1"
lab_internet_dns: "1.1.1.1"

# El bridge del nodo con salida real (su uplink público). NINGÚN invitado del
# laboratorio va aquí: la salida va por la red de gestión. Se declara para que la
# documentación pueda citarlo sin escribirlo a mano.
pve_public_bridge: "vmbr0"

# Red del nodo de control (el túnel). No es una red de la empresa: es el camino
# por el que ESTE nodo entra a gestionar.
lab_control_network: "10.99.99.0/24"
lab_control_via: "10.10.10.1"

# ---------------------------------------------------------------------------
# CLAVE DE AUTOMATIZACIÓN
#
# Aquí NO va su ruta: la clave es del framework y vive con él, no con la
# topología. Se declara UNA vez, en el entorno de la máquina de control
# (`playbooks/vars/entorno.yml`, plantilla `entorno.example.yml`), en
# `pve_ssh_key_path`; y su `.pub` se DERIVA de esa ruta (la misma más `.pub`),
# así que no hay dos sitios que puedan desfasarse. Ver `tools/entorno.py`.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# TÚNEL DE GESTIÓN (WireGuard)
#
# El control node no está en la LAN del laboratorio: entra por un túnel cuyo
# extremo vive en el host Proxmox. La mitad del host NO la puede configurar la
# API (sería ejecutar código en el hipervisor), así que se pega UNA vez con
# playbooks/tools/wg_endpoint_setup.sh — incluida la ruta por sede, que es el
# último argumento.
# ---------------------------------------------------------------------------
pve_tunnel:
  # El túnel de gestión lo GESTIONA otro laboratorio del nodo; éste lo REUTILIZA y no
  # lo toca. Gestionarlo desde dos sitios es cómo se acaba desmontando el que el otro
  # está usando. El extremo del túnel ya tiene ruta a este laboratorio por su red de
  # gestión (todas las sedes cuelgan de la misma LAN del host).
  manage: false
  name: wg-lab
  address: "10.99.99.2/24"

# ---------------------------------------------------------------------------
# SEGMENTOS DEL HOST (bridges, los "cables")
#
# Uno por CABLE, aislado (sin puertos de uplink), y el nombre del bridge aparece
# literal en sus dos puntas. El motor sólo CREA bridges: los que dejan de
# declararse se quedan en el host y se retiran por la API. Los comentarios de
# los segmentos que ya existen los pone el repositorio con una llamada aparte
# (playbooks/tools/segment_comments.py), porque el motor no los reescribe.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# ESQUEMA DE COLOR DE LAS ETIQUETAS (Datacenter -> Options -> Tag Style).
#
# No es decoración: es cómo se lee una máquina de un vistazo en el árbol del
# interfaz. Tres ejes y un color reservado:
#
#   ROJO            -> gestionado por ESTE repositorio. Si un invitado no lleva
#                      el rojo, este repositorio no lo declara y no lo toca.
#   color por ROL   -> qué es: switch, router, firewall, workstation, bootstrap.
#   color por SEDE  -> dónde está: central, delegación, borde, infraestructura.
#
# El vocabulario de etiquetas es corto a propósito (tres por invitado) y tiene
# que caber en la lista permitida del datacenter (`allowed-tags`), que PVE
# aplica: un tag que no esté allí lo rechaza.
# ---------------------------------------------------------------------------
pve_tag_style:
  # full dibuja la etiqueta entera en el árbol; circle y dense la abrevian, y
  # none la esconde. Con tres tags por invitado, "full" es lo que se lee.
  shape: full
  # Forma que almacena PVE (comprobada contra la API):
  #   color-map=<tag>:<color-de-fondo>[:<color-del-texto>];<tag>:...
  colors: "ansible:b71c1c:ffffff;switch:1565c0:ffffff;router:2e7d32:ffffff;firewall:ef6c00:ffffff;workstation:455a64:ffffff;bootstrap:6a1b9a:ffffff;ca:00838f:ffffff;sa:6d4c41:ffffff;sb:8d6e63:ffffff;ia:5e35b1:ffffff;ga:8e24aa:ffffff;ba:37474f:ffffff"

pve_bridges:
  # ---- SEDE 1 (central) -----------------------------------------------------
  - iface: vmbr50
    comments: "cable: 3-Ca-pc-10 eth0 <-> 3-Ca-swac-10 ether2"
  - iface: vmbr51
    comments: "cable: 3-Ca-pc-11 eth0 <-> 3-Ca-swac-10 ether3"
  - iface: vmbr52
    comments: "cable: 3-Ca-pc-12 eth0 <-> 3-Ca-swac-11 ether2"
  - iface: vmbr53
    comments: "cable: 3-Ca-pc-13 eth0 <-> 3-Ca-swac-11 ether3"
  - iface: vmbr54
    comments: "cable: 3-Ca-swac-10 ether4 <-> 3-Ca-swac-11 ether4 (troncal L2)"
  - iface: vmbr55
    comments: "cable: 3-Ca-swac-10 ether5 <-> 3-Ca-rtco-10 ether2 (LA LAN DE LA SEDE 1, 10.41.0.0/24)"
  - iface: vmbr56
    comments: "cable: 3-Ca-rtco-10 ether3 <-> 3-Ca-fwpe-10 ether2 (transito 10.51.0.0/30)"
  - iface: vmbr57
    comments: "WAN 1: 3-Ca-fwpe-10 ether3 <-> 3-Sa-fwpe-10 ether3 (10.98.1.0/30)"
  - iface: vmbr58
    comments: "WAN 2: 3-Ca-fwpe-10 ether4 <-> 3-Sb-fwpe-10 ether3 (10.98.2.0/30)"
  - iface: vmbr59
    comments: "cable: 3-Ca-fwpe-10 ether5 <-> 3-Ba-fwbo-10 ether2 (transito de borde 10.59.0.0/30)"
  # ---- SEDE 2 (delegacion) --------------------------------------------------
  - iface: vmbr60
    comments: "cable: 3-Sa-pc-10 eth0 <-> 3-Sa-swac-10 ether2"
  - iface: vmbr61
    comments: "cable: 3-Sa-pc-11 eth0 <-> 3-Sa-swac-10 ether3"
  - iface: vmbr62
    comments: "cable: 3-Sa-swac-10 ether4 <-> 3-Sa-rtco-10 ether2 (LA LAN DE LA SEDE 2, 10.42.0.0/24)"
  - iface: vmbr63
    comments: "cable: 3-Sa-rtco-10 ether3 <-> 3-Sa-fwpe-10 ether2 (transito 10.52.0.0/30)"
  # ---- SEDE 3 (delegacion) --------------------------------------------------
  - iface: vmbr64
    comments: "cable: 3-Sb-pc-10 eth0 <-> 3-Sb-swac-10 ether2"
  - iface: vmbr65
    comments: "cable: 3-Sb-pc-11 eth0 <-> 3-Sb-swac-10 ether3"
  - iface: vmbr66
    comments: "cable: 3-Sb-swac-10 ether4 <-> 3-Sb-rtco-10 ether2 (LA LAN DE LA SEDE 3, 10.43.0.0/24)"
  - iface: vmbr67
    comments: "cable: 3-Sb-rtco-10 ether3 <-> 3-Sb-fwpe-10 ether2 (transito 10.53.0.0/30)"
  - iface: vmbr68
    comments: "SEGUNDO SEGMENTO DE GESTION (OOB): la puerta es el host 10.40.40.1/24"
    address: "10.40.40.1/24"

# ---------------------------------------------------------------------------
# CONTENEDORES (LXC)
# ---------------------------------------------------------------------------
pve_defaults:
  # ---- creation-time: PVE cannot change these on an existing container ------
  template: "local:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst"
  template_storage: local
  storage: local-zfs
  rootfs_size: 8
  unprivileged: true
  ostype: debian

  # ---- power state ---------------------------------------------------------
  # started | stopped. En marcha: aplicar la declaración ES levantar el
  # laboratorio, y ese es el sentido de tenerlo declarado.
  status: started

  # ---- resources (converged in place) --------------------------------------
  memory: 2048
  swap: 512
  cores: 2
  cpuunits: 1024

  # ---- behaviour (converged in place) --------------------------------------
  onboot: false
  description: "Managed by ansible-netlabs-v3. Declare changes in labs/coworking/inventory/group_vars/all.yml."
  # Etiqueta base; cada invitado AÑADE las suyas (sede y papel) a esta lista.
  tags: [netlab, ansible]
  timezone: host
  cmode: shell
  features: []
  startup: []

  # ---- network (converged in place; empty = no interface at all) ----------
  netif: {}
  nameserver: null
  searchdomain: null

  # ---- attachments (converged in place; empty = must not exist) -----------
  hookscript: null
  mounts: {}
  mount_devices: []

  # ---- the key at birth ----------------------------------------------------
  pubkey: "{{ lookup('file', pve_ssh_key_path ~ '.pub', errors='ignore') | default('', true) | trim }}"

# The containers this repository manages — and nothing else. A container absent
# from this list is never read, created or modified.
pve_containers:
  # ==========================================================================
  # 09xx — INFRAESTRUCTURA
  #
  # Lo mínimo para que el laboratorio nazca: el equipo que da a los routers su
  # primera dirección. No hay más servicios: esto describe una red de empresa,
  # no un parque de aplicaciones.
  # ==========================================================================

  # 3-Ia-boot-10: concede a cada equipo de red su primera dirección por DHCP,
  # atada a su MAC, para que su API REST exista desde el primer arranque. Vive
  # en la LAN de gestión. Es la SALA DE PARTOS, no una dependencia de
  # funcionamiento: una vez cada equipo tiene su dirección, no interviene.
  - vmid: 3317110
    hostname: 3-Ia-boot-10
    cores: 1
    memory: 1024
    rootfs_size: 4
    swap: 256
    onboot: true
    startup: ["order=1"]
    netif:
      net0: "name=eth0,bridge=vmbr1,gw=10.10.10.1,ip={{ lab_mgmt_otros.infra }}/24"
      # Sin `gw=` en la pata 2: una segunda interfaz con puerta por defecto le
      # roba la ruta por defecto a la pata 1, que es la que si esta NAT-eada en el
      # host. El contenedor conserva su salida por eth0 y sigue sirviendo DHCP en
      # las dos patas.
      net1: "name=eth1,bridge=vmbr68,ip={{ lab_mgmt2.bootstrap }}/24"
    manage: true
    config:
      bootstrap:
        interface: eth0
        segments:
          - interface: eth0
            bridge: vmbr1
            red: "10.10.10.0/24"   # LAN de gestión (no la red del túnel)
            gateway: "{{ lab_mgmt_gateway }}"
            pool: "{{ lab_mgmt_otros.infra }}"
          - interface: eth1
            bridge: vmbr68
            red: "{{ lab_mgmt2.red }}"
            gateway: "{{ lab_mgmt2.puerta }}"
            pool: "{{ lab_mgmt2.pool }}"
        # A qué tiene que saber VOLVER: las redes de las tres sedes. Sin esto
        # recibe los pings de una workstation y no puede contestarlos, porque su
        # ruta por defecto va al host y el host no enruta hacia el interior. El
        # gateway es el núcleo, que es el que conoce las tres sedes.
        routes:
          - "{{ lab_sede[6].red }}"
          - "{{ lab_sede[7].red }}"
          - "{{ lab_sede[8].red }}"
        route_gateway: "{{ lab_sede[6].mgmt.rt }}"   # 3-Ca-rtco-10
        hosts: >-
          {%- set out = [] -%}
          {%- for v in pve_vms | selectattr('chr', 'defined') -%}
          {%-   set mac = (v.net.net0.split(',') | select('match', '^virtio=') | first).split('=')[1] -%}
          {%-   set mgmt = v.config.routeros.addresses
                          | selectattr('interface', 'equalto', 'ether1') | first -%}
          {%-   set _ = out.append({'mac': mac,
                                    'address': mgmt.address.split('/')[0],
                                    'name': v.name}) -%}
          {%- endfor -%}
          {{ out }}

