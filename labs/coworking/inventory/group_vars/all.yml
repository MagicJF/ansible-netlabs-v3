# ============================================================================
# QEMU VMs — mismas reglas declarativas que los contenedores, con una
# diferencia: proxmox_kvm se niega a actualizar net/scsi/ide/sata/virtio (y
# bios/machine/scsihw/ostype), así que para una VM son creation-time: la deriva
# en ellos se RECHAZA, no se converge. Y por eso cambiar de qué bridge cuelga
# una pata obliga a recrear la máquina.
# ============================================================================
pve_vm_defaults:
  bios: seabios
  machine: q35
  scsihw: virtio-scsi-single
  ostype: l26

  status: stopped

  sockets: 1
  cpu: host
  vga: std
  onboot: false
  boot: "order=ide2;scsi0"
  description: "Nested Proxmox VE managed by ansible-netlabs-v3."
  tags: [netlab, ansible]

  net: {}
  scsi: {}
  sata: {}
  ide: {}
  virtio: {}

  cloudinit: true
  cloudinit_storage: local-zfs
  ciuser: root
  sshkeys: "{{ pve_defaults.pubkey }}"

# ---------------------------------------------------------------------------
# CHR (MikroTik RouterOS) — valores por defecto de TODO equipo de red.
#
# Aquí viven el sabor, el orden de arranque y la forma común, porque los equipos
# de red son once y repetir eso en cada uno es pedir que se desincronicen. Cada
# equipo AÑADE sus propias etiquetas (sede y papel) sin repetir estas.
#
# Los equipos de red van ANTES que las workstations: la petición DHCP de una
# workstation la contesta el router de su sede, así que arrancarlos juntos es
# una carrera que la workstation pierde.
# ---------------------------------------------------------------------------
pve_chr_defaults:
  onboot: true
  startup: ["order=2"]
  # 1 core y 256 MiB por equipo de red: un CHR que conmuta, enruta o filtra
  # (que es todo lo que hace) no necesita más, y ahora son once.
  cores: 1
  memory: 256
  # En marcha: aplicar la declaración ES levantar el laboratorio.
  status: started
  manage: true
  # La imagen del fabricante no tiene cloud-init, así que esa unidad sería peso
  # muerto.
  cloudinit: false
  # CHR es una imagen de la era i440fx: arranca en el chipset PC, no en q35.
  machine: pc
  # La imagen importada es el ÚNICO disco, así que es el dispositivo de arranque
  # (el orden por defecto espera la unidad cloud-init que esta VM no tiene).
  boot: "order=scsi0"
  scsi:
    # 1 GiB y no 8: la imagen del fabricante ocupa 128 MiB y RouterOS CHR vive en
    # RAM, así que un disco grande aquí es espacio asignado que nadie usa.
    scsi0: "local-zfs:1"
  # La imagen del fabricante se IMPORTA en vez de crearse: proxmox_kvm sólo sabe
  # construir un disco a partir de un tamaño, así que la imagen raw está subida a
  # un storage que acepta `import` y se adjunta con la sintaxis import-from de la
  # API en el momento de crear la VM (ver playbooks/tasks/disk_import.yml).
  disk_import:
    - key: scsi0
      source: "local:import/chr-7.25.1.raw"
  # La consola que respeta un teclado que no es US: lleva CARACTERES, no
  # scancodes. `vga: serial0` es lo que hace que el botón Console de PVE abra
  # esta consola en vez de un noVNC que no tiene nada que mostrar.
  serial:
    serial0: socket
  vga: serial0
  description: "MikroTik RouterOS: una funcion de red, un equipo. Gestionado por REST."
  tags: [netlab, routeros, red, ansible]

pve_vms:
  - vmid: 3411210
    name: 3-Ga-swge-10
    chr: true
    net:
      net0: "virtio=BC:24:12:00:20:01,bridge=vmbr68"
    config:
      routeros:
        identity: 3-Ga-swge-10
        addresses:
          - address: "{{ lab_mgmt2.reserva }}/24"
            interface: ether1
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_mgmt2.puerta }}"
  # ==========================================================================
  # SWITCHES (ST = 3S) — conmutan. No enrutan, no filtran y NO dan DHCP.
  #
  # Un switch de acceso: los puertos de los PCs a un lado, el puerto hacia su
  # router al otro. Su única dirección es la de gestión.
  # ==========================================================================

  # 3-Ca-swac-10: primer switch de acceso de la central. Une 3-Ca-pc-10 y 3-Ca-pc-11
  # y entrega la sede a su router. El troncal hacia el segundo switch va por
  # ether4.
  - vmid: 3111110
    name: 3-Ca-swac-10
    chr: true
    net:
      net0: "virtio=BC:24:12:00:31:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:12:00:31:02,bridge=vmbr50"    # ether2 -> 3-Ca-pc-10
      net2: "virtio=BC:24:12:00:31:03,bridge=vmbr51"    # ether3 -> 3-Ca-pc-11
      net3: "virtio=BC:24:12:00:31:04,bridge=vmbr54"    # ether4 -> 3-Ca-swac-11 (troncal)
      net4: "virtio=BC:24:12:00:31:05,bridge=vmbr55"    # ether5 -> 3-Ca-rtco-10 (la LAN de la sede)
    config:
      routeros:
        identity: 3-Ca-swac-10
        addresses:
          - address: "{{ lab_sede[6].mgmt.sw[0] }}/24"
            interface: ether1
        bridges:
          - name: lan
            ports: [ether2, ether3, ether4, ether5]
        dhcp_client: false
        # La puerta de enlace de gestión apunta al router de su sede, que es el
        # que conecta con el resto. Es lo que convierte al switch en un equipo
        # gestionable de verdad.
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_sede[6].mgmt.rt }}"

  # 3-Ca-swac-11: segundo switch de acceso de la central. Cuelga del troncal
  # (mismo dominio L2, que es lo que hace que las cuatro workstations de la sede
  # compartan una sola red).
  - vmid: 3111111
    name: 3-Ca-swac-11
    chr: true
    net:
      net0: "virtio=BC:24:12:00:32:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:12:00:32:02,bridge=vmbr52"    # ether2 -> 3-Ca-pc-12
      net2: "virtio=BC:24:12:00:32:03,bridge=vmbr53"    # ether3 -> 3-Ca-pc-13
      net3: "virtio=BC:24:12:00:32:04,bridge=vmbr54"    # ether4 -> 3-Ca-swac-10 (troncal)
    config:
      routeros:
        identity: 3-Ca-swac-11
        addresses:
          - address: "{{ lab_sede[6].mgmt.sw[1] }}/24"
            interface: ether1
        bridges:
          - name: lan
            ports: [ether2, ether3, ether4]
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_sede[6].mgmt.rt }}"

  # 3-Sa-swac-10: el switch de acceso de la delegación 2.
  - vmid: 3211110
    name: 3-Sa-swac-10
    chr: true
    net:
      net0: "virtio=BC:24:12:00:33:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:12:00:33:02,bridge=vmbr60"   # ether2 -> 3-Sa-pc-10
      net2: "virtio=BC:24:12:00:33:03,bridge=vmbr61"   # ether3 -> 3-Sa-pc-11
      net3: "virtio=BC:24:12:00:33:04,bridge=vmbr62"   # ether4 -> 3-Sa-rtco-10 (la LAN de la sede)
    config:
      routeros:
        identity: 3-Sa-swac-10
        addresses:
          - address: "{{ lab_sede[7].mgmt.sw[0] }}/24"
            interface: ether1
        bridges:
          - name: lan
            ports: [ether2, ether3, ether4]
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_sede[7].mgmt.rt }}"

  # 3-Sb-swac-10: el switch de acceso de la delegación 3.
  - vmid: 3221110
    name: 3-Sb-swac-10
    chr: true
    net:
      net0: "virtio=BC:24:12:00:34:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:12:00:34:02,bridge=vmbr64"   # ether2 -> 3-Sb-pc-10
      net2: "virtio=BC:24:12:00:34:03,bridge=vmbr65"   # ether3 -> 3-Sb-pc-11
      net3: "virtio=BC:24:12:00:34:04,bridge=vmbr66"   # ether4 -> 3-Sb-rtco-10 (la LAN de la sede)
    config:
      routeros:
        identity: 3-Sb-swac-10
        addresses:
          - address: "{{ lab_sede[8].mgmt.sw[0] }}/24"
            interface: ether1
        bridges:
          - name: lan
            ports: [ether2, ether3, ether4]
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_sede[8].mgmt.rt }}"

  # ==========================================================================
  # ROUTERS (ST = 2S) — son la PUERTA DE ENLACE y el SERVIDOR DHCP de su LAN, y
  # enrutan dentro de la empresa. No filtran: eso es del firewall.
  #
  # Su LAN cuelga de ether2 (por el cable al switch de su sede) y por eso pueden
  # repartir direcciones: el DHCP es broadcast L2 y el router está DENTRO de ese
  # segmento. Por ether3 hablan con su firewall, que es la boca hacia fuera.
  # ==========================================================================

  # 3-Ca-rtco-10: el router de la central. Conoce las tres sedes (a través de su
  # firewall) y es el núcleo de la WAN interna.
  - vmid: 3112110
    name: 3-Ca-rtco-10
    chr: true
    net:
      net0: "virtio=BC:24:12:00:21:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:12:00:21:02,bridge=vmbr55"    # ether2 -> 3-Ca-swac-10 (LA LAN DE LA SEDE)
      net2: "virtio=BC:24:12:00:21:03,bridge=vmbr56"   # ether3 -> 3-Ca-fwpe-10 (transito)
    config:
      routeros:
        identity: 3-Ca-rtco-10
        addresses:
          - address: "{{ lab_sede[6].mgmt.rt }}/24"
            interface: ether1
          - address: "{{ lab_sede[6].puerta }}/24"
            interface: ether2
          - address: "{{ lab_sede[6].transito.rt }}/30"
            interface: ether3
        dhcp_client: false
        routes:
          # Las delegaciones y la salida, por su firewall.
          - dst_address: "{{ lab_sede[7].red }}"
            gateway: "{{ lab_sede[6].transito.fw }}"
          - dst_address: "{{ lab_sede[8].red }}"
            gateway: "{{ lab_sede[6].transito.fw }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_mgmt_gateway }}"
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_sede[6].transito.fw }}"
        # El DHCP lo sirve AQUÍ, no en el firewall: es el router de la sede.
        dhcp_servers:
          - name: sede6
            interface: ether2
            address_pool: "{{ lab_sede[6].pool }}"
            network: "{{ lab_sede[6].red }}"
            gateway: "{{ lab_sede[6].puerta }}"
            dns_server: "{{ lab_internet_dns }}"
            # Una reserva por workstation DE ESTA SEDE. Dirección y MAC salen de
            # la declaración de la propia workstation: aquí no se repite ningún
            # valor, así que no pueden desincronizarse.
            leases: >-
              {%- set out = [] -%}
              {%- for c in pve_containers
                     | selectattr('site', 'defined')
                     | selectattr('site', 'equalto', 'sede6') -%}
              {%-   set _ = out.append({
                    'address': c.address,
                    'mac_address': (c.netif.net0.split(',') | select('match', '^hwaddr=') | first).split('=')[1],
                    'comment': c.hostname }) -%}
              {%- endfor -%}
              {{ out }}

  # 3-Sa-rtco-10: el router de la delegación 2. Su LAN, su DHCP y una ruta por
  # defecto hacia su firewall: la configuración real de una delegación, que no
  # necesita saber qué hay al otro lado.
  - vmid: 3212110
    name: 3-Sa-rtco-10
    chr: true
    net:
      net0: "virtio=BC:24:12:00:22:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:12:00:22:02,bridge=vmbr62"   # ether2 -> 3-Sa-swac-10 (LA LAN DE LA SEDE)
      net2: "virtio=BC:24:12:00:22:03,bridge=vmbr63"   # ether3 -> 3-Sa-fwpe-10 (transito)
    config:
      routeros:
        identity: 3-Sa-rtco-10
        addresses:
          - address: "{{ lab_sede[7].mgmt.rt }}/24"
            interface: ether1
          - address: "{{ lab_sede[7].puerta }}/24"
            interface: ether2
          - address: "{{ lab_sede[7].transito.rt }}/30"
            interface: ether3
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_sede[7].transito.fw }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_mgmt_gateway }}"
        dhcp_servers:
          - name: sede7
            interface: ether2
            address_pool: "{{ lab_sede[7].pool }}"
            network: "{{ lab_sede[7].red }}"
            gateway: "{{ lab_sede[7].puerta }}"
            dns_server: "{{ lab_internet_dns }}"
            leases: >-
              {%- set out = [] -%}
              {%- for c in pve_containers
                     | selectattr('site', 'defined')
                     | selectattr('site', 'equalto', 'sede7') -%}
              {%-   set _ = out.append({
                    'address': c.address,
                    'mac_address': (c.netif.net0.split(',') | select('match', '^hwaddr=') | first).split('=')[1],
                    'comment': c.hostname }) -%}
              {%- endfor -%}
              {{ out }}

  # 3-Sb-rtco-10: el router de la delegación 3, simétrico al anterior.
  - vmid: 3222110
    name: 3-Sb-rtco-10
    chr: true
    net:
      net0: "virtio=BC:24:12:00:23:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:12:00:23:02,bridge=vmbr66"   # ether2 -> 3-Sb-swac-10 (LA LAN DE LA SEDE)
      net2: "virtio=BC:24:12:00:23:03,bridge=vmbr67"   # ether3 -> 3-Sb-fwpe-10 (transito)
    config:
      routeros:
        identity: 3-Sb-rtco-10
        addresses:
          - address: "{{ lab_sede[8].mgmt.rt }}/24"
            interface: ether1
          - address: "{{ lab_sede[8].puerta }}/24"
            interface: ether2
          - address: "{{ lab_sede[8].transito.rt }}/30"
            interface: ether3
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_sede[8].transito.fw }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_mgmt_gateway }}"
        dhcp_servers:
