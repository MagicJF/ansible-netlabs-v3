                     | selectattr('site', 'defined')
                     | selectattr('site', 'equalto', 'sede8') -%}
              {%-   set _ = out.append({
                    'address': c.address,
                    'mac_address': (c.netif.net0.split(',') | select('match', '^hwaddr=') | first).split('=')[1],
