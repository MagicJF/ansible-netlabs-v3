# ============================================================================
# QEMU VMs — mismas reglas declarativas que los contenedores, con una
# diferencia: proxmox_kvm se niega a actualizar net/scsi/ide/sata/virtio (y
# bios/machine/scsihw/ostype), así que para una VM son creation-time: la deriva
# en ellos se RECHAZA, no se converge. Y por eso cambiar de qué bridge cuelga
# una pata obliga a recrear la máquina.
# ============================================================================
pve_vm_defaults:
  bios: seabios
  machine: q35
  scsihw: virtio-scsi-single
  ostype: l26

  status: stopped

  sockets: 1
  cpu: host
  vga: std
  onboot: false
  boot: "order=ide2;scsi0"
  description: "Nested Proxmox VE managed by ansible-netlabs-v3."
  tags: [netlab, ansible-managed]

  net: {}
  scsi: {}
  sata: {}
  ide: {}
  virtio: {}

  cloudinit: true
  cloudinit_storage: local-zfs
  ciuser: root
  sshkeys: "{{ pve_defaults.pubkey }}"

# ---------------------------------------------------------------------------
# CHR (MikroTik RouterOS) — valores por defecto de TODO equipo de red.
#
# Aquí viven el sabor, el orden de arranque y la forma común, porque los equipos
# de red son once y repetir eso en cada uno es pedir que se desincronicen. Cada
# equipo AÑADE sus propias etiquetas (sede y papel) sin repetir estas.
#
# Los equipos de red van ANTES que las workstations: la petición DHCP de una
# workstation la contesta el router de su sede, así que arrancarlos juntos es
# una carrera que la workstation pierde.
# ---------------------------------------------------------------------------
pve_chr_defaults:
  onboot: true
  startup: ["order=2"]
  # 1 core y 256 MiB por equipo de red: un CHR que conmuta, enruta o filtra
  # (que es todo lo que hace) no necesita más, y ahora son once.
  cores: 1
  memory: 256
  # En marcha: aplicar la declaración ES levantar el laboratorio.
  status: started
  manage: true
  # La imagen del fabricante no tiene cloud-init, así que esa unidad sería peso
  # muerto.
  cloudinit: false
  # CHR es una imagen de la era i440fx: arranca en el chipset PC, no en q35.
  machine: pc
  # La imagen importada es el ÚNICO disco, así que es el dispositivo de arranque
  # (el orden por defecto espera la unidad cloud-init que esta VM no tiene).
  boot: "order=scsi0"
  scsi:
    # 1 GiB y no 8: la imagen del fabricante ocupa 128 MiB y RouterOS CHR vive en
    # RAM, así que un disco grande aquí es espacio asignado que nadie usa.
    scsi0: "local-zfs:1"
  # La imagen del fabricante se IMPORTA en vez de crearse: proxmox_kvm sólo sabe
  # construir un disco a partir de un tamaño, así que la imagen raw está subida a
  # un storage que acepta `import` y se adjunta con la sintaxis import-from de la
  # API en el momento de crear la VM (ver playbooks/tasks/disk_import.yml).
  disk_import:
    - key: scsi0
      source: "local:import/chr-7.25.1.raw"
  # La consola que respeta un teclado que no es US: lleva CARACTERES, no
  # scancodes. `vga: serial0` es lo que hace que el botón Console de PVE abra
  # esta consola en vez de un noVNC que no tiene nada que mostrar.
  serial:
    serial0: socket
  vga: serial0
  description: "MikroTik RouterOS: una funcion de red, un equipo. Gestionado por REST."
  tags: [netlab, routeros, red, ansible-managed]

pve_vms:
  - vmid: 6601
    name: sw-mgmt-01
    chr: true
    net:
      net0: "virtio=BC:24:31:00:20:01,bridge=vmbr68"
    config:
      routeros:
        identity: sw-mgmt-01
        addresses:
          - address: "{{ lab_mgmt2.reserva }}/24"
            interface: ether1
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_mgmt2.puerta }}"
  # ==========================================================================
  # SWITCHES (ST = 3S) — conmutan. No enrutan, no filtran y NO dan DHCP.
  #
  # Un switch de acceso: los puertos de los PCs a un lado, el puerto hacia su
  # router al otro. Su única dirección es la de gestión.
  # ==========================================================================

  # sw-ed-acc-01: primer switch de acceso de la central. Une pc-ed-01 y pc-ed-02
  # y entrega la sede a su router. El troncal hacia el segundo switch va por
  # ether4.
  - vmid: 6301
    name: sw-ed-acc-01
    chr: true
    net:
      net0: "virtio=BC:24:31:00:31:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:31:00:31:02,bridge=vmbr50"    # ether2 -> pc-ed-01
      net2: "virtio=BC:24:31:00:31:03,bridge=vmbr51"    # ether3 -> pc-ed-02
      net3: "virtio=BC:24:31:00:31:04,bridge=vmbr54"    # ether4 -> sw-ed-acc-02 (troncal)
      net4: "virtio=BC:24:31:00:31:05,bridge=vmbr55"    # ether5 -> rt-ed-core (la LAN de la sede)
    config:
      routeros:
        identity: sw-ed-acc-01
        addresses:
          - address: "{{ lab_sede[1].mgmt.sw[0] }}/24"
            interface: ether1
        bridges:
          - name: lan
            ports: [ether2, ether3, ether4, ether5]
        dhcp_client: false
        # La puerta de enlace de gestión apunta al router de su sede, que es el
        # que conecta con el resto. Es lo que convierte al switch en un equipo
        # gestionable de verdad.
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_sede[1].mgmt.rt }}"

  # sw-ed-acc-02: segundo switch de acceso de la central. Cuelga del troncal
  # (mismo dominio L2, que es lo que hace que las cuatro workstations de la sede
  # compartan una sola red).
  - vmid: 6302
    name: sw-ed-acc-02
    chr: true
    net:
      net0: "virtio=BC:24:31:00:32:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:31:00:32:02,bridge=vmbr52"    # ether2 -> pc-ed-03
      net2: "virtio=BC:24:31:00:32:03,bridge=vmbr53"    # ether3 -> pc-ed-04
      net3: "virtio=BC:24:31:00:32:04,bridge=vmbr54"    # ether4 -> sw-ed-acc-01 (troncal)
    config:
      routeros:
        identity: sw-ed-acc-02
        addresses:
          - address: "{{ lab_sede[1].mgmt.sw[1] }}/24"
            interface: ether1
        bridges:
          - name: lan
            ports: [ether2, ether3, ether4]
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_sede[1].mgmt.rt }}"

  # sw-ia-acc-01: el switch de acceso de la delegación 2.
  - vmid: 7301
    name: sw-ia-acc-01
    chr: true
    net:
      net0: "virtio=BC:24:31:00:33:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:31:00:33:02,bridge=vmbr60"   # ether2 -> pc-ia-01
      net2: "virtio=BC:24:31:00:33:03,bridge=vmbr61"   # ether3 -> pc-ia-02
      net3: "virtio=BC:24:31:00:33:04,bridge=vmbr62"   # ether4 -> rt-ia-core (la LAN de la sede)
    config:
      routeros:
        identity: sw-ia-acc-01
        addresses:
          - address: "{{ lab_sede[2].mgmt.sw[0] }}/24"
            interface: ether1
        bridges:
          - name: lan
            ports: [ether2, ether3, ether4]
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_sede[2].mgmt.rt }}"

  # sw-ib-acc-01: el switch de acceso de la delegación 3.
  - vmid: 8301
    name: sw-ib-acc-01
    chr: true
    net:
      net0: "virtio=BC:24:31:00:34:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:31:00:34:02,bridge=vmbr64"   # ether2 -> pc-ib-01
      net2: "virtio=BC:24:31:00:34:03,bridge=vmbr65"   # ether3 -> pc-ib-02
      net3: "virtio=BC:24:31:00:34:04,bridge=vmbr66"   # ether4 -> rt-ib-core (la LAN de la sede)
    config:
      routeros:
        identity: sw-ib-acc-01
        addresses:
          - address: "{{ lab_sede[3].mgmt.sw[0] }}/24"
            interface: ether1
        bridges:
          - name: lan
            ports: [ether2, ether3, ether4]
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_sede[3].mgmt.rt }}"

  # ==========================================================================
  # ROUTERS (ST = 2S) — son la PUERTA DE ENLACE y el SERVIDOR DHCP de su LAN, y
  # enrutan dentro de la empresa. No filtran: eso es del firewall.
  #
  # Su LAN cuelga de ether2 (por el cable al switch de su sede) y por eso pueden
  # repartir direcciones: el DHCP es broadcast L2 y el router está DENTRO de ese
  # segmento. Por ether3 hablan con su firewall, que es la boca hacia fuera.
  # ==========================================================================

  # rt-ed-core: el router de la central. Conoce las tres sedes (a través de su
  # firewall) y es el núcleo de la WAN interna.
  - vmid: 6201
    name: rt-ed-core
    chr: true
    net:
      net0: "virtio=BC:24:31:00:21:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:31:00:21:02,bridge=vmbr55"    # ether2 -> sw-ed-acc-01 (LA LAN DE LA SEDE)
      net2: "virtio=BC:24:31:00:21:03,bridge=vmbr56"   # ether3 -> fw-ed-perim (transito)
    config:
      routeros:
        identity: rt-ed-core
        addresses:
          - address: "{{ lab_sede[1].mgmt.rt }}/24"
            interface: ether1
          - address: "{{ lab_sede[1].puerta }}/24"
            interface: ether2
          - address: "{{ lab_sede[1].transito.rt }}/30"
            interface: ether3
        dhcp_client: false
        routes:
          # Las delegaciones y la salida, por su firewall.
          - dst_address: "{{ lab_sede[2].red }}"
            gateway: "{{ lab_sede[1].transito.fw }}"
          - dst_address: "{{ lab_sede[3].red }}"
            gateway: "{{ lab_sede[1].transito.fw }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_mgmt_gateway }}"
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_sede[1].transito.fw }}"
        # El DHCP lo sirve AQUÍ, no en el firewall: es el router de la sede.
        dhcp_servers:
          - name: sede1
            interface: ether2
            address_pool: "{{ lab_sede[1].pool }}"
            network: "{{ lab_sede[1].red }}"
            gateway: "{{ lab_sede[1].puerta }}"
            dns_server: "{{ lab_internet_dns }}"
            # Una reserva por workstation DE ESTA SEDE. Dirección y MAC salen de
            # la declaración de la propia workstation: aquí no se repite ningún
            # valor, así que no pueden desincronizarse.
            leases: >-
              {%- set out = [] -%}
              {%- for c in pve_containers
                     | selectattr('site', 'defined')
                     | selectattr('site', 'equalto', 'sede1') -%}
              {%-   set _ = out.append({
                    'address': c.address,
                    'mac_address': (c.netif.net0.split(',') | select('match', '^hwaddr=') | first).split('=')[1],
                    'comment': c.hostname }) -%}
              {%- endfor -%}
              {{ out }}

  # rt-ia-core: el router de la delegación 2. Su LAN, su DHCP y una ruta por
  # defecto hacia su firewall: la configuración real de una delegación, que no
  # necesita saber qué hay al otro lado.
  - vmid: 7201
    name: rt-ia-core
    chr: true
    net:
      net0: "virtio=BC:24:31:00:22:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:31:00:22:02,bridge=vmbr62"   # ether2 -> sw-ia-acc-01 (LA LAN DE LA SEDE)
      net2: "virtio=BC:24:31:00:22:03,bridge=vmbr63"   # ether3 -> fw-ia-perim (transito)
    config:
      routeros:
        identity: rt-ia-core
        addresses:
          - address: "{{ lab_sede[2].mgmt.rt }}/24"
            interface: ether1
          - address: "{{ lab_sede[2].puerta }}/24"
            interface: ether2
          - address: "{{ lab_sede[2].transito.rt }}/30"
            interface: ether3
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_sede[2].transito.fw }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_mgmt_gateway }}"
        dhcp_servers:
          - name: sede2
            interface: ether2
            address_pool: "{{ lab_sede[2].pool }}"
            network: "{{ lab_sede[2].red }}"
            gateway: "{{ lab_sede[2].puerta }}"
            dns_server: "{{ lab_internet_dns }}"
            leases: >-
              {%- set out = [] -%}
              {%- for c in pve_containers
                     | selectattr('site', 'defined')
                     | selectattr('site', 'equalto', 'sede2') -%}
              {%-   set _ = out.append({
                    'address': c.address,
                    'mac_address': (c.netif.net0.split(',') | select('match', '^hwaddr=') | first).split('=')[1],
                    'comment': c.hostname }) -%}
              {%- endfor -%}
              {{ out }}

  # rt-ib-core: el router de la delegación 3, simétrico al anterior.
  - vmid: 8201
    name: rt-ib-core
    chr: true
    net:
      net0: "virtio=BC:24:31:00:23:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:31:00:23:02,bridge=vmbr66"   # ether2 -> sw-ib-acc-01 (LA LAN DE LA SEDE)
      net2: "virtio=BC:24:31:00:23:03,bridge=vmbr67"   # ether3 -> fw-ib-perim (transito)
    config:
      routeros:
        identity: rt-ib-core
        addresses:
          - address: "{{ lab_sede[3].mgmt.rt }}/24"
            interface: ether1
          - address: "{{ lab_sede[3].puerta }}/24"
            interface: ether2
          - address: "{{ lab_sede[3].transito.rt }}/30"
            interface: ether3
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_sede[3].transito.fw }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_mgmt_gateway }}"
        dhcp_servers:
          - name: sede3
            interface: ether2
            address_pool: "{{ lab_sede[3].pool }}"
            network: "{{ lab_sede[3].red }}"
            gateway: "{{ lab_sede[3].puerta }}"
            dns_server: "{{ lab_internet_dns }}"
            leases: >-
              {%- set out = [] -%}
              {%- for c in pve_containers
                     | selectattr('site', 'defined')
                     | selectattr('site', 'equalto', 'sede3') -%}
              {%-   set _ = out.append({
                    'address': c.address,
                    'mac_address': (c.netif.net0.split(',') | select('match', '^hwaddr=') | first).split('=')[1],
                    'comment': c.hostname }) -%}
              {%- endfor -%}
              {{ out }}

  # ==========================================================================
  # FIREWALLS (ST = 1S, y 91 el de borde) — filtran el PERÍMETRO. Están entre el
  # router de su sede y la WAN: no son la puerta de nadie ni dan DHCP, son el
  # filtro por el que sale (y entra) el tráfico de la sede.
  #
  # El NAT vive SÓLO en el de borde: dentro de la empresa las direcciones son las
  # reales, así que las rutas de vuelta existen y no hay traducciones anidadas.
  # ==========================================================================

  # fw-ed-perim: perímetro de la central. Por ether2 habla con su router; por
  # ether3 y ether4 con las WAN de las delegaciones, y por ether5 con el borde.
  - vmid: 6101
    name: fw-ed-perim
    chr: true
    net:
      net0: "virtio=BC:24:31:00:41:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:31:00:41:02,bridge=vmbr56"   # ether2 -> rt-ed-core (transito)
      net2: "virtio=BC:24:31:00:41:03,bridge=vmbr57"   # ether3 -> WAN 1 (a la sede 2)
      net3: "virtio=BC:24:31:00:41:04,bridge=vmbr58"   # ether4 -> WAN 2 (a la sede 3)
      net4: "virtio=BC:24:31:00:41:05,bridge=vmbr59"   # ether5 -> fw-ed-borde (borde)
    config:
      routeros:
        identity: fw-ed-perim
        addresses:
          - address: "{{ lab_sede[1].mgmt.fw }}/24"
            interface: ether1
          - address: "{{ lab_sede[1].transito.fw }}/30"
            interface: ether2
          - address: "{{ lab_sede[2].wan.hub }}/30"
            interface: ether3
          - address: "{{ lab_sede[3].wan.hub }}/30"
            interface: ether4
          - address: "{{ lab_edge_core }}/30"
            interface: ether5
        dhcp_client: false
        routes:
          # Su propia sede, detrás del router.
          - dst_address: "{{ lab_sede[1].red }}"
            gateway: "{{ lab_sede[1].transito.rt }}"
          # Las delegaciones, por sus WAN.
          - dst_address: "{{ lab_sede[2].red }}"
            gateway: "{{ lab_sede[2].wan.spoke }}"
          - dst_address: "{{ lab_sede[3].red }}"
            gateway: "{{ lab_sede[3].wan.spoke }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_mgmt_gateway }}"
          # Y lo que sale de la empresa, por el borde.
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_edge_fw }}"
        # Perímetro: lo establecido pasa, y el tráfico de su sede puede salir y
        # volver por cada una de sus bocas. Además, la central es el punto por el
        # que una delegación llega al borde (y a la otra delegación), así que sus
        # bocas EXTERIORES también pueden hablar entre sí: sin esas reglas el
        # tráfico de la sede 2 hacia internet entra por ether3 y muere en el
        # `drop` porque nadie le dio salida por ether5. Lo destapó la prueba de
        # conectividad, no la lectura del fichero.
        firewall:
          filter:
            - {chain: forward, action: accept, connection_state: "established,related"}
            - {chain: forward, action: accept, in_interface: ether2, out_interface: ether3}
            - {chain: forward, action: accept, in_interface: ether2, out_interface: ether4}
            - {chain: forward, action: accept, in_interface: ether2, out_interface: ether5}
            - {chain: forward, action: accept, in_interface: ether3, out_interface: ether2}
            - {chain: forward, action: accept, in_interface: ether4, out_interface: ether2}
            - {chain: forward, action: accept, in_interface: ether5, out_interface: ether2}
            - {chain: forward, action: accept, in_interface: ether3, out_interface: ether5}
            - {chain: forward, action: accept, in_interface: ether4, out_interface: ether5}
            - {chain: forward, action: accept, in_interface: ether3, out_interface: ether4}
            - {chain: forward, action: accept, in_interface: ether4, out_interface: ether3}
            # Y las VUELTAS desde el borde hacia cada delegación. No basta con
            # `established,related`: el paquete que pregunta al borde por su
            # dirección de gestión va DIRECTO por la LAN de gestión (el router de
            # la delegación la tiene conectada), así que este firewall nunca vio
            # esa conversación y no tiene estado que reconocer. La respuesta sí
            # vuelve por aquí —el borde sólo conoce las sedes por el tránsito— y
            # sin estas dos reglas muere en el `drop`. Lo destapó lab-check
            # ejecutado DESDE una delegación: 18/19, y el que faltaba era el borde.
            - {chain: forward, action: accept, in_interface: ether5, out_interface: ether3}
            - {chain: forward, action: accept, in_interface: ether5, out_interface: ether4}
            - {chain: forward, action: drop}
            - {chain: input, action: accept, in_interface: ether1}
            - {chain: input, action: accept, connection_state: "established,related"}
            - {chain: input, action: drop}

  # fw-ia-perim: perímetro de la delegación 2. Su WAN la conecta con la central.
  - vmid: 7101
    name: fw-ia-perim
    chr: true
    net:
      net0: "virtio=BC:24:31:00:42:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:31:00:42:02,bridge=vmbr63"   # ether2 -> rt-ia-core (transito)
      net2: "virtio=BC:24:31:00:42:03,bridge=vmbr57"   # ether3 -> WAN 1 (a la central)
    config:
      routeros:
        identity: fw-ia-perim
        addresses:
          - address: "{{ lab_sede[2].mgmt.fw }}/24"
            interface: ether1
          - address: "{{ lab_sede[2].transito.fw }}/30"
            interface: ether2
          - address: "{{ lab_sede[2].wan.spoke }}/30"
            interface: ether3
        dhcp_client: false
        routes:
          - dst_address: "{{ lab_sede[2].red }}"
            gateway: "{{ lab_sede[2].transito.rt }}"
          - dst_address: "{{ lab_sede[1].red }}"
            gateway: "{{ lab_sede[2].wan.hub }}"
          - dst_address: "{{ lab_sede[3].red }}"
            gateway: "{{ lab_sede[2].wan.hub }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_sede[2].wan.hub }}"
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_sede[2].wan.hub }}"
        firewall:
          filter:
            - {chain: forward, action: accept, connection_state: "established,related"}
            - {chain: forward, action: accept, in_interface: ether2, out_interface: ether3}
            - {chain: forward, action: accept, in_interface: ether3, out_interface: ether2}
            - {chain: forward, action: drop}
            - {chain: input, action: accept, in_interface: ether1}
            - {chain: input, action: accept, connection_state: "established,related"}
            - {chain: input, action: drop}

  # fw-ib-perim: perímetro de la delegación 3, simétrico por la WAN 2.
  - vmid: 8101
    name: fw-ib-perim
    chr: true
    net:
      net0: "virtio=BC:24:31:00:43:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:31:00:43:02,bridge=vmbr67"   # ether2 -> rt-ib-core (transito)
      net2: "virtio=BC:24:31:00:43:03,bridge=vmbr58"   # ether3 -> WAN 2 (a la central)
    config:
      routeros:
        identity: fw-ib-perim
        addresses:
          - address: "{{ lab_sede[3].mgmt.fw }}/24"
            interface: ether1
          - address: "{{ lab_sede[3].transito.fw }}/30"
            interface: ether2
          - address: "{{ lab_sede[3].wan.spoke }}/30"
            interface: ether3
        dhcp_client: false
        routes:
          - dst_address: "{{ lab_sede[3].red }}"
            gateway: "{{ lab_sede[3].transito.rt }}"
          - dst_address: "{{ lab_sede[1].red }}"
            gateway: "{{ lab_sede[3].wan.hub }}"
          - dst_address: "{{ lab_sede[2].red }}"
            gateway: "{{ lab_sede[3].wan.hub }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_sede[3].wan.hub }}"
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_sede[3].wan.hub }}"
        firewall:
          filter:
            - {chain: forward, action: accept, connection_state: "established,related"}
            - {chain: forward, action: accept, in_interface: ether2, out_interface: ether3}
            - {chain: forward, action: accept, in_interface: ether3, out_interface: ether2}
            - {chain: forward, action: drop}
            - {chain: input, action: accept, in_interface: ether1}
            - {chain: input, action: accept, connection_state: "established,related"}
            - {chain: input, action: drop}

  # fw-ed-borde: el firewall de BORDE, y el ÚNICO que traduce direcciones. Su
  # pata exterior (ether1) es la red de gestión, donde vive el proveedor real (el
  # host Proxmox): NO hay un segmento "ISP" inventado.
  - vmid: 9401
    name: fw-ed-borde
    chr: true
    net:
      net0: "virtio=BC:24:31:00:49:01,bridge=vmbr1"    # ether1 -> "proveedor" (red de gestion)
      net1: "virtio=BC:24:31:00:49:02,bridge=vmbr59"   # ether2 -> fw-ed-perim (transito de borde)
    config:
      routeros:
        identity: fw-ed-borde
        addresses:
          - address: "{{ lab_mgmt_otros.borde }}/24"
            interface: ether1
          - address: "{{ lab_edge_fw }}/30"
            interface: ether2
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_internet_gateway }}"
          - dst_address: "{{ lab_sede[1].red }}"
            gateway: "{{ lab_edge_core }}"
          - dst_address: "{{ lab_sede[2].red }}"
            gateway: "{{ lab_edge_core }}"
          - dst_address: "{{ lab_sede[3].red }}"
            gateway: "{{ lab_edge_core }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_internet_gateway }}"
        firewall:
          filter:
            - {chain: forward, action: accept, connection_state: "established,related"}
            # La red de gestion (OOB) NO es del dominio de produccion: en un
            # montaje fisico es una isla. Aqui se corta en el borde el intento de
            # una estacion de alcanzarla. Es de ida: una workstation no debe
            # llegar; el operador la alcanza por su propio camino (el tunel).
            - {chain: forward, action: drop, dst_address: "{{ lab_mgmt2.red }}",
               comment: "OOB: la produccion no alcanza el segundo segmento de gestion"}
            - {chain: forward, action: accept, in_interface: ether2, out_interface: ether1}
            - {chain: forward, action: drop, connection_state: "new"}
            - {chain: input, action: accept, in_interface: ether1}
            - {chain: input, action: accept, connection_state: "established,related"}
            - {chain: input, action: drop}
          nat:
            - {chain: srcnat, action: masquerade, out_interface: ether1}

# ============================================================================
# NOTA: no hay lista de "invitados parcialmente adoptados".
#
# La v1 traía una lista de invitados "parcialmente adoptados" (los que
# configuraba sin gestionarles la forma). Aquí no existe: todo invitado que se
# configura se declara también, y el que no se declara no aparece en ninguna
# lista ni se lee nunca. Si algún día hay que configurar uno preexistente desde
# capa 2, se declara aquí y se explica por qué.
# ============================================================================

# ============================================================================
# TIEMPOS DE ENERGÍA (verbos apply/preflight)
# ============================================================================
# Cuánto se espera, como máximo, a que un escalón entero acabe en marcha. El
# lote se pide de golpe y se relanza lo que quede parado.
pve_power_start_timeout: 240

# Margen de cortesía entre un escalón y el siguiente (clave = `order` del que
# acaba de arrancar). Sólo lo usa lo que no tiene una señal propia que consultar:
# los equipos de red esperan a que su API conteste de verdad.
pve_power_gap_after:
  1: 10

# Cuánto se espera a que un escalón de RouterOS levante de verdad y conteste su
# API: un CHR tarda decenas de segundos en levantar RouterOS.
pve_power_ready_timeout: 180

# ============================================================================
# RETENCIÓN DE logs/ — el único directorio del repositorio que crece solo.
# ============================================================================
pve_log_retention:
  live_max_mb: 8
  keep_days: 14
  keep_count: 10
