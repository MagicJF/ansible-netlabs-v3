  # El NAT vive SÓLO en el de borde: dentro de la empresa las direcciones son las
  # reales, así que las rutas de vuelta existen y no hay traducciones anidadas.
  # ==========================================================================

  # 3-Ca-fwpe-10: perímetro de la central. Por ether2 habla con su router; por
  # ether3 y ether4 con las WAN de las delegaciones, y por ether5 con el borde.
  - vmid: 3118110
    name: 3-Ca-fwpe-10
    chr: true
    net:
      net0: "virtio=BC:24:12:00:41:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:12:00:41:02,bridge=vmbr56"   # ether2 -> 3-Ca-rtco-10 (transito)
      net2: "virtio=BC:24:12:00:41:03,bridge=vmbr57"   # ether3 -> WAN 1 (a la sede 2)
      net3: "virtio=BC:24:12:00:41:04,bridge=vmbr58"   # ether4 -> WAN 2 (a la sede 3)
      net4: "virtio=BC:24:12:00:41:05,bridge=vmbr59"   # ether5 -> 3-Ba-fwbo-10 (borde)
    config:
      routeros:
        identity: 3-Ca-fwpe-10
        addresses:
          - address: "{{ lab_sede[6].mgmt.fw }}/24"
            interface: ether1
          - address: "{{ lab_sede[6].transito.fw }}/30"
            interface: ether2
          - address: "{{ lab_sede[7].wan.hub }}/30"
            interface: ether3
          - address: "{{ lab_sede[8].wan.hub }}/30"
            interface: ether4
          - address: "{{ lab_edge_core }}/30"
            interface: ether5
        dhcp_client: false
        routes:
          # Su propia sede, detrás del router.
          - dst_address: "{{ lab_sede[6].red }}"
            gateway: "{{ lab_sede[6].transito.rt }}"
          # Las delegaciones, por sus WAN.
          - dst_address: "{{ lab_sede[7].red }}"
            gateway: "{{ lab_sede[7].wan.spoke }}"
          - dst_address: "{{ lab_sede[8].red }}"
            gateway: "{{ lab_sede[8].wan.spoke }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_mgmt_gateway }}"
          # Y lo que sale de la empresa, por el borde.
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_edge_fw }}"
        # Perímetro: lo establecido pasa, y el tráfico de su sede puede salir y
        # volver por cada una de sus bocas. Además, la central es el punto por el
        # que una delegación llega al borde (y a la otra delegación), así que sus
        # bocas EXTERIORES también pueden hablar entre sí: sin esas reglas el
        # tráfico de la sede 2 hacia internet entra por ether3 y muere en el
        # `drop` porque nadie le dio salida por ether5. Lo destapó la prueba de
        # conectividad, no la lectura del fichero.
        firewall:
          filter:
            - {chain: forward, action: accept, connection_state: "established,related"}
            - {chain: forward, action: accept, in_interface: ether2, out_interface: ether3}
            - {chain: forward, action: accept, in_interface: ether2, out_interface: ether4}
            - {chain: forward, action: accept, in_interface: ether2, out_interface: ether5}
            - {chain: forward, action: accept, in_interface: ether3, out_interface: ether2}
            - {chain: forward, action: accept, in_interface: ether4, out_interface: ether2}
            - {chain: forward, action: accept, in_interface: ether5, out_interface: ether2}
            - {chain: forward, action: accept, in_interface: ether3, out_interface: ether5}
            - {chain: forward, action: accept, in_interface: ether4, out_interface: ether5}
            # AISLAMIENTO (lab_policy): los dos inquilinos comparten el edificio y la
            # salida, pero NO se ven. El edificio es el punto de cruce: aquí se corta lo
            # que va de un inquilino al otro. El caso de uso completo vive en el bloque
            # `lab_policy` de la declaración, y el test lo comprueba AL REVÉS (el destino
            # no debe contestar), no como una simple ruta que falta.
            - {chain: forward, action: drop, src_address: "{{ lab_sede[7].red }}", dst_address: "{{ lab_sede[8].red }}", comment: "AISLAMIENTO: inquilino A no alcanza al inquilino B"}
            - {chain: forward, action: drop, src_address: "{{ lab_sede[8].red }}", dst_address: "{{ lab_sede[7].red }}", comment: "AISLAMIENTO: inquilino B no alcanza al inquilino A"}
            # Y las VUELTAS desde el borde hacia cada delegación. No basta con
            # `established,related`: el paquete que pregunta al borde por su
            # dirección de gestión va DIRECTO por la LAN de gestión (el router de
            # la delegación la tiene conectada), así que este firewall nunca vio
            # esa conversación y no tiene estado que reconocer. La respuesta sí
            # vuelve por aquí —el borde sólo conoce las sedes por el tránsito— y
            # sin estas dos reglas muere en el `drop`. Lo destapó lab-check
            # ejecutado DESDE una delegación: 18/19, y el que faltaba era el borde.
            - {chain: forward, action: accept, in_interface: ether5, out_interface: ether3}
            - {chain: forward, action: accept, in_interface: ether5, out_interface: ether4}
            - {chain: forward, action: drop}
            - {chain: input, action: accept, in_interface: ether1}
            - {chain: input, action: accept, connection_state: "established,related"}
            - {chain: input, action: drop}

  # 3-Sa-fwpe-10: perímetro de la delegación 2. Su WAN la conecta con la central.
  - vmid: 3218110
    name: 3-Sa-fwpe-10
    chr: true
    net:
      net0: "virtio=BC:24:12:00:42:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:12:00:42:02,bridge=vmbr63"   # ether2 -> 3-Sa-rtco-10 (transito)
      net2: "virtio=BC:24:12:00:42:03,bridge=vmbr57"   # ether3 -> WAN 1 (a la central)
    config:
      routeros:
        identity: 3-Sa-fwpe-10
        addresses:
          - address: "{{ lab_sede[7].mgmt.fw }}/24"
            interface: ether1
          - address: "{{ lab_sede[7].transito.fw }}/30"
            interface: ether2
          - address: "{{ lab_sede[7].wan.spoke }}/30"
            interface: ether3
        dhcp_client: false
        routes:
          - dst_address: "{{ lab_sede[7].red }}"
            gateway: "{{ lab_sede[7].transito.rt }}"
          - dst_address: "{{ lab_sede[6].red }}"
            gateway: "{{ lab_sede[7].wan.hub }}"
          - dst_address: "{{ lab_sede[8].red }}"
            gateway: "{{ lab_sede[7].wan.hub }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_sede[7].wan.hub }}"
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_sede[7].wan.hub }}"
        firewall:
          filter:
            - {chain: forward, action: accept, connection_state: "established,related"}
            - {chain: forward, action: accept, in_interface: ether2, out_interface: ether3}
            - {chain: forward, action: accept, in_interface: ether3, out_interface: ether2}
            - {chain: forward, action: drop}
            - {chain: input, action: accept, in_interface: ether1}
            - {chain: input, action: accept, connection_state: "established,related"}
            - {chain: input, action: drop}

  # 3-Sb-fwpe-10: perímetro de la delegación 3, simétrico por la WAN 2.
  - vmid: 3228110
    name: 3-Sb-fwpe-10
    chr: true
    net:
      net0: "virtio=BC:24:12:00:43:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:12:00:43:02,bridge=vmbr67"   # ether2 -> 3-Sb-rtco-10 (transito)
      net2: "virtio=BC:24:12:00:43:03,bridge=vmbr58"   # ether3 -> WAN 2 (a la central)
    config:
      routeros:
        identity: 3-Sb-fwpe-10
        addresses:
          - address: "{{ lab_sede[8].mgmt.fw }}/24"
            interface: ether1
          - address: "{{ lab_sede[8].transito.fw }}/30"
            interface: ether2
          - address: "{{ lab_sede[8].wan.spoke }}/30"
            interface: ether3
        dhcp_client: false
        routes:
          - dst_address: "{{ lab_sede[8].red }}"
            gateway: "{{ lab_sede[8].transito.rt }}"
          - dst_address: "{{ lab_sede[6].red }}"
            gateway: "{{ lab_sede[8].wan.hub }}"
          - dst_address: "{{ lab_sede[7].red }}"
            gateway: "{{ lab_sede[8].wan.hub }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_sede[8].wan.hub }}"
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_sede[8].wan.hub }}"
        firewall:
          filter:
            - {chain: forward, action: accept, connection_state: "established,related"}
            - {chain: forward, action: accept, in_interface: ether2, out_interface: ether3}
            - {chain: forward, action: accept, in_interface: ether3, out_interface: ether2}
            - {chain: forward, action: drop}
            - {chain: input, action: accept, in_interface: ether1}
            - {chain: input, action: accept, connection_state: "established,related"}
            - {chain: input, action: drop}

  # 3-Ba-fwbo-10: el firewall de BORDE, y el ÚNICO que traduce direcciones. Su
  # pata exterior (ether1) es la red de gestión, donde vive el proveedor real (el
  # host Proxmox): NO hay un segmento "ISP" inventado.
  - vmid: 3518210
    name: 3-Ba-fwbo-10
    chr: true
    net:
      net0: "virtio=BC:24:12:00:49:01,bridge=vmbr1"    # ether1 -> "proveedor" (red de gestion)
      net1: "virtio=BC:24:12:00:49:02,bridge=vmbr59"   # ether2 -> 3-Ca-fwpe-10 (transito de borde)
    config:
      routeros:
        identity: 3-Ba-fwbo-10
        addresses:
          - address: "{{ lab_mgmt_otros.borde }}/24"
            interface: ether1
          - address: "{{ lab_edge_fw }}/30"
            interface: ether2
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_internet_gateway }}"
          - dst_address: "{{ lab_sede[6].red }}"
            gateway: "{{ lab_edge_core }}"
          - dst_address: "{{ lab_sede[7].red }}"
            gateway: "{{ lab_edge_core }}"
          - dst_address: "{{ lab_sede[8].red }}"
            gateway: "{{ lab_edge_core }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_internet_gateway }}"
        firewall:
          filter:
            - {chain: forward, action: accept, connection_state: "established,related"}
            # La red de gestion (OOB) NO es del dominio de produccion: en un
            # montaje fisico es una isla. Aqui se corta en el borde el intento de
            # una estacion de alcanzarla. Es de ida: una workstation no debe
            # llegar; el operador la alcanza por su propio camino (el tunel).
            - {chain: forward, action: drop, dst_address: "{{ lab_mgmt2.red }}",
               comment: "OOB: la produccion no alcanza el segundo segmento de gestion"}
            - {chain: forward, action: accept, in_interface: ether2, out_interface: ether1}
            - {chain: forward, action: drop, connection_state: "new"}
            - {chain: input, action: accept, in_interface: ether1}
            - {chain: input, action: accept, connection_state: "established,related"}
            - {chain: input, action: drop}
          nat:
            - {chain: srcnat, action: masquerade, out_interface: ether1}

# ============================================================================
# NOTA: no hay lista de "invitados parcialmente adoptados".
#
# La v1 traía una lista de invitados "parcialmente adoptados" (los que
# configuraba sin gestionarles la forma). Aquí no existe: todo invitado que se
# configura se declara también, y el que no se declara no aparece en ninguna
# lista ni se lee nunca. Si algún día hay que configurar uno preexistente desde
# capa 2, se declara aquí y se explica por qué.
# ============================================================================

# ============================================================================
# TIEMPOS DE ENERGÍA (verbos apply/preflight)
# ============================================================================
# Cuánto se espera, como máximo, a que un escalón entero acabe en marcha. El
# lote se pide de golpe y se relanza lo que quede parado.
pve_power_start_timeout: 240

# Margen de cortesía entre un escalón y el siguiente (clave = `order` del que
# acaba de arrancar). Sólo lo usa lo que no tiene una señal propia que consultar:
# los equipos de red esperan a que su API conteste de verdad.
pve_power_gap_after:
  1: 10

# Cuánto se espera a que un escalón de RouterOS levante de verdad y conteste su
# API: un CHR tarda decenas de segundos en levantar RouterOS.
pve_power_ready_timeout: 180

# ============================================================================
# RETENCIÓN DE logs/ — el único directorio del repositorio que crece solo.
# ============================================================================
pve_log_retention:
  live_max_mb: 8
  keep_days: 14
  keep_count: 10
