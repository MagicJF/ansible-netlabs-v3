---
# ===========================================================================
# UN SEGUNDO LABORATORIO: una sola sede, tres equipos y un cable. Lo mínimo que
# el marco necesita para tener algo que converger.
#
# Para qué está: para probar lo que el marco promete de sí mismo — que el motor no
# conoce ninguna topología, que dos laboratorios CONVIVEN en el mismo nodo sin
# pisarse direcciones, MACs, vmids ni bridges, y que se opera uno u otro sin tocar
# el enlace `labs/active`:
#
#     bin/lab --lab mini apply
#     bin/lab --lab mini site
#
# Se creó copiando netlab-v2 con `framework_check.py nuevo-lab mini` y REDUCIÉNDOLO:
# la forma de cada pieza (un contenedor, un router CHR, un bridge con su cable) es
# la misma que la del laboratorio grande, así que lo que aquí se prueba es el motor,
# no una variante suya.
#
# Convivencia: la red de gestión es la del NODO y no se toca — cada laboratorio se
# cuelga de ella con direcciones propias. Aquí: 10.10.10.63 (bootstrap) y
# 10.10.10.61 (router), frente a .41 y .21 del otro. La LAN de la sede es 10.31.0.0/24
# (el otro usa 10.11/10.12/10.13), el bridge vmbr31 (el otro, vmbr4…vmbr22) y las MACs
# llevan el prefijo BC:24:21 (el otro, BC:24:11).
# ===========================================================================
pve_node: Proxmox
lab_mgmt_network: 10.10.10.0/24
lab_mgmt_gateway: 10.10.10.1
lab_mgmt_bridge: vmbr1
lab_mgmt_otros:
  infra: 10.10.10.63
lab_numero: 11          # LL del número (ADR 0005)
lab_nombre: "una sola sede"
lab_hub: 1

# ---------------------------------------------------------------------------
# FAMILIAS DE SEDE — la primera letra del código. El número que va al vmid es la
# POSICIÓN de la familia (1..5) y la segunda letra (minúscula) es el índice
# dentro de ella. Ver docs/decisiones/0007-codigo-de-sede.md.
# ---------------------------------------------------------------------------
lab_familias:
  - { letra: "C", nombre: "central" }          # 1x
  - { letra: "S", nombre: "sedes" }            # 2x
  - { letra: "I", nombre: "infraestructura" }  # 3x
  - { letra: "G", nombre: "gestión" }          # 4x
  - { letra: "B", nombre: "borde" }            # 5x
lab_sites:
- id: 1
  nombre: unica
  codigo: Ca          # familia C (central) + a
  etiqueta: la única sede de este laboratorio
  red: 10.31.0.0/24
  puerta: 10.31.0.1
  pool: 10.31.0.100-10.31.0.199
  mgmt:
    sw: []
    rt: 10.10.10.61
lab_clases:
  11: { token: "swac", etiqueta: "switch de acceso" }
  12: { token: "swge", etiqueta: "switch de gestión" }
  13: { token: "swco", etiqueta: "switch de núcleo" }
  20: { token: "rt",   etiqueta: "router genérico" }
  21: { token: "rtco", etiqueta: "router de núcleo" }
  22: { token: "rtbo", etiqueta: "router de borde" }
  71: { token: "boot", etiqueta: "bootstrap" }
  80: { token: "fw",   etiqueta: "firewall genérico" }
  81: { token: "fwpe", etiqueta: "firewall perimetral" }
  82: { token: "fwbo", etiqueta: "firewall de borde" }
  90: { token: "pc",   etiqueta: "puesto genérico" }
  91: { token: "pcws", etiqueta: "estación de trabajo" }
lab_sedes_extra:
  Ia: "infra"
  Ga: "gestión"
  Ba: "borde"
lab_sede: '{{ dict(lab_sites | map(attribute=''id'') | zip(lab_sites)) }}'
lab_control_network: 10.99.99.0/24
lab_control_via: 10.10.10.1
pve_tunnel:
  manage: false
  name: wg-lab
  address: 10.99.99.2/24
lab_internet_gateway: 10.10.10.1
lab_internet_dns: 1.1.1.1
pve_public_bridge: vmbr0
lab_edge_network: 10.29.0.0/30
lab_edge_core: 10.29.0.1
lab_edge_fw: 10.29.0.2
pve_tag_style:
  shape: full
  colors: ansible:b71c1c:ffffff;switch:1565c0:ffffff;router:2e7d32:ffffff;firewall:ef6c00:ffffff;workstation:455a64:ffffff;bootstrap:6a1b9a:ffffff;ca:00838f:ffffff;ia:5e35b1:ffffff;ga:8e24aa:ffffff;ba:37474f:ffffff;lab-11:827717:ffffff
pve_bridges:
- iface: vmbr31
  comments: 'cable: 11-Ca-rtco-10 ether2 <-> 11-Ca-pcws-10 eth0'
pve_defaults:
  template: local:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst
  template_storage: local
  storage: local-zfs
  rootfs_size: 8
  unprivileged: true
  ostype: debian
  status: started
  memory: 2048
  swap: 512
  cores: 2
  cpuunits: 1024
  onboot: false
  description: Managed by ansible-netlabs-v3. Declare changes in labs/netlab-v2/inventory/group_vars/all.yml.
  tags:
  - netlab
  - ansible
  timezone: host
  cmode: shell
  features: []
  startup: []
  netif: {}
  nameserver: null
  searchdomain: null
  hookscript: null
  mounts: {}
  mount_devices: []
  pubkey: '{{ lookup(''file'', pve_ssh_key_path ~ ''.pub'', errors=''ignore'') | default('''', true) |
    trim }}'
pve_containers:
- vmid: 11317110
  hostname: 11-Ia-boot-10
  cores: 1
  memory: 1024
  rootfs_size: 4
  swap: 256
  onboot: true
  startup:
  - order=1
  netif:
    net0: name=eth0,bridge=vmbr1,gw=10.10.10.1,ip={{ lab_mgmt_otros.infra }}/24
  manage: true
  config:
    bootstrap:
      interface: eth0
      segments:
      - interface: eth0
        bridge: vmbr1
        red: '{{ lab_mgmt_network }}'
        gateway: '{{ lab_mgmt_gateway }}'
        pool: '{{ lab_mgmt_otros.infra }}'
      routes:
      - '{{ lab_sede[1].red }}'
      route_gateway: '{{ lab_sede[1].mgmt.rt }}'
      hosts: "{%- set out = [] -%} {%- for v in pve_vms | selectattr('chr', 'defined') -%} {%-   set mac\
        \ = (v.net.net0.split(',') | select('match', '^virtio=') | first).split('=')[1] -%} {%-   set\
        \ mgmt = v.config.routeros.addresses\n                | selectattr('interface', 'equalto', 'ether1')\
        \ | first -%}\n{%-   set _ = out.append({'mac': mac,\n                          'address': mgmt.address.split('/')[0],\n\
        \                          'name': v.name}) -%}\n{%- endfor -%} {{ out }}"
- vmid: 11119110
  hostname: 11-Ca-pcws-10
  site: sede1
  address: 10.31.0.11
  cores: 1
  memory: 256
  rootfs_size: 4
  swap: 256
  onboot: true
  startup:
  - order=3
  manage: true
  config:
    netlab:
      dhcp:
        timeout: 300
        retry: 30
  netif:
    net0: name=eth0,bridge=vmbr31,hwaddr=BC:24:11:00:61:01,ip=dhcp
pve_vm_defaults:
  bios: seabios
  machine: q35
  scsihw: virtio-scsi-single
  ostype: l26
  status: stopped
  sockets: 1
  cpu: host
  vga: std
  onboot: false
  boot: order=ide2;scsi0
  description: Nested Proxmox VE managed by ansible-netlabs-v3.
  tags:
  - netlab
  - ansible
  net: {}
  scsi: {}
  sata: {}
  ide: {}
  virtio: {}
  cloudinit: true
  cloudinit_storage: local-zfs
  ciuser: root
  sshkeys: '{{ pve_defaults.pubkey }}'
pve_chr_defaults:
  onboot: true
  startup:
  - order=2
  cores: 1
  memory: 256
  status: started
  manage: true
  cloudinit: false
  machine: pc
  boot: order=scsi0
  scsi:
    scsi0: local-zfs:1
  disk_import:
  - key: scsi0
    source: local:import/chr-7.25.1.raw
  serial:
    serial0: socket
  vga: serial0
  description: 'MikroTik RouterOS: una funcion de red, un equipo. Gestionado por REST.'
  tags:
  - netlab
  - routeros
  - red
  - ansible
pve_vms:
- name: 11-Ca-rtco-10
  vmid: 11112110
  chr: true
  net:
    net0: virtio=BC:24:11:00:51:01,bridge=vmbr1
    net1: virtio=BC:24:11:00:51:02,bridge=vmbr31
  config:
    routeros:
      identity: 11-Ca-rtco-10
      dhcp_client: false
      addresses:
      - address: '{{ lab_sede[1].mgmt.rt }}/24'
        interface: ether1
      - address: '{{ lab_sede[1].puerta }}/24'
        interface: ether2
      routes:
      - dst_address: '{{ lab_control_network }}'
        gateway: '{{ lab_mgmt_gateway }}'
      - dst_address: 0.0.0.0/0
        gateway: '{{ lab_mgmt_gateway }}'
      dhcp_servers:
      - name: sede1
        interface: ether2
        address_pool: '{{ lab_sede[1].pool }}'
        network: '{{ lab_sede[1].red }}'
        gateway: '{{ lab_sede[1].puerta }}'
        dns_server: '{{ lab_internet_dns }}'
        leases: '{%- set out = [] -%}{%- for c in pve_containers       | selectattr(''site'', ''defined'')       |
          selectattr(''site'', ''equalto'', ''sede1'') -%}{%-   set _ = out.append({      ''address'':
          c.address,      ''mac_address'': (c.netif.net0.split('','') | select(''match'', ''^hwaddr='')
          | first).split(''='')[1],      ''comment'': c.hostname }) -%}{%- endfor -%} {{ out }}'
pve_power_start_timeout: 240
pve_power_gap_after:
  1: 10
pve_power_ready_timeout: 180
pve_log_retention:
  live_max_mb: 8
  keep_days: 14
  keep_count: 10
