       <tr><td>net1</td><td>ether2</td><td><code>vmbr6</code></td><td><code>BC:24:11:00:32:02</code></td><td>pc-s1-03 eth0</td></tr>
       <tr><td>net2</td><td>ether3</td><td><code>vmbr7</code></td><td><code>BC:24:11:00:32:03</code></td><td>pc-s1-04 eth0</td></tr>
       <tr><td>net3</td><td>ether4</td><td><code>vmbr8</code></td><td><code>BC:24:11:00:32:04</code></td><td>sw-s1-acc-01 ether4</td></tr>
