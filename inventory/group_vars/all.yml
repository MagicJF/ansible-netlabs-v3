      <li><b>Una sola NIC y ninguna de gestión.</b> Así se hace en una empresa: el PC tiene un cable, y la administración de parque es un agente que <i>sale</i> hacia fuera. Por eso este invitado no aparece en el diario de la API como destino.</li>
      <li><b>Su dirección vive en la declaración, no en el equipo.</b> El <code>address:</code> de su ficha <i>es</i> la reserva que el router deriva: no hay dos sitios donde se puedan desincronizar.</li>
      </ul>
    netif:
      net0: "name=eth0,bridge=vmbr19,hwaddr=BC:24:11:00:53:02,ip=dhcp"

# ============================================================================
# QEMU VMs — mismas reglas declarativas que los contenedores, con una
# diferencia: proxmox_kvm se niega a actualizar net/scsi/ide/sata/virtio (y
# bios/machine/scsihw/ostype), así que para una VM son creation-time: la deriva
# en ellos se RECHAZA, no se converge. Y por eso cambiar de qué bridge cuelga
# una pata obliga a recrear la máquina.
# ============================================================================
pve_vm_defaults:
  bios: seabios
  machine: q35
  scsihw: virtio-scsi-single
  ostype: l26

  status: stopped

  sockets: 1
  cpu: host
  vga: std
  onboot: false
  boot: "order=ide2;scsi0"
  description: "Nested Proxmox VE managed by ansible-netlab-v2."
  tags: [netlab, ansible-managed]

  net: {}
  scsi: {}
  sata: {}
  ide: {}
  virtio: {}

  cloudinit: true
  cloudinit_storage: local-zfs
  ciuser: root
  sshkeys: "{{ pve_defaults.pubkey }}"

# ---------------------------------------------------------------------------
# CHR (MikroTik RouterOS) — valores por defecto de TODO equipo de red.
#
# Aquí viven el sabor, el orden de arranque y la forma común, porque los equipos
# de red son once y repetir eso en cada uno es pedir que se desincronicen. Cada
# equipo AÑADE sus propias etiquetas (sede y papel) sin repetir estas.
#
# Los equipos de red van ANTES que las workstations: la petición DHCP de una
# workstation la contesta el router de su sede, así que arrancarlos juntos es
# una carrera que la workstation pierde.
# ---------------------------------------------------------------------------
pve_chr_defaults:
  onboot: true
  startup: ["order=2"]
  # 1 core y 256 MiB por equipo de red: un CHR que conmuta, enruta o filtra
  # (que es todo lo que hace) no necesita más, y ahora son once.
  cores: 1
  memory: 256
  # En marcha: aplicar la declaración ES levantar el laboratorio.
  status: started
  manage: true
  # La imagen del fabricante no tiene cloud-init, así que esa unidad sería peso
  # muerto.
  cloudinit: false
  # CHR es una imagen de la era i440fx: arranca en el chipset PC, no en q35.
  machine: pc
  # La imagen importada es el ÚNICO disco, así que es el dispositivo de arranque
  # (el orden por defecto espera la unidad cloud-init que esta VM no tiene).
  boot: "order=scsi0"
  scsi:
    # 1 GiB y no 8: la imagen del fabricante ocupa 128 MiB y RouterOS CHR vive en
    # RAM, así que un disco grande aquí es espacio asignado que nadie usa.
    scsi0: "local-zfs:1"
  # La imagen del fabricante se IMPORTA en vez de crearse: proxmox_kvm sólo sabe
  # construir un disco a partir de un tamaño, así que la imagen raw está subida a
  # un storage que acepta `import` y se adjunta con la sintaxis import-from de la
  # API en el momento de crear la VM (ver playbooks/tasks/disk_import.yml).
  disk_import:
    - key: scsi0
      source: "local:import/chr-7.25.1.raw"
  # La consola que respeta un teclado que no es US: lleva CARACTERES, no
  # scancodes. `vga: serial0` es lo que hace que el botón Console de PVE abra
  # esta consola en vez de un noVNC que no tiene nada que mostrar.
  serial:
    serial0: socket
  vga: serial0
  description: "MikroTik RouterOS: una funcion de red, un equipo. Gestionado por REST."
  tags: [netlab, routeros, red, ansible-managed]

pve_vms:
  # ==========================================================================
  # SWITCHES (ST = 3S) — conmutan. No enrutan, no filtran y NO dan DHCP.
  #
  # Un switch de acceso: los puertos de los PCs a un lado, el puerto hacia su
  # router al otro. Su única dirección es la de gestión.
  # ==========================================================================

  # sw-s1-acc-01: primer switch de acceso de la central. Une pc-s1-01 y pc-s1-02
  # y entrega la sede a su router. El troncal hacia el segundo switch va por
  # ether4.
  - vmid: 1301
    name: sw-s1-acc-01
    chr: true
    tags: [ansible-managed, switch, central]
    description: |
      <b>sw-s1-acc-01</b> — switch de acceso de la central (sede 1). Conmuta y nada más: <b>no enruta, no filtra y no da DHCP</b>.
      
      <b>IDENTIDAD</b>
      <table>
       <tr><td>vmid</td><td>1301</td></tr>
       <tr><td>Tipo</td><td>Máquina virtual (RouterOS CHR)</td></tr>
       <tr><td>Dónde</td><td>la central (sede 1)</td></tr>
       <tr><td>Rol</td><td>switch</td></tr>
       <tr><td>Tags</td><td><code>ansible-managed</code> <code>switch</code> <code>central</code></td></tr>
      </table>
      
      <b>CONEXIONES</b>
      <table>
       <tr><th>Pata</th><th>Interfaz</th><th>Cable (bridge)</th><th>MAC</th><th>Al otro extremo</th></tr>
       <tr><td>net0</td><td>ether1</td><td><code>vmbr1</code></td><td><code>BC:24:11:00:31:01</code></td><td>segmento compartido (12 patas)</td></tr>
       <tr><td>net1</td><td>ether2</td><td><code>vmbr4</code></td><td><code>BC:24:11:00:31:02</code></td><td>pc-s1-01 eth0</td></tr>
       <tr><td>net2</td><td>ether3</td><td><code>vmbr5</code></td><td><code>BC:24:11:00:31:03</code></td><td>pc-s1-02 eth0</td></tr>
       <tr><td>net3</td><td>ether4</td><td><code>vmbr8</code></td><td><code>BC:24:11:00:31:04</code></td><td>sw-s1-acc-02 ether4</td></tr>
       <tr><td>net4</td><td>ether5</td><td><code>vmbr9</code></td><td><code>BC:24:11:00:31:05</code></td><td>rt-s1-core ether2</td></tr>
      </table>
      
      Cada cable es un <b>bridge de Proxmox sin puerto físico</b>: un segmento de capa 2. Este invitado tiene una pata en un <b>segmento compartido</b> (<code>vmbr1</code>), donde no hay un "otro extremo" único: ahí cuelgan las patas de administración de todos los equipos de red. Sus demás cables son punto a punto, con exactamente dos patas. Nada en el invitado sabe quién está al otro lado: lo aprende, igual que el hardware real.
      
      <b>CONFIGURACIÓN DECLARADA (RouterOS)</b>
      <table>
       <tr><th>Interfaz</th><th>Dirección de gestión</th></tr>
       <tr><td>ether1</td><td>10.10.10.11/24</td></tr>
      </table>
      
      Puente <code>lan</code> con las bocas ether2, ether3, ether4, ether5. <b>Sin dirección</b>: eso es lo que lo hace un switch y no un router.
      
      <b>Rutas</b>
      <table>
       <tr><th>Destino</th><th>Por dónde</th></tr>
       <tr><td>0.0.0.0/0</td><td>vía 10.10.10.21</td></tr>
      </table>
      
      <b>DÓNDE ESTÁ</b>
      <pre>pc-s1-01  ──▶  <b>sw-s1-acc-01</b> «ESTE»  ──▶  rt-s1-core  ──▶  fw-s1-perim  ──▶  fw-wan-edge  ──▶  internet</pre>
      El camino está <b>medido</b> con traceroute desde una estación, no dibujado: es el que sigue un paquete de verdad.
      
      <b>POR QUÉ ASÍ</b>
      <ul>
      <li><b>Sin dirección en el puente.</b> Un switch con dirección en el puente empieza a enrutar, y la topología deja de ser la del diagrama <i>sin que nada falle</i>. Su dirección vive sólo en su pata de gestión.</li>
      <li><b>Pero esa pata SÍ lleva puerta de enlace</b>, apuntando al router de su sede. Sin ella el switch recibe los pings y no puede contestarlos.</li>
      </ul>
    net:
      net0: "virtio=BC:24:11:00:31:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:11:00:31:02,bridge=vmbr4"    # ether2 -> pc-s1-01
      net2: "virtio=BC:24:11:00:31:03,bridge=vmbr5"    # ether3 -> pc-s1-02
      net3: "virtio=BC:24:11:00:31:04,bridge=vmbr8"    # ether4 -> sw-s1-acc-02 (troncal)
      net4: "virtio=BC:24:11:00:31:05,bridge=vmbr9"    # ether5 -> rt-s1-core (la LAN de la sede)
    config:
      routeros:
        identity: sw-s1-acc-01
        addresses:
          - address: "10.10.10.11/24"
            interface: ether1
        bridges:
          - name: lan
            ports: [ether2, ether3, ether4, ether5]
        dhcp_client: false
        # La puerta de enlace de gestión apunta al router de su sede, que es el
        # que conecta con el resto. Es lo que convierte al switch en un equipo
        # gestionable de verdad.
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "10.10.10.21"

