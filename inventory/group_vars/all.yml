  # fw-wan-edge: el firewall de BORDE, y el ÚNICO que traduce direcciones. Su
  # pata exterior (ether1) es la red de gestión, donde vive el proveedor real (el
  # host Proxmox): NO hay un segmento "ISP" inventado.
  - vmid: 9101
    name: fw-wan-edge
    chr: true
    tags: [ansible-managed, firewall, borde]
    description: |
      <b>fw-wan-edge</b> — firewall de borde. <b>Filtra el perímetro</b> y es el único que hace NAT hacia internet.
      
      <b>IDENTIDAD</b>
      <table>
       <tr><td>vmid</td><td>9101</td></tr>
       <tr><td>Tipo</td><td>Máquina virtual (RouterOS CHR)</td></tr>
       <tr><td>Dónde</td><td>el borde de la empresa</td></tr>
       <tr><td>Rol</td><td>firewall</td></tr>
       <tr><td>Tags</td><td><code>ansible-managed</code> <code>firewall</code> <code>borde</code></td></tr>
      </table>
      
      <b>CONEXIONES</b>
      <table>
       <tr><th>Pata</th><th>Interfaz</th><th>Cable (bridge)</th><th>MAC</th><th>Al otro extremo</th></tr>
       <tr><td>net0</td><td>ether1</td><td><code>vmbr1</code></td><td><code>BC:24:11:00:49:01</code></td><td>segmento compartido (12 patas)</td></tr>
       <tr><td>net1</td><td>ether2</td><td><code>vmbr13</code></td><td><code>BC:24:11:00:49:02</code></td><td>fw-s1-perim ether5</td></tr>
      </table>
      
      Cada cable es un <b>bridge de Proxmox sin puerto físico</b>: un segmento de capa 2. Este invitado tiene una pata en un <b>segmento compartido</b> (<code>vmbr1</code>), donde no hay un "otro extremo" único: ahí cuelgan las patas de administración de todos los equipos de red. Sus demás cables son punto a punto, con exactamente dos patas. Nada en el invitado sabe quién está al otro lado: lo aprende, igual que el hardware real.
      
      <b>CONFIGURACIÓN DECLARADA (RouterOS)</b>
      <table>
       <tr><th>Interfaz</th><th>Dirección de gestión</th></tr>
       <tr><td>ether1</td><td>10.10.10.34/24</td></tr>
       <tr><td>ether2</td><td>10.29.0.2/30</td></tr>
      </table>
      
      <b>Rutas</b>
      <table>
       <tr><th>Destino</th><th>Por dónde</th></tr>
       <tr><td>0.0.0.0/0</td><td>vía 10.10.10.1</td></tr>
       <tr><td>10.11.0.0/24</td><td>vía 10.29.0.1</td></tr>
       <tr><td>10.12.0.0/24</td><td>vía 10.29.0.1</td></tr>
       <tr><td>10.13.0.0/24</td><td>vía 10.29.0.1</td></tr>
       <tr><td>10.99.99.0/24</td><td>vía 10.10.10.1</td></tr>
      </table>
      
      <b>Filtrado y NAT</b>
      <table>
       <tr><td>Reglas de filtrado</td><td>6 (el orden importa: decide qué se acepta)</td></tr>
       <tr><td>Reglas de NAT</td><td>1</td></tr>
      </table>
      
      <b>DÓNDE ESTÁ</b>
      <pre>pc-s1-01  ──▶  sw-s1-acc-01  ──▶  rt-s1-core  ──▶  fw-s1-perim  ──▶  <b>fw-wan-edge</b> «ESTE»  ──▶  internet</pre>
      El camino está <b>medido</b> con traceroute desde una estación, no dibujado: es el que sigue un paquete de verdad.
      
      <b>POR QUÉ ASÍ</b>
      <ul>
      <li><b>El orden de las reglas es el que filtra</b>, así que la verificación relee la tabla y comprueba el orden, no sólo el conjunto.</li>
      <li><b>Es el único que hace NAT</b> (masquerade). Dentro de la empresa las direcciones son reales: por eso hay rutas de vuelta y no traducciones anidadas.</li>
      <li><b>Su pata exterior sale por la red de gestión</b> y el proveedor es el host. Ningún invitado va en el bridge público del nodo, así que nada queda expuesto.</li>
      </ul>
    net:
      net0: "virtio=BC:24:11:00:49:01,bridge=vmbr1"    # ether1 -> "proveedor" (red de gestion)
      net1: "virtio=BC:24:11:00:49:02,bridge=vmbr13"   # ether2 -> fw-s1-perim (transito de borde)
    config:
      routeros:
        identity: fw-wan-edge
        addresses:
          - address: "10.10.10.34/24"
            interface: ether1
          - address: "{{ lab_edge_fw }}/30"
            interface: ether2
        dhcp_client: false
        routes:
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_internet_gateway }}"
          - dst_address: "{{ lab_site1_network }}"
            gateway: "{{ lab_edge_core }}"
          - dst_address: "{{ lab_site2_network }}"
            gateway: "{{ lab_edge_core }}"
          - dst_address: "{{ lab_site3_network }}"
            gateway: "{{ lab_edge_core }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_internet_gateway }}"
        firewall:
          filter:
            - {chain: forward, action: accept, connection_state: "established,related"}
            - {chain: forward, action: accept, in_interface: ether2, out_interface: ether1}
            - {chain: forward, action: drop, connection_state: "new"}
            - {chain: input, action: accept, in_interface: ether1}
            - {chain: input, action: accept, connection_state: "established,related"}
            - {chain: input, action: drop}
          nat:
            - {chain: srcnat, action: masquerade, out_interface: ether1}

