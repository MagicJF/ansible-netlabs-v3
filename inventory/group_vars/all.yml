---
# ============================================================================
# ESTADO DECLARADO DEL LABORATORIO — ansible-netlab-v2
#
# Una sola fuente de verdad. Este fichero declara QUÉ existe y CÓMO está; los
# verbos (playbooks/*.yml) lo llevan a la realidad y lo verifican. Nada se toca
# por SSH al hipervisor: todo va por la API de Proxmox y por la API de RouterOS.
#
# ---------------------------------------------------------------------------
# QUÉ CAMBIA RESPECTO A LA v1 (proxmox-ansible-lxc-test)
# ---------------------------------------------------------------------------
#   1. Numeración de CUATRO dígitos en todos los invitados, con la ubicación
#      primero y el tipo de equipo después:   S T NN
#         S  = sede / ubicación   0=infra  1=central  2=delegación-2  3=delegación-3  9=borde
#         T  = tipo de equipo     1=firewall  2=router  3=switch  4=workstation  9=servicio
#         NN = índice dentro de ese tipo y sede
#      Así `1301` se lee "sede 1, switch, el primero" y `1401` "sede 1,
#      workstation, la primera". El número dice dónde está y qué es.
#
#   2. DISTINCIÓN DE FUNCIONES POR MÁQUINA. En la v1 cada sede tenía un router
#      que lo hacía todo. Aquí cada función es un equipo:
#        - el SWITCH   conmuta (L2), no enruta ni filtra;
#        - el ROUTER   es la PUERTA DE ENLACE y el servidor DHCP de su LAN, y
#                      enruta dentro de la empresa (entre sedes);
#        - el FIREWALL filtra el PERÍMETRO: está entre el router de su sede y la
#                      WAN, y entre el núcleo y el proveedor.
#
#      El orden de un paquete es:  pc -> sw -> rt -> fw -> WAN
#
#      Y no es una preferencia de estilo: el DHCP es un broadcast de CAPA 2, así
#      que quien reparte las direcciones tiene que estar en el MISMO segmento que
#      sus clientes. Un firewall de capa 3 en medio rompería el DHCP; por eso la
#      LAN cuelga del router y el firewall se pone DESPUÉS, de cara a la WAN.
#
#   3. SALIDA A INTERNET. La v1 era una red cerrada a propósito. Aquí el firewall
#      de borde (`fw-wan-edge`) sale por la red de gestión hacia el host Proxmox
#      (10.10.10.1) — el único gateway real del nodo, y está MEDIDO que da salida
#      — y hace NAT (masquerade) para toda la empresa. NO se pone ningún invitado
#      en vmbr0 (el bridge público): la salida va por la LAN de gestión, nunca
#      exponiendo la máquina a internet directamente. El NAT vive SÓLO en el
#      borde: los firewalls de sede filtran pero no traducen, así que dentro de la
#      empresa las direcciones son las reales y las rutas de vuelta existen.
#
#   4. NOMBRES DESCRIPTIVOS: sw-s1-acc-01, rt-s2-edge, fw-s3-perim, pc-s1-01,
#      fw-wan-edge, infra-bootstrap. El nombre dice el tipo, la sede y la
#      función; no hay que consultar nada para saber qué es cada máquina.
# ============================================================================

pve_node: Proxmox

# ---------------------------------------------------------------------------
# DIRECCIONAMIENTO
#
# Todas las direcciones de GESTIÓN viven en 10.10.10.0/24 (vmbr1), cuya puerta
# es el host Proxmox (10.10.10.1). Ese /24 no se puede ampliar sin reconfigurar
# el host, y el host no se toca (ver .hermes.md), así que la regla de la v1
# ("el último octeto es el vmid") NO cabe con cuatro dígitos: aquí las
# direcciones de gestión se asignan por BLOQUES DE FUNCIÓN.
#
#   10.10.10.1      el host Proxmox (NO es nuestro; es el gateway)
#   10.10.10.2      un invitado preexistente, AJENO a este repositorio
#   10.10.10.11-19  switches      (ST = 13/23/33)
#   10.10.10.21-29  routers       (ST = 12/22/32)
#   10.10.10.31-39  firewalls     (ST = 11/21/31, y el de borde 91)
#   10.10.10.41-49  infraestructura (ST = 09)
# ---------------------------------------------------------------------------
lab_mgmt_network: "10.10.10.0/24"
lab_mgmt_gateway: "10.10.10.1"

# LAN de cada sede: la red de sus estaciones. Cada sede es su propia red, así que
# un paquete de una sede a otra tiene que cruzar la topología (no hay atajo). Su
# puerta de enlace es el ROUTER de la sede, que es también quien reparte las
# direcciones por DHCP.
lab_site1_network: "10.11.0.0/24"
lab_site1_gateway: "10.11.0.1"
lab_site1_pool: "10.11.0.100-10.11.0.199"
lab_site2_network: "10.12.0.0/24"
lab_site2_gateway: "10.12.0.1"
lab_site2_pool: "10.12.0.100-10.12.0.199"
lab_site3_network: "10.13.0.0/24"
lab_site3_gateway: "10.13.0.1"
lab_site3_pool: "10.13.0.100-10.13.0.199"

# Enlaces WAN punto a punto. Ahora los terminan los FIREWALLS de cada sede (cada
# uno en su extremo de la WAN), no los routers: el firewall es la boca de la
# sede hacia fuera. Dos /30, no un segmento compartido, es lo que hace que una
# sede nueva no toque las demás.
lab_wan1_network: "10.99.1.0/30"
lab_wan1_hub: "10.99.1.1"
lab_wan1_spoke: "10.99.1.2"
lab_wan2_network: "10.99.2.0/30"
lab_wan2_hub: "10.99.2.1"
lab_wan2_spoke: "10.99.2.2"

# Tránsitos router<->firewall de cada sede, uno por sede (/30). Es el cable que
# separa LITERALMENTE la LAN del equipo que filtra: el router ve su LAN por
# dentro, el firewall la empresa por fuera.
lab_tr1_network: "10.21.0.0/30"
lab_tr1_fw: "10.21.0.1"
lab_tr1_rt: "10.21.0.2"
lab_tr2_network: "10.22.0.0/30"
lab_tr2_fw: "10.22.0.1"
lab_tr2_rt: "10.22.0.2"
lab_tr3_network: "10.23.0.0/30"
lab_tr3_fw: "10.23.0.1"
lab_tr3_rt: "10.23.0.2"

# El borde de la empresa: el firewall de la central entrega aquí todo lo que
# sale, y el firewall de borde lo NAT-ea hacia la red de gestión.
lab_edge_network: "10.29.0.0/30"
lab_edge_core: "10.29.0.1"
lab_edge_fw: "10.29.0.2"

# El "proveedor de internet" es el propio host Proxmox: es el único que tiene
# salida real, y está medido (TCP a internet desde la LAN de gestión funciona).
lab_internet_gateway: "10.10.10.1"
lab_internet_dns: "1.1.1.1"

# Red del nodo de control (el túnel). No es una red de la empresa: es el camino
# por el que ESTE nodo entra a gestionar.
lab_control_network: "10.99.99.0/24"
lab_control_via: "10.10.10.1"

# ---------------------------------------------------------------------------
# CLAVE DE AUTOMATIZACIÓN (fuera del repositorio; aquí sólo su RUTA)
# ---------------------------------------------------------------------------
pve_ssh_pubkey_path: "/home/hermes/.hermes/profiles/hermione/secrets/pve-automation_ed25519.pub"

# ---------------------------------------------------------------------------
# TÚNEL DE GESTIÓN (WireGuard)
#
# El control node no está en la LAN del laboratorio: entra por un túnel cuyo
# extremo vive en el host Proxmox. La mitad del host NO la puede configurar la
# API (sería ejecutar código en el hipervisor), así que se pega UNA vez con
# playbooks/tools/wg_endpoint_setup.sh — incluida la ruta por sede, que es el
# último argumento.
# ---------------------------------------------------------------------------
pve_tunnel:
  manage: true
  name: wg-lab
  endpoint: "54.36.168.83:51820"
  endpoint_public_key: "3+bBS+GqR4EtWUFst+2s49rneVguWquuRBGINt/tZXQ="
  address: "10.99.99.2/24"
  guest_network:
    - "10.10.10.0/24"   # la LAN de gestión (host y patas de gestión)
    - "10.11.0.0/24"    # SEDE 1 (central)
    - "10.12.0.0/24"    # SEDE 2
    - "10.13.0.0/24"    # SEDE 3
  # Rutas que el ENDPOINT (el host) necesita para entregar el tráfico del túnel
  # a cada LAN de sede. Se llega a la red de una sede por la pata de gestión de
  # su ROUTER (el que tiene esa LAN conectada), que es como se llega en la vida
  # real: por la pata de administración del equipo que es puerta de esa red.
  endpoint_routes:
    - to: "{{ lab_site1_network }}"
      via: "10.10.10.21"   # rt-s1-core
    - to: "{{ lab_site2_network }}"
      via: "10.10.10.22"   # rt-s2-edge
    - to: "{{ lab_site3_network }}"
      via: "10.10.10.23"   # rt-s3-edge
  private_key_path: "/home/hermes/.hermes/profiles/hermione/secrets/wg-lab-client"
  keepalive: 25

# ---------------------------------------------------------------------------
# SEGMENTOS DEL HOST (bridges, los "cables")
#
# Uno por CABLE, aislado (sin puertos de uplink), y el nombre del bridge aparece
# literal en sus dos puntas. El motor sólo CREA bridges: los que dejan de
# declararse se quedan en el host y se retiran por la API. Los comentarios de
# los segmentos que ya existen los pone el repositorio con una llamada aparte
# (playbooks/tools/segment_comments.py), porque el motor no los reescribe.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# ESQUEMA DE COLOR DE LAS ETIQUETAS (Datacenter -> Options -> Tag Style).
#
# No es decoración: es cómo se lee una máquina de un vistazo en el árbol del
# interfaz. Tres ejes y un color reservado:
#
#   ROJO            -> gestionado por ESTE repositorio. Si un invitado no lleva
#                      el rojo, este repositorio no lo declara y no lo toca.
#   color por ROL   -> qué es: switch, router, firewall, workstation, bootstrap.
#   color por SEDE  -> dónde está: central, delegación, borde, infraestructura.
#
# El vocabulario de etiquetas es corto a propósito (tres por invitado) y tiene
# que caber en la lista permitida del datacenter (`allowed-tags`), que PVE
# aplica: un tag que no esté allí lo rechaza.
# ---------------------------------------------------------------------------
pve_tag_style:
  # full dibuja la etiqueta entera en el árbol; circle y dense la abrevian, y
  # none la esconde. Con tres tags por invitado, "full" es lo que se lee.
  shape: full
  # Forma que almacena PVE (comprobada contra la API):
  #   color-map=<tag>:<color-de-fondo>[:<color-del-texto>];<tag>:...
  colors: "ansible-managed:b71c1c:ffffff;switch:1565c0:ffffff;router:2e7d32:ffffff;firewall:ef6c00:ffffff;workstation:455a64:ffffff;bootstrap:6a1b9a:ffffff;central:00838f:ffffff;delegacion:6d4c41:ffffff;borde:37474f:ffffff;infra:5e35b1:ffffff"

pve_bridges:
  # ---- SEDE 1 (central) -----------------------------------------------------
  - iface: vmbr4
    comments: "cable: pc-s1-01 eth0 <-> sw-s1-acc-01 ether2"
  - iface: vmbr5
    comments: "cable: pc-s1-02 eth0 <-> sw-s1-acc-01 ether3"
  - iface: vmbr6
    comments: "cable: pc-s1-03 eth0 <-> sw-s1-acc-02 ether2"
  - iface: vmbr7
    comments: "cable: pc-s1-04 eth0 <-> sw-s1-acc-02 ether3"
  - iface: vmbr8
    comments: "cable: sw-s1-acc-01 ether4 <-> sw-s1-acc-02 ether4 (troncal L2)"
  - iface: vmbr9
    comments: "cable: sw-s1-acc-01 ether5 <-> rt-s1-core ether2 (LA LAN DE LA SEDE 1, 10.11.0.0/24)"
  - iface: vmbr10
    comments: "cable: rt-s1-core ether3 <-> fw-s1-perim ether2 (transito 10.21.0.0/30)"
  - iface: vmbr11
    comments: "WAN 1: fw-s1-perim ether3 <-> fw-s2-perim ether3 (10.99.1.0/30)"
  - iface: vmbr12
    comments: "WAN 2: fw-s1-perim ether4 <-> fw-s3-perim ether3 (10.99.2.0/30)"
  - iface: vmbr13
    comments: "cable: fw-s1-perim ether5 <-> fw-wan-edge ether2 (transito de borde 10.29.0.0/30)"
  # ---- SEDE 2 (delegacion) --------------------------------------------------
  - iface: vmbr14
    comments: "cable: pc-s2-01 eth0 <-> sw-s2-acc-01 ether2"
  - iface: vmbr15
    comments: "cable: pc-s2-02 eth0 <-> sw-s2-acc-01 ether3"
  - iface: vmbr16
    comments: "cable: sw-s2-acc-01 ether4 <-> rt-s2-edge ether2 (LA LAN DE LA SEDE 2, 10.12.0.0/24)"
  - iface: vmbr17
    comments: "cable: rt-s2-edge ether3 <-> fw-s2-perim ether2 (transito 10.22.0.0/30)"
  # ---- SEDE 3 (delegacion) --------------------------------------------------
  - iface: vmbr18
    comments: "cable: pc-s3-01 eth0 <-> sw-s3-acc-01 ether2"
  - iface: vmbr19
    comments: "cable: pc-s3-02 eth0 <-> sw-s3-acc-01 ether3"
  - iface: vmbr20
    comments: "cable: sw-s3-acc-01 ether4 <-> rt-s3-edge ether2 (LA LAN DE LA SEDE 3, 10.13.0.0/24)"
  - iface: vmbr21
    comments: "cable: rt-s3-edge ether3 <-> fw-s3-perim ether2 (transito 10.23.0.0/30)"

# ---------------------------------------------------------------------------
# CONTENEDORES (LXC)
# ---------------------------------------------------------------------------
pve_defaults:
  # ---- creation-time: PVE cannot change these on an existing container ------
  template: "local:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst"
  template_storage: local
  storage: local-zfs
  rootfs_size: 8
  unprivileged: true
  ostype: debian

  # ---- power state ---------------------------------------------------------
  # started | stopped. En marcha: aplicar la declaración ES levantar el
  # laboratorio, y ese es el sentido de tenerlo declarado.
  status: started

  # ---- resources (converged in place) --------------------------------------
  memory: 2048
  swap: 512
  cores: 2
  cpuunits: 1024

  # ---- behaviour (converged in place) --------------------------------------
  onboot: false
  description: "Managed by ansible-netlab-v2. Declare changes in inventory/group_vars/all.yml."
  # Etiqueta base; cada invitado AÑADE las suyas (sede y papel) a esta lista.
  tags: [netlab, ansible-managed]
  timezone: host
  cmode: shell
  features: []
  startup: []

  # ---- network (converged in place; empty = no interface at all) ----------
  netif: {}
  nameserver: null
  searchdomain: null

  # ---- attachments (converged in place; empty = must not exist) -----------
  hookscript: null
  mounts: {}
  mount_devices: []

  # ---- the key at birth ----------------------------------------------------
  pubkey: "{{ lookup('file', pve_ssh_pubkey_path, errors='ignore') | default('', true) | trim }}"

# The containers this repository manages — and nothing else. A container absent
# from this list is never read, created or modified.
pve_containers:
  # ==========================================================================
  # 09xx — INFRAESTRUCTURA
  #
  # Lo mínimo para que el laboratorio nazca: el equipo que da a los routers su
  # primera dirección. No hay más servicios: esto describe una red de empresa,
  # no un parque de aplicaciones.
  # ==========================================================================

  # infra-bootstrap: concede a cada equipo de red su primera dirección por DHCP,
  # atada a su MAC, para que su API REST exista desde el primer arranque. Vive
  # en la LAN de gestión. Es la SALA DE PARTOS, no una dependencia de
  # funcionamiento: una vez cada equipo tiene su dirección, no interviene.
  - vmid: 901
    hostname: infra-bootstrap
    cores: 1
    memory: 1024
    rootfs_size: 4
    swap: 256
    onboot: true
    startup: ["order=1"]
    tags: [ansible-managed, bootstrap, infra]
    description: |
      <b>infra-bootstrap</b> — herramienta de despliegue. Da a cada equipo de red su <b>primera</b> dirección y no interviene en nada más.
      
      <b>IDENTIDAD</b>
      <table>
       <tr><td>vmid</td><td>901</td></tr>
       <tr><td>Tipo</td><td>Contenedor LXC (Debian 13, sin privilegios)</td></tr>
       <tr><td>Dónde</td><td>red de gestión</td></tr>
       <tr><td>Rol</td><td>bootstrap</td></tr>
       <tr><td>Tags</td><td><code>ansible-managed</code> <code>bootstrap</code> <code>infra</code></td></tr>
      </table>
      
      <b>CONEXIONES</b>
      <table>
       <tr><th>Pata</th><th>Interfaz</th><th>Cable (bridge)</th><th>MAC</th><th>Al otro extremo</th></tr>
       <tr><td>net0</td><td>eth0</td><td><code>vmbr1</code></td><td>—</td><td>segmento compartido (12 patas)</td></tr>
      </table>
      
      Cada cable es un <b>bridge de Proxmox sin puerto físico</b>: un segmento de capa 2. Este invitado tiene una pata en un <b>segmento compartido</b> (<code>vmbr1</code>), donde no hay un "otro extremo" único: ahí cuelgan las patas de administración de todos los equipos de red. Sus demás cables son punto a punto, con exactamente dos patas. Nada en el invitado sabe quién está al otro lado: lo aprende, igual que el hardware real.
      
      <b>CÓMO ESTÁ DIRIGIDA</b>
      <table>
       <tr><td>Dirección</td><td>None — <b>por DHCP</b>, reserva atada a su MAC</td></tr>
       <tr><td>Se la da</td><td>el <b>router de su sede</b> (no el switch ni el firewall): el DHCP es una difusión de capa 2 y el servidor tiene que estar en su mismo segmento</td></tr>
       <tr><td>Puerta de enlace</td><td>la del router de su sede (.1 de su red)</td></tr>
       <tr><td>Vía de gestión</td><td><b>ninguna.</b> Un PC de una empresa no se administra por una conexión entrante</td></tr>
      </table>
      
      <b>DÓNDE ESTÁ</b>
      <pre>
        infra-bootstrap ── vmbr1 (red de gestión) ──▶ todos los equipos
           «ESTE»            da la PRIMERA dirección a cada uno, una vez
      </pre>
      El camino está <b>medido</b> con traceroute desde una estación, no dibujado: es el que sigue un paquete de verdad.
      
      <b>POR QUÉ ASÍ</b>
      <ul>
      <li><b>Hace un solo trabajo y por eso existe.</b> La primera dirección de un CHR llega por una difusión que no cruza un enlace de capa 3, así que tiene que haber algo en su mismo segmento que se la dé. Después no vuelve a intervenir.</li>
      </ul>
    netif:
      net0: "name=eth0,bridge=vmbr1,gw=10.10.10.1,ip=10.10.10.41/24"
    manage: true
    config:
      bootstrap:
        interface: eth0
        # A qué tiene que saber VOLVER: las redes de las tres sedes. Sin esto
        # recibe los pings de una workstation y no puede contestarlos, porque su
        # ruta por defecto va al host y el host no enruta hacia el interior. El
        # gateway es el núcleo, que es el que conoce las tres sedes.
        routes:
          - "{{ lab_site1_network }}"
          - "{{ lab_site2_network }}"
          - "{{ lab_site3_network }}"
        route_gateway: "10.10.10.21"   # rt-s1-core
        hosts: >-
          {%- set out = [] -%}
          {%- for v in pve_vms | selectattr('chr', 'defined') -%}
          {%-   set mac = v.net.net0 | regex_replace('^.*virtio=([0-9A-Fa-f:]{17}).*$', '\\1') -%}
          {%-   set mgmt = v.config.routeros.addresses
                          | selectattr('interface', 'equalto', 'ether1') | first -%}
          {%-   set _ = out.append({'mac': mac,
                                    'address': mgmt.address.split('/')[0],
                                    'name': v.name}) -%}
          {%- endfor -%}
          {{ out }}

  # ==========================================================================
  # 14xx / 24xx / 34xx — LAS OCHO WORKSTATIONS
  #
  # Cada una es un PC: UNA sola NIC, en su propio segmento aislado (el latiguillo
  # hacia su switch) y SIN interfaz de gestión. Así se hace en una empresa: un PC
  # de oficina tiene un interfaz y recibe su dirección por DHCP; nadie le pone un
  # segundo NIC "de gestión" ni entra en él por SSH desde la red.
  #
  # Su dirección se la da por DHCP el ROUTER de su sede, con una reserva atada a
  # su MAC declarada aquí.
  # ==========================================================================

  - vmid: 1401
    hostname: pc-s1-01
    site: sede1
    address: "10.11.0.11"
    cores: 1
    memory: 256
    rootfs_size: 4
    swap: 256
    tags: [ansible-managed, workstation, central]
    onboot: true
    startup: ["order=3"]
    manage: true
    config:
      netlab:
        dhcp:
          timeout: 300
          retry: 30
    description: |
      <b>pc-s1-01</b> — workstation de la central (sede 1). Un PC de usuario: toma su dirección por DHCP y <b>no tiene ninguna vía de gestión</b>.
      
      <b>IDENTIDAD</b>
      <table>
       <tr><td>vmid</td><td>1401</td></tr>
       <tr><td>Tipo</td><td>Contenedor LXC (Debian 13, sin privilegios)</td></tr>
       <tr><td>Dónde</td><td>la central (sede 1)</td></tr>
       <tr><td>Rol</td><td>workstation</td></tr>
       <tr><td>Tags</td><td><code>ansible-managed</code> <code>workstation</code> <code>central</code></td></tr>
      </table>
      
      <b>CONEXIONES</b>
      <table>
       <tr><th>Pata</th><th>Interfaz</th><th>Cable (bridge)</th><th>MAC</th><th>Al otro extremo</th></tr>
       <tr><td>net0</td><td>eth0</td><td><code>vmbr4</code></td><td><code>BC:24:11:00:51:01</code></td><td>sw-s1-acc-01 ether2</td></tr>
      </table>
      
      Cada cable es un <b>bridge de Proxmox sin puerto físico</b>: un segmento de capa 2 al que se enchufan exactamente estas dos patas. Nada en el invitado sabe quién está al otro lado: lo aprende, igual que el hardware real.
      
      <b>CÓMO ESTÁ DIRIGIDA</b>
      <table>
       <tr><td>Dirección</td><td>10.11.0.11 — <b>por DHCP</b>, reserva atada a su MAC</td></tr>
       <tr><td>Se la da</td><td>el <b>router de su sede</b> (no el switch ni el firewall): el DHCP es una difusión de capa 2 y el servidor tiene que estar en su mismo segmento</td></tr>
       <tr><td>Puerta de enlace</td><td>la del router de su sede (.1 de su red)</td></tr>
       <tr><td>Vía de gestión</td><td><b>ninguna.</b> Un PC de una empresa no se administra por una conexión entrante</td></tr>
      </table>
      
      <b>DÓNDE ESTÁ</b>
      <pre><b>pc-s1-01</b> «ESTE»  ──▶  sw-s1-acc-01  ──▶  rt-s1-core  ──▶  fw-s1-perim  ──▶  fw-wan-edge  ──▶  internet</pre>
      El camino está <b>medido</b> con traceroute desde una estación, no dibujado: es el que sigue un paquete de verdad.
      
      <b>POR QUÉ ASÍ</b>
      <ul>
      <li><b>Una sola NIC y ninguna de gestión.</b> Así se hace en una empresa: el PC tiene un cable, y la administración de parque es un agente que <i>sale</i> hacia fuera. Por eso este invitado no aparece en el diario de la API como destino.</li>
      <li><b>Su dirección vive en la declaración, no en el equipo.</b> El <code>address:</code> de su ficha <i>es</i> la reserva que el router deriva: no hay dos sitios donde se puedan desincronizar.</li>
      </ul>
    netif:
