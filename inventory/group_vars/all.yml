            gateway: "10.10.10.23"

  # ==========================================================================
  # ROUTERS (ST = 2S) — son la PUERTA DE ENLACE y el SERVIDOR DHCP de su LAN, y
  # enrutan dentro de la empresa. No filtran: eso es del firewall.
  #
  # Su LAN cuelga de ether2 (por el cable al switch de su sede) y por eso pueden
  # repartir direcciones: el DHCP es broadcast L2 y el router está DENTRO de ese
  # segmento. Por ether3 hablan con su firewall, que es la boca hacia fuera.
  # ==========================================================================

  # rt-s1-core: el router de la central. Conoce las tres sedes (a través de su
  # firewall) y es el núcleo de la WAN interna.
  - vmid: 1201
    name: rt-s1-core
    chr: true
    tags: [ansible-managed, router, central]
    description: |
      <b>rt-s1-core</b> — router de la central (sede 1). Es la <b>puerta de enlace y el servidor DHCP</b> de su LAN, y conoce las demás sedes.
      
      <b>IDENTIDAD</b>
      <table>
       <tr><td>vmid</td><td>1201</td></tr>
       <tr><td>Tipo</td><td>Máquina virtual (RouterOS CHR)</td></tr>
       <tr><td>Dónde</td><td>la central (sede 1)</td></tr>
       <tr><td>Rol</td><td>router</td></tr>
       <tr><td>Tags</td><td><code>ansible-managed</code> <code>router</code> <code>central</code></td></tr>
      </table>
      
      <b>CONEXIONES</b>
      <table>
       <tr><th>Pata</th><th>Interfaz</th><th>Cable (bridge)</th><th>MAC</th><th>Al otro extremo</th></tr>
       <tr><td>net0</td><td>ether1</td><td><code>vmbr1</code></td><td><code>BC:24:11:00:21:01</code></td><td>segmento compartido (12 patas)</td></tr>
       <tr><td>net1</td><td>ether2</td><td><code>vmbr9</code></td><td><code>BC:24:11:00:21:02</code></td><td>sw-s1-acc-01 ether5</td></tr>
       <tr><td>net2</td><td>ether3</td><td><code>vmbr10</code></td><td><code>BC:24:11:00:21:03</code></td><td>fw-s1-perim ether2</td></tr>
      </table>
      
      Cada cable es un <b>bridge de Proxmox sin puerto físico</b>: un segmento de capa 2. Este invitado tiene una pata en un <b>segmento compartido</b> (<code>vmbr1</code>), donde no hay un "otro extremo" único: ahí cuelgan las patas de administración de todos los equipos de red. Sus demás cables son punto a punto, con exactamente dos patas. Nada en el invitado sabe quién está al otro lado: lo aprende, igual que el hardware real.
      
      <b>CONFIGURACIÓN DECLARADA (RouterOS)</b>
      <table>
       <tr><th>Interfaz</th><th>Dirección de gestión</th></tr>
       <tr><td>ether1</td><td>10.10.10.21/24</td></tr>
       <tr><td>ether2</td><td>10.11.0.1/24</td></tr>
       <tr><td>ether3</td><td>10.21.0.2/30</td></tr>
      </table>
      
      <b>Servidor DHCP de su sede</b>
      <table>
       <tr><td>Nombre</td><td>sede1</td></tr>
       <tr><td>Interfaz</td><td>ether2</td></tr>
       <tr><td>Rango que reparte</td><td>10.11.0.100-10.11.0.199</td></tr>
       <tr><td>Red de la LAN</td><td>10.11.0.0/24</td></tr>
       <tr><td>Puerta de enlace que anuncia</td><td>10.11.0.1</td></tr>
       <tr><td>DNS que anuncia</td><td>1.1.1.1</td></tr>
       <tr><td>Reservas</td><td>una por workstation de la sede, atada a su MAC</td></tr>
      </table>
      
      <b>Rutas</b>
      <table>
       <tr><th>Destino</th><th>Por dónde</th></tr>
       <tr><td>10.12.0.0/24</td><td>vía 10.21.0.1</td></tr>
       <tr><td>10.13.0.0/24</td><td>vía 10.21.0.1</td></tr>
       <tr><td>10.99.99.0/24</td><td>vía 10.10.10.1</td></tr>
       <tr><td>0.0.0.0/0</td><td>vía 10.21.0.1</td></tr>
      </table>
      
      <b>DÓNDE ESTÁ</b>
      <pre>pc-s1-01  ──▶  sw-s1-acc-01  ──▶  <b>rt-s1-core</b> «ESTE»  ──▶  fw-s1-perim  ──▶  fw-wan-edge  ──▶  internet</pre>
      El camino está <b>medido</b> con traceroute desde una estación, no dibujado: es el que sigue un paquete de verdad.
      
      <b>POR QUÉ ASÍ</b>
      <ul>
      <li><b>Da el DHCP de su LAN porque tiene que estar en su segmento.</b> El DHCP es una difusión de capa 2: un firewall de capa 3 en medio lo rompería. Por eso la LAN cuelga de él y el firewall se pone después, de cara a la WAN.</li>
      <li><b>El reparto es jerárquico:</b> la central conoce las dos redes remotas y las delegaciones salen por su firewall. Añadir una sede es una entrada y una ruta.</li>
      </ul>
    net:
      net0: "virtio=BC:24:11:00:21:01,bridge=vmbr1"    # ether1 gestion
      net1: "virtio=BC:24:11:00:21:02,bridge=vmbr9"    # ether2 -> sw-s1-acc-01 (LA LAN DE LA SEDE)
      net2: "virtio=BC:24:11:00:21:03,bridge=vmbr10"   # ether3 -> fw-s1-perim (transito)
    config:
      routeros:
        identity: rt-s1-core
        addresses:
          - address: "10.10.10.21/24"
            interface: ether1
          - address: "{{ lab_site1_gateway }}/24"
            interface: ether2
          - address: "{{ lab_tr1_rt }}/30"
            interface: ether3
        dhcp_client: false
        routes:
          # Las delegaciones y la salida, por su firewall.
          - dst_address: "{{ lab_site2_network }}"
            gateway: "{{ lab_tr1_fw }}"
          - dst_address: "{{ lab_site3_network }}"
            gateway: "{{ lab_tr1_fw }}"
          - dst_address: "{{ lab_control_network }}"
            gateway: "{{ lab_mgmt_gateway }}"
          - dst_address: "0.0.0.0/0"
            gateway: "{{ lab_tr1_fw }}"
        # El DHCP lo sirve AQUÍ, no en el firewall: es el router de la sede.
        dhcp_servers:
          - name: sede1
            interface: ether2
            address_pool: "{{ lab_site1_pool }}"
            network: "{{ lab_site1_network }}"
            gateway: "{{ lab_site1_gateway }}"
            dns_server: "{{ lab_internet_dns }}"
            # Una reserva por workstation DE ESTA SEDE. Dirección y MAC salen de
            # la declaración de la propia workstation: aquí no se repite ningún
            # valor, así que no pueden desincronizarse.
            leases: >-
              {%- set out = [] -%}
              {%- for c in pve_containers
                     | selectattr('site', 'defined')
                     | selectattr('site', 'equalto', 'sede1') -%}
              {%-   set _ = out.append({
                    'address': c.address,
                    'mac_address': c.netif.net0 | regex_replace('^.*hwaddr=([0-9A-Fa-f:]{17}).*$', '\\1'),
                    'comment': c.hostname }) -%}
              {%- endfor -%}
              {{ out }}

