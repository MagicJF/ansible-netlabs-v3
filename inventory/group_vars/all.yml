  # ==========================================================================
  # FIREWALLS (ST = 1S, y 91 el de borde) — filtran el PERÍMETRO. Están entre el
  # router de su sede y la WAN: no son la puerta de nadie ni dan DHCP, son el
  # filtro por el que sale (y entra) el tráfico de la sede.
  #
  # El NAT vive SÓLO en el de borde: dentro de la empresa las direcciones son las
  # reales, así que las rutas de vuelta existen y no hay traducciones anidadas.
  # ==========================================================================

